<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2D Survival PvP - Online & Menü</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 1. GİRİŞ EKRANI -->
    <div id="login-screen" class="screen active" style="z-index: 9999; position: absolute;">
        <h1 style="font-size: 26px; margin-bottom: 20px; text-shadow: 0 0 10px #3498db; pointer-events: none;">⚔️ SURVIVAL PVP</h1>
        <input type="text" id="username-input" class="input-box" placeholder="Kullanıcı Adı" maxlength="15" autocomplete="off" autocapitalize="off">
        <button class="btn" onclick="handleLogin()">Giriş Yap</button>
    </div>

    <!-- 2. ANA MENÜ EKRANI -->
    <div id="menu-screen" class="screen">
        <h2 id="welcome-text" style="margin-bottom: 15px; color: #2ecc71;">Hoş Geldin</h2>
        <button class="btn btn-green" onclick="createRoom()">Oda Kur (Lobi)</button>
        <button class="btn btn-blue" onclick="joinRoomPrompt()">Kod ile Odaya Katıl</button>
        <button class="btn" style="background: #e67e22;" onclick="openRoomList()">Açık Odalar</button>
        <button class="btn" style="background: #7f8c8d;" onclick="logout()">Çıkış Yap</button>
    </div>

    <!-- 2.5. AÇIK ODALAR LİSTESİ MODALI -->
    <div class="modal" id="room-list-modal" style="display:none; z-index: 200;">
        <div class="modal-header">
            <span>Aktif Odalar (Canlı)</span>
            <button class="close-btn" onclick="closeRoomList()">X</button>
        </div>
        <div id="active-rooms-container" style="display:flex; flex-direction:column; gap:8px; max-height:200px; overflow-y:auto;">
            <!-- Canlı odalar buraya dolacak -->
        </div>
    </div>

    <!-- 3. OYUN EKRANI -->
    <div id="game-screen" class="screen">
        <div id="ui">
            <div class="panel">
                ❤️ <span id="hp-val">100</span> | 🍖 <span id="hunger-val">100</span> | Oda: <span id="room-code-display"></span>
            </div>
            <div class="panel" style="display:flex; gap:10px; align-items:center;">
                <span>🪵<span id="i-wood">5</span> 🪨<span id="i-stone">2</span></span>
                <!-- OYUN İÇİ ANA MENÜYE DÖNME / ÇIKIŞ TUŞU -->
                <button class="craft-btn" style="background:#e74c3c; padding:4px 8px;" onclick="returnToMainMenu()">Ana Menü</button>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="joystick-base">
            <div id="joystick-knob"></div>
        </div>
        
        <div class="action-container">
            <div class="btn-round" id="btn-interact">🛠️ Masa</div>
            <div class="btn-round" id="btn-inv">🎒</div>
            <div class="btn-round" id="btn-attack">⚔️</div>
        </div>
    </div>

    <!-- Crafting Menüsü -->
    <div class="modal" id="craft-modal">
        <div class="modal-header">
            <span id="modal-title">Çalışma Masası</span>
            <button class="close-btn" onclick="closeModals()">X</button>
        </div>
        <div id="craft-list">
            <div class="item-row">
                <span>⚔️ Demir Kılıç (Gerek: 4 Demir, 2 Odun)</span>
                <button class="craft-btn" onclick="craftItem('sword', 2, 4)">Yap</button>
            </div>
        </div>
    </div>

    <!-- Envanter Menüsü -->
    <div class="modal" id="inv-modal">
        <div class="modal-header">
            <span>Çanta ve Eşyalar</span>
            <button class="close-btn" onclick="closeModals()">X</button>
        </div>
        <div id="inv-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        <div style="margin-top:10px; border-top:1px solid #444; padding-top:8px;">
            <button class="craft-btn" style="width:100%; background:#e67e22;" onclick="placeWorkbench()">Çalışma Masasını Kur (5 Odun, 3 Taş)</button>
        </div>
    </div>

    <script type="module" src="firebase-config.js"></script>
    <script type="module" src="game.js"></script>
</body>
</html>
