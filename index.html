<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Minecraft 3D Kostüm Stüdyosu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #0b0f19; 
            color: #f8fafc; 
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif; 
            overflow: hidden; 
        }
        
        /* Özel Kaydırma Çubuğu */
        .shelf-scroll::-webkit-scrollbar { width: 6px; }
        .shelf-scroll::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
        .shelf-scroll::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
        .shelf-scroll::-webkit-scrollbar-thumb:hover { background: #60a5fa; }

        canvas { touch-action: none; }

        /* Kart Parlama Efekti */
        .costume-card-active {
            border-color: #3b82f6 !important;
            background: linear-gradient(135deg, rgba(30, 58, 138, 0.4) 0%, rgba(15, 23, 42, 0.8) 100%);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col select-none">

    <!-- ÜST BAR / HEADER (Güvenli Alan Padding'li) -->
    <header class="h-16 bg-slate-900/95 border-b border-slate-800 flex items-center justify-between px-6 z-20 shrink-0 shadow-lg">
        <div class="flex items-center gap-3">
            <span class="text-2xl p-2 bg-blue-600/20 border border-blue-500/30 rounded-xl">👕</span>
            <div>
                <h1 class="font-bold text-base md:text-lg text-slate-100 tracking-wide">Minecraft 3D Kostüm Stüdyosu</h1>
                <p class="text-[11px] text-slate-400 hidden sm:block">Kostüm tasarla, 3D incele ve oyuna aktar</p>
            </div>
        </div>

        <!-- ÜST BUTONLAR (Köşelerden Uzak, Rahat Erişim) -->
        <div class="flex items-center gap-2 sm:gap-3">
            <button id="btn-save-snapshot" title="3D Sahne Resmini İndir" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-semibold rounded-xl border border-slate-700 text-slate-200 transition flex items-center gap-1.5 shadow-md">
                <span>📸</span> <span class="hidden md:inline">3D Resim</span>
            </button>
            <button id="btn-download-texture" title="64x64 PNG Dokusunu İndir" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 active:scale-95 text-xs font-semibold rounded-xl border border-slate-700 text-slate-200 transition flex items-center gap-1.5 shadow-md">
                <span>💾</span> <span class="hidden md:inline">Doku İndir</span>
            </button>
            <label title="Bilgisayardan Skin / Doku Yükle" class="px-3.5 py-2 bg-blue-600 hover:bg-blue-500 active:scale-95 text-xs font-bold rounded-xl text-white cursor-pointer transition flex items-center gap-1.5 shadow-lg shadow-blue-600/30">
                <span>📂</span> <span>Skin Yükle</span>
                <input type="file" id="input-upload-skin" accept="image/png" class="hidden">
            </label>
        </div>
    </header>

    <!-- İKİYE BÖLÜNMÜŞ ANA EKRAN (SPLIT SCREEN) -->
    <main class="flex-1 flex overflow-hidden relative">

        <!-- SOL TARAF: KOSTÜM RAFI (UP/DOWN SCROLL) -->
        <section class="w-80 md:w-96 bg-slate-900/90 border-r border-slate-800 flex flex-col p-4 shrink-0 z-10">
            <!-- RAF BAŞLIĞI & YENİ EKLE BUTONU -->
            <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="text-sm">📦</span>
                    <h2 class="font-bold text-slate-200 text-xs tracking-wider uppercase">Kostüm Rafı</h2>
                </div>
                <button id="btn-add-costume" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold text-xs rounded-xl flex items-center gap-1.5 shadow-lg shadow-emerald-600/20 transition">
                    <span class="text-base leading-none">+</span>
                    <span>Yeni Kostüm</span>
                </button>
            </div>

            <!-- KOSTÜM LİSTESİ (CANLI 3D MİNYATÜR KARTLAR) -->
            <div id="costume-list" class="flex-1 overflow-y-auto shelf-scroll space-y-3.5 pr-1.5">
                <!-- Dinamik Kostüm Kartları Buraya Eklenecek -->
            </div>
        </section>

        <!-- SAĞ TARAF: ÇALIŞMA ALANI (3D / 2D VIEWPORT) -->
        <section class="flex-1 flex flex-col relative bg-slate-950 overflow-hidden">

            <!-- MOD DEĞİŞTİRME VE YATAK BUTONLARI (ÜST SOL - GÜVENLİ MESAFA) -->
            <div class="absolute top-6 left-6 z-10 flex flex-wrap gap-2.5">
                <button id="btn-mode-3d" class="px-4 py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-xl border border-blue-400/50 flex items-center gap-2 transition active:scale-95">
                    <span>🧊</span> <span>3D İncele (360°)</span>
                </button>
                <button id="btn-mode-2d" class="px-4 py-2.5 bg-slate-800/90 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-xl border border-slate-700 flex items-center gap-2 transition active:scale-95 backdrop-blur-md">
                    <span>✏️</span> <span>2D Doku Düzenle</span>
                </button>
                <button id="btn-toggle-bed" class="px-3.5 py-2.5 bg-slate-800/90 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-xl border border-slate-700 flex items-center gap-2 transition active:scale-95 backdrop-blur-md" title="Karakteri Yatak Konumuna Getir">
                    <span>🛏️</span> <span class="hidden sm:inline">Yatak Modu</span>
                </button>
            </div>

            <!-- SAĞ ÜST YARDIMCI İPUCU -->
            <div class="absolute top-6 right-6 z-10 hidden lg:flex items-center gap-2 bg-slate-900/80 border border-slate-800 text-slate-400 text-xs px-3.5 py-2 rounded-xl backdrop-blur-md">
                <span>🖱️ Fare sol tık ile 360° döndür, sağ tık ile kaydır, tekerlek ile yakınlaş.</span>
            </div>

            <!-- AKTİF KOSTÜM EYLEM BUTONLARI (ALT ORTA - KÖŞELERDEN UZAK GÜVENLİ ALAN) -->
            <div class="absolute bottom-8 left-1/2 -translate-x-1/2 z-10 bg-slate-900/90 backdrop-blur-md border border-slate-700/80 p-2.5 rounded-2xl shadow-2xl flex items-center gap-3">
                <button id="btn-use" title="Bu kostümü aktif olarak karaktere giydir" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs font-bold rounded-xl shadow-lg shadow-emerald-600/30 transition flex items-center gap-1.5">
                    <span>✓</span> <span>Kullan</span>
                </button>
                <button id="btn-edit" title="Kostüm düzenleme moduna geç" class="px-5 py-2.5 bg-amber-600 hover:bg-amber-500 active:scale-95 text-white text-xs font-bold rounded-xl shadow-lg shadow-amber-600/30 transition flex items-center gap-1.5">
                    <span>✏️</span> <span>Değiştir</span>
                </button>
                <button id="btn-delete" title="Seçili kostümü raftan sil" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-500 active:scale-95 text-white text-xs font-bold rounded-xl shadow-lg shadow-rose-600/30 transition flex items-center gap-1.5">
                    <span>🗑️</span> <span>Sil</span>
                </button>
            </div>

            <!-- 3D VIEWPORT CONTAINER -->
            <div id="container-3d" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

            <!-- 2D EDIT CONTAINER (ÇİZİM VE DÜZENLEME ALANI - GİZLİ BAŞLAR) -->
            <div id="container-2d" class="w-full h-full hidden flex-col items-center justify-center p-6 bg-slate-950/90 backdrop-blur-md z-20 overflow-auto">
                
                <!-- ARAÇ BARI (KALEM, SİLGİ, RENK VE KAYDET) -->
                <div class="mb-4 flex flex-wrap items-center justify-between gap-3 bg-slate-900 p-3 rounded-2xl border border-slate-800 shadow-2xl w-full max-w-lg">
                    <div class="flex items-center gap-2">
                        <label title="Renk Seç" class="relative cursor-pointer">
                            <input type="color" id="color-picker" value="#3b82f6" class="w-9 h-9 rounded-xl border-2 border-slate-700 bg-transparent cursor-pointer p-0">
                        </label>
                        <button id="tool-pencil" class="px-3.5 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl border border-blue-400/30 shadow-md flex items-center gap-1 transition">
                            <span>✏️</span> Kalem
                        </button>
                        <button id="tool-eraser" class="px-3.5 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 shadow-md flex items-center gap-1 transition">
                            <span>🧹</span> Silgi
                        </button>
                    </div>

                    <button id="btn-save-2d" class="px-5 py-2 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white text-xs font-bold rounded-xl shadow-lg shadow-emerald-600/30 flex items-center gap-1.5 transition ml-auto">
                        <span>💾</span> <span>Kaydet & Uygula</span>
                    </button>
                </div>

                <!-- 2D ÇİZİM KANVASI (64x64 PİKSEL MAP MAPPING) -->
                <div class="relative border-4 border-slate-800 rounded-2xl overflow-hidden bg-slate-900 shadow-2xl">
                    <canvas id="canvas-2d" width="512" height="512" class="cursor-crosshair block"></canvas>
                </div>
                <p class="text-xs text-slate-400 mt-3">💡 Tuval üzerine tıklayarak veya sürükleyerek piksel piksel çizim yapabilirsiniz.</p>
            </div>

        </section>

    </main>

    <!-- BİLDİRİM TOAST MODAL -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 bg-slate-900 border border-slate-700 text-slate-100 px-4 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <span id="toast-icon">✅</span>
        <span id="toast-msg" class="text-xs font-bold">İşlem tamamlandı!</span>
    </div>

    <script>
        // GLOBAL DEĞİŞKENLER
        let mainScene, mainCamera, mainRenderer, mainControls;
        let mainCharacterGroup, mainTexture, mainMaterial;
        let activeCostumeId = 1;
        let isSleeping = false;
        let currentTool = 'pencil';

        // Kostüm Listesi Veri Yapısı
        let costumes = [
            { id: 1, name: "Savaşçı Kostümü", color: "#ef4444", canvas: null },
            { id: 2, name: "Mecaga Özel", color: "#8b5cf6", canvas: null },
            { id: 3, name: "Şövalye Zırhı", color: "#10b981", canvas: null }
        ];

        // 2D Çizim Kanvası Bağlantıları
        const displayCanvas = document.getElementById('canvas-2d');
        const displayCtx = displayCanvas.getContext('2d');

        // Bildirim Gösterme
        function showToast(msg, icon = "✅") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-msg').innerText = msg;
            document.getElementById('toast-icon').innerText = icon;
            toast.classList.remove('translate-y-20', 'opacity-0');
            setTimeout(() => {
                toast.classList.add('translate-y-20', 'opacity-0');
            }, 2500);
        }

        // Temel 64x64 Minecraft Doku Oluşturucu
        function createBaseTextureCanvas(baseColorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 64; 
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            // Arka Plan / Zırh Rengi
            ctx.fillStyle = baseColorHex;
            ctx.fillRect(0, 0, 64, 64);

            // Baş / Yüz Bölgesi (Minecraft Standardı UV)
            ctx.fillStyle = '#ffdbac'; // Ten Rengi
            ctx.fillRect(8, 8, 8, 8); // Ön Yüz

            // Saç
            ctx.fillStyle = '#451a03';
            ctx.fillRect(8, 0, 8, 8);

            // Gözler
            ctx.fillStyle = '#2563eb';
            ctx.fillRect(9, 11, 2, 2);
            ctx.fillRect(13, 11, 2, 2);

            // Gövde Vurgusu
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(20, 20, 8, 12);
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(22, 22, 4, 4);

            return canvas;
        }

        // Seçili Kostümün Kanvasını Al
        function getActiveCostume() {
            return costumes.find(c => c.id === activeCostumeId) || costumes[0];
        }

        // 2D Tuval Düzenleme Çizimini Güncelle
        function updateDisplayCanvas() {
            const active = getActiveCostume();
            if (!active || !active.canvas) return;

            displayCtx.imageSmoothingEnabled = false;
            displayCtx.clearRect(0, 0, 512, 512);
            displayCtx.drawImage(active.canvas, 0, 0, 512, 512);

            // Piksel Izgarası
            displayCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            displayCtx.lineWidth = 1;
            for (let i = 0; i <= 512; i += 8) {
                displayCtx.beginPath(); displayCtx.moveTo(i, 0); displayCtx.lineTo(i, 512); displayCtx.stroke();
                displayCtx.beginPath(); displayCtx.moveTo(0, i); displayCtx.lineTo(512, i); displayCtx.stroke();
            }
        }

        // Ana 3D Karakter Dokusunu Yenile
        function updateMain3DTexture() {
            const active = getActiveCostume();
            if (!active || !active.canvas) return;

            if (mainTexture) {
                mainTexture.image = active.canvas;
                mainTexture.needsUpdate = true;
            }
        }

        // Karakter Gövde Parçası Üreten Yardımcı
        function createCharacterMesh(w, h, d, x, y, z, material) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mesh = new THREE.Mesh(geo, material);
            mesh.position.set(x, y, z);
            
            // Kenar Vurgu Çizgileri
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 1 }));
            mesh.add(line);
            return mesh;
        }

        // ANA 3D SAHNE BAŞLATMA
        function initMain3D() {
            const container = document.getElementById('container-3d');
            mainScene = new THREE.Scene();
            mainScene.background = new THREE.Color(0x0b0f19);

            mainCamera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            mainCamera.position.set(0, 1.2, 4.8);

            mainRenderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            mainRenderer.setSize(container.clientWidth, container.clientHeight);
            mainRenderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(mainRenderer.domElement);

            mainControls = new THREE.OrbitControls(mainCamera, mainRenderer.domElement);
            mainControls.enableDamping = true;
            mainControls.dampingFactor = 0.05;

            // Işıklandırma
            const dirLight = new THREE.DirectionalLight(0xffffff, 1.1);
            dirLight.position.set(3, 5, 4);
            mainScene.add(dirLight);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            mainScene.add(ambientLight);

            // Zemin Izgarası
            const grid = new THREE.GridHelper(10, 10, 0x334155, 0x1e293b);
            grid.position.y = -2.01;
            mainScene.add(grid);

            // Aktif Doku
            const active = getActiveCostume();
            mainTexture = new THREE.CanvasTexture(active.canvas);
            mainTexture.magFilter = THREE.NearestFilter;
            mainTexture.minFilter = THREE.NearestFilter;

            mainMaterial = new THREE.MeshStandardMaterial({
                map: mainTexture,
                roughness: 0.7,
                metalness: 0.1
            });

            // Steve Modeli Parçaları
            mainCharacterGroup = new THREE.Group();
            mainCharacterGroup.add(createCharacterMesh(0.8, 0.8, 0.8, 0, 0.8, 0, mainMaterial));   // Kafa
            mainCharacterGroup.add(createCharacterMesh(0.8, 1.2, 0.4, 0, -0.2, 0, mainMaterial));  // Gövde
            mainCharacterGroup.add(createCharacterMesh(0.4, 1.2, 0.4, -0.6, -0.2, 0, mainMaterial));// Sol Kol
            mainCharacterGroup.add(createCharacterMesh(0.4, 1.2, 0.4, 0.6, -0.2, 0, mainMaterial)); // Sağ Kol
            mainCharacterGroup.add(createCharacterMesh(0.4, 1.2, 0.4, -0.2, -1.4, 0, mainMaterial));// Sol Bacak
            mainCharacterGroup.add(createCharacterMesh(0.4, 1.2, 0.4, 0.2, -1.4, 0, mainMaterial)); // Sağ Bacak

            mainScene.add(mainCharacterGroup);

            animateMain();
        }

        function animateMain() {
            requestAnimationFrame(animateMain);
            if (mainControls) mainControls.update();
            if (mainRenderer && mainScene && mainCamera) {
                mainRenderer.render(mainScene, mainCamera);
            }
        }

        // SOL TARAF: KOSTÜM RAFI VE DİNAMİK 3D MİNYATÜR KARTLAR
        const miniRenderers = [];

        function renderCostumeShelf() {
            const listEl = document.getElementById('costume-list');
            listEl.innerHTML = '';
            miniRenderers.length = 0; // Eski oluşturulmuş mini sahneleri temizle

            costumes.forEach(c => {
                const isActive = c.id === activeCostumeId;
                const card = document.createElement('div');
                card.className = `costume-card p-3 rounded-2xl border transition-all duration-200 cursor-pointer flex items-center justify-between ${
                    isActive ? 'costume-card-active border-blue-500' : 'bg-slate-800/50 border-slate-700/70 hover:bg-slate-800'
                }`;

                const miniCanvasId = `mini-canvas-${c.id}`;

                card.innerHTML = `
                    <div class="flex items-center gap-3.5 w-full">
                        <!-- 3D CANLI MİNYATÜR ÖNİZLEME KANVASI -->
                        <div class="w-16 h-16 rounded-xl bg-slate-950 border border-slate-700/80 overflow-hidden shrink-0 relative">
                            <canvas id="${miniCanvasId}" class="w-full h-full block"></canvas>
                        </div>

                        <!-- BİLGİ ALANI -->
                        <div class="flex-1 min-w-0">
                            <div class="font-bold text-xs text-slate-100 truncate">${c.name}</div>
                            <div class="text-[10px] text-slate-400 mt-0.5">ID: #${c.id.toString().slice(-4)}</div>
                            <div class="mt-1.5 flex items-center gap-1.5">
                                <span class="w-2.5 h-2.5 rounded-full inline-block" style="background-color: ${c.color}"></span>
                                <span class="text-[10px] font-semibold text-slate-300">${isActive ? '● Aktif Kostüm' : 'Hazır'}</span>
                            </div>
                        </div>
                    </div>
                `;

                card.onclick = () => selectCostume(c.id);
                listEl.appendChild(card);

                // Kart İçi Mini 3D Sahneyi Oluştur
                setTimeout(() => initMini3D(miniCanvasId, c.canvas), 50);
            });
        }

        // Kart İçi 3D Mini Model Başlatma
        function initMini3D(canvasId, costumeCanvas) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            const miniRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
            miniRenderer.setSize(64, 64);
            miniRenderer.setPixelRatio(1);

            const miniScene = new THREE.Scene();
            const miniCamera = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
            miniCamera.position.set(0, 0.2, 3.8);

            const light = new THREE.DirectionalLight(0xffffff, 1.2);
            light.position.set(1, 2, 2);
            miniScene.add(light);
            miniScene.add(new THREE.AmbientLight(0xffffff, 0.7));

            const texture = new THREE.CanvasTexture(costumeCanvas);
            texture.magFilter = THREE.NearestFilter;
            texture.minFilter = THREE.NearestFilter;

            const material = new THREE.MeshStandardMaterial({ map: texture });
            const miniGroup = new THREE.Group();

            miniGroup.add(createCharacterMesh(0.8, 0.8, 0.8, 0, 0.8, 0, material));
            miniGroup.add(createCharacterMesh(0.8, 1.2, 0.4, 0, -0.2, 0, material));
            miniGroup.add(createCharacterMesh(0.4, 1.2, 0.4, -0.6, -0.2, 0, material));
            miniGroup.add(createCharacterMesh(0.4, 1.2, 0.4, 0.6, -0.2, 0, material));
            miniGroup.add(createCharacterMesh(0.4, 1.2, 0.4, -0.2, -1.4, 0, material));
            miniGroup.add(createCharacterMesh(0.4, 1.2, 0.4, 0.2, -1.4, 0, material));

            miniScene.add(miniGroup);

            function animateMini() {
                requestAnimationFrame(animateMini);
                miniGroup.rotation.y += 0.02; // Sürekli Yavaş Dönüş
                miniRenderer.render(miniScene, miniCamera);
            }
            animateMini();
        }

        // Kostüm Seçme
        function selectCostume(id) {
            activeCostumeId = id;
            updateMain3DTexture();
            updateDisplayCanvas();
            renderCostumeShelf();
        }

        // PENCERE BOYUTLANDIRMA
        window.addEventListener('resize', () => {
            const container = document.getElementById('container-3d');
            if (!container || !mainRenderer) return;
            mainCamera.aspect = container.clientWidth / container.clientHeight;
            mainCamera.updateProjectionMatrix();
            mainRenderer.setSize(container.clientWidth, container.clientHeight);
        });

        // DOM YÜKLENDİĞİNDE BAŞLAT
        document.addEventListener("DOMContentLoaded", () => {
            // Varsayılan Kostüm Kanvaslarını Doldur
            costumes.forEach(c => {
                c.canvas = createBaseTextureCanvas(c.color);
            });

            initMain3D();
            renderCostumeShelf();
            updateDisplayCanvas();

            // Mod Butonları Geçişleri
            const btn3D = document.getElementById('btn-mode-3d');
            const btn2D = document.getElementById('btn-mode-2d');
            const container3D = document.getElementById('container-3d');
            const container2D = document.getElementById('container-2d');

            btn3D.onclick = () => {
                container2D.classList.add('hidden');
                container2D.classList.remove('flex');
                container3D.classList.remove('hidden');
                btn3D.className = "px-4 py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-xl border border-blue-400/50 flex items-center gap-2 transition active:scale-95";
                btn2D.className = "px-4 py-2.5 bg-slate-800/90 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-xl border border-slate-700 flex items-center gap-2 transition active:scale-95 backdrop-blur-md";
            };

            btn2D.onclick = () => {
                updateDisplayCanvas();
                container3D.classList.add('hidden');
                container2D.classList.remove('hidden');
                container2D.classList.add('flex');
                btn2D.className = "px-4 py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-xl border border-blue-400/50 flex items-center gap-2 transition active:scale-95";
                btn3D.className = "px-4 py-2.5 bg-slate-800/90 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-xl border border-slate-700 flex items-center gap-2 transition active:scale-95 backdrop-blur-md";
            };

            // Yatak Modu
            document.getElementById('btn-toggle-bed').onclick = () => {
                isSleeping = !isSleeping;
                if (mainCharacterGroup) {
                    mainCharacterGroup.rotation.x = isSleeping ? -Math.PI / 2 : 0;
                    mainCharacterGroup.position.y = isSleeping ? -0.5 : 0;
                }
                showToast(isSleeping ? "Yatak Modu Açıldı 🛏️" : "Ayakta Modu Açıldı 🧍");
            };

            // Yeni Kostüm Ekle
            document.getElementById('btn-add-costume').onclick = () => {
                const newId = Date.now();
                const colors = ['#f59e0b', '#ec4899', '#06b6d4', '#10b981', '#3b82f6', '#8b5cf6'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                
                const newCostume = {
                    id: newId,
                    name: `Yeni Kostüm ${costumes.length + 1}`,
                    color: randomColor,
                    canvas: createBaseTextureCanvas(randomColor)
                };

                costumes.push(newCostume);
                selectCostume(newId);
                showToast("Yeni kostüm rafa eklendi!");
            };

            // Alt Eylem Butonları
            document.getElementById('btn-use').onclick = () => {
                updateMain3DTexture();
                showToast("Kostüm başarıyla giydirildi!");
            };

            document.getElementById('btn-edit').onclick = () => btn2D.click();

            document.getElementById('btn-delete').onclick = () => {
                if (costumes.length <= 1) {
                    showToast("En az bir kostüm rafta kalmalıdır!", "⚠️");
                    return;
                }
                costumes = costumes.filter(c => c.id !== activeCostumeId);
                selectCostume(costumes[0].id);
                showToast("Kostüm silindi!");
            };

            // 2D Çizim Mantığı
            let isDrawing = false;

            function draw(e) {
                const active = getActiveCostume();
                if (!active || !active.canvas) return;

                const ctx = active.canvas.getContext('2d');
                const rect = displayCanvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / (rect.width / 64));
                const y = Math.floor((e.clientY - rect.top) / (rect.height / 64));

                if (x >= 0 && x < 64 && y >= 0 && y < 64) {
                    if (currentTool === 'eraser') {
                        ctx.clearRect(x, y, 1, 1);
                    } else {
                        ctx.fillStyle = document.getElementById('color-picker').value;
                        ctx.fillRect(x, y, 1, 1);
                    }
                    updateDisplayCanvas();
                    updateMain3DTexture();
                }
            }

            displayCanvas.onpointerdown = (e) => { isDrawing = true; draw(e); };
            displayCanvas.onpointermove = (e) => { if (isDrawing) draw(e); };
            window.onpointerup = () => isDrawing = false;

            document.getElementById('tool-pencil').onclick = () => {
                currentTool = 'pencil';
                document.getElementById('tool-pencil').className = "px-3.5 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl border border-blue-400/30 shadow-md flex items-center gap-1 transition";
                document.getElementById('tool-eraser').className = "px-3.5 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 shadow-md flex items-center gap-1 transition";
            };

            document.getElementById('tool-eraser').onclick = () => {
                currentTool = 'eraser';
                document.getElementById('tool-eraser').className = "px-3.5 py-2 bg-blue-600 text-white text-xs font-bold rounded-xl border border-blue-400/30 shadow-md flex items-center gap-1 transition";
                document.getElementById('tool-pencil').className = "px-3.5 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 shadow-md flex items-center gap-1 transition";
            };

            document.getElementById('btn-save-2d').onclick = () => {
                updateMain3DTexture();
                renderCostumeShelf();
                showToast("Düzenlemeler kaydedildi!");
                btn3D.click();
            };

            // Dosya İndirme ve Yükleme İşlemleri
            document.getElementById('btn-save-snapshot').onclick = () => {
                mainRenderer.render(mainScene, mainCamera);
                const a = document.createElement('a');
                a.download = 'minecraft-costume-3d.png';
                a.href = mainRenderer.domElement.toDataURL('image/png');
                a.click();
                showToast("3D Resim indirildi!");
            };

            document.getElementById('btn-download-texture').onclick = () => {
                const active = getActiveCostume();
                if (!active || !active.canvas) return;
                const a = document.createElement('a');
                a.download = `${active.name.toLowerCase().replace(/\s+/g, '-')}-64x64.png`;
                a.href = active.canvas.toDataURL('image/png');
                a.click();
                showToast("Doku dosyası indirildi!");
            };

            document.getElementById('input-upload-skin').onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const img = new Image();
                    img.onload = () => {
                        const active = getActiveCostume();
                        const ctx = active.canvas.getContext('2d');
                        ctx.clearRect(0, 0, 64, 64);
                        ctx.drawImage(img, 0, 0, 64, 64);
                        updateDisplayCanvas();
                        updateMain3DTexture();
                        renderCostumeShelf();
                        showToast("Skin dokusu yüklendi!");
                    };
                    img.src = URL.createObjectURL(file);
                }
            };
        });
    </script>
</body>
</html>
