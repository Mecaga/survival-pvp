<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MCPE Envanter & Item Testi</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #1a1a1a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        /* --- MCPE HOTBAR (HIZLI ERİŞİM BARI) --- */
        #hotbar-container {
            position: absolute;
            bottom: 12px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(0, 0, 0, 0.55);
            padding: 5px;
            border-radius: 8px;
            border: 2px solid #555;
            z-index: 10;
        }
        .hotbar-slot {
            width: 44px;
            height: 44px;
            background: rgba(139, 139, 139, 0.4);
            border: 3px solid #3c3c3c;
            border-right-color: #8b8b8b;
            border-bottom-color: #8b8b8b;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }
        .hotbar-slot.active {
            border: 3px solid #ffffff;
            box-shadow: 0 0 10px rgba(255,255,255,0.8);
            background: rgba(200, 200, 200, 0.4);
        }
        .slot-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        /* --- ÇANTA BUTONU --- */
        #bag-btn {
            width: 44px;
            height: 44px;
            background: #4a6b22;
            border: 3px solid #2d4213;
            border-radius: 6px;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        #bag-btn:active {
            transform: scale(0.95);
        }

        /* --- MCPE ENVANTER PANELİ (MODAL) --- */
        #inventory-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        #inventory-window {
            width: 90%;
            max-width: 420px;
            background: #c6c6c6;
            border: 4px solid #ffffff;
            border-right-color: #555555;
            border-bottom-color: #555555;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            color: #333;
        }
        .inv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #8b8b8b;
            padding-bottom: 6px;
            font-weight: bold;
        }
        .close-btn {
            background: #c0392b;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .inv-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding: 4px;
            background: #8b8b8b;
            border: 3px solid #373737;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            border-radius: 4px;
        }
        .inv-slot {
            aspect-ratio: 1;
            background: #8b8b8b;
            border: 3px solid #373737;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .inv-slot:active {
            background: #aaa;
        }
    </style>
</head>
<body>
    <div id="info">Çantayı açmak için <b>"..."</b> butonuna dokunun veya <b>E</b> tuşuna basın.</div>
    
    <!-- Hotbar -->
    <div id="hotbar-container">
        <div id="hotbar-slots" style="display: flex; gap: 4px;"></div>
        <div id="bag-btn">...</div>
    </div>

    <!-- Envanter Ekranı -->
    <div id="inventory-overlay">
        <div id="inventory-window">
            <div class="inv-header">
                <span>Envanter / Eşyalar</span>
                <button class="close-btn" id="close-inv">X</button>
            </div>
            <div class="inv-grid" id="inv-grid"></div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Sahne ve Kamera Kurulumu
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Işıklar
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        // Zemin Bloğu
        const blockGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const blockMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const groundBlock = new THREE.Mesh(blockGeo, blockMat);
        groundBlock.position.set(0, -0.8, 0);
        scene.add(groundBlock);

        // 2. Envanter Verileri ve Eşyalar
        const items = [
            { id: 'deneme', name: 'Özel Eşya', icon: 'deneme.png' },
            { id: 'wood', name: 'Tahta', icon: 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/oak_planks.png' },
            { id: 'diamond', name: 'Elmas', icon: 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/item/diamond.png' },
            { id: 'sword', name: 'Kılıç', icon: 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/item/diamond_sword.png' },
            { id: 'apple', name: 'Elma', icon: 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/item/apple.png' }
        ];

        let hotbarData = ['deneme.png', null, null, null, null, null, null, null, null];
        let activeSlotIndex = 0;

        // 3. 3D MCPE Düşen Eşya Nesnesi
        let mcpeItemMesh = null;
        const textureLoader = new THREE.TextureLoader();
        const clock = new THREE.Clock();

        function update3DItem(textureUrl) {
            if (!textureUrl) {
                if (mcpeItemMesh) scene.remove(mcpeItemMesh);
                mcpeItemMesh = null;
                return;
            }

            textureLoader.load(textureUrl, (texture) => {
                if (mcpeItemMesh) scene.remove(mcpeItemMesh);

                const aspect = texture.image.width / texture.image.height;
                const height = 0.9;
                const width = height * aspect;

                const itemGeo = new THREE.PlaneGeometry(width, height);
                const itemMat = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    transparent: true, 
                    side: THREE.DoubleSide 
                });

                mcpeItemMesh = new THREE.Mesh(itemGeo, itemMat);
                mcpeItemMesh.position.set(0, 0.3, 0);
                scene.add(mcpeItemMesh);
            });
        }

        camera.position.set(0, 0.8, 2.5);
        camera.lookAt(0, 0, 0);

        // Initial 3D Item
        update3DItem(hotbarData[activeSlotIndex]);

        // 4. UI Rendering (Hotbar & Envanter)
        const hotbarSlotsEl = document.getElementById('hotbar-slots');
        const invGridEl = document.getElementById('inv-grid');

        function renderHotbar() {
            hotbarSlotsEl.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const slot = document.createElement('div');
                slot.className = `hotbar-slot ${i === activeSlotIndex ? 'active' : ''}`;
                
                if (hotbarData[i]) {
                    const img = document.createElement('img');
                    img.src = hotbarData[i];
                    img.className = 'slot-img';
                    slot.appendChild(img);
                }

                slot.addEventListener('click', () => {
                    activeSlotIndex = i;
                    renderHotbar();
                    update3DItem(hotbarData[activeSlotIndex]);
                });

                hotbarSlotsEl.appendChild(slot);
            }
        }

        function renderInventory() {
            invGridEl.innerHTML = '';
            items.forEach((item) => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot';
                
                const img = document.createElement('img');
                img.src = item.icon;
                img.className = 'slot-img';
                slot.appendChild(img);

                // Çantadaki eşyaya tıklayınca eldeki aktif slota yerleştir
                slot.addEventListener('click', () => {
                    hotbarData[activeSlotIndex] = item.icon;
                    renderHotbar();
                    update3DItem(hotbarData[activeSlotIndex]);
                    toggleInventory(false);
                });

                invGridEl.appendChild(slot);
            });
        }

        // Envanter Aç/Kapa
        const overlay = document.getElementById('inventory-overlay');
        function toggleInventory(show) {
            overlay.style.display = show ? 'flex' : 'none';
        }

        document.getElementById('bag-btn').addEventListener('click', () => toggleInventory(true));
        document.getElementById('close-inv').addEventListener('click', () => toggleInventory(false));

        window.addEventListener('keydown', (e) => {
            if (e.key === 'e' || e.key === 'E') {
                toggleInventory(overlay.style.display !== 'flex');
            }
        });

        // 5. Animasyon Döngüsü
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (mcpeItemMesh) {
                // MCPE Billboarding (Kameraya bakma)
                mcpeItemMesh.quaternion.copy(camera.quaternion);
                // Havada süzülme hareketi
                mcpeItemMesh.position.y = 0.3 + Math.sin(elapsedTime * 3) * 0.08;
            }

            renderer.render(scene, camera);
        }

        renderHotbar();
        renderInventory();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
