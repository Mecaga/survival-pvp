<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Survival PvP</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="lobby">
  <h1>Survival PvP</h1>
  <p id="hello"></p>
  <button id="create" class="big">Oda kur</button>
  <div class="row"><input id="code" maxlength="4" placeholder="Oda kodu" autocapitalize="characters"><button id="join">Katıl</button></div>
  <h2>Açık odalar</h2>
  <ul id="rooms"><li class="empty">Henüz oda yok. İlk odayı sen kur.</li></ul>
</div>
<div id="game" hidden>
  <canvas id="c"></canvas>
  <div id="hud"><div id="pos"></div><div id="hp"><i id="hpbar"></i></div><div id="inv"></div></div>
  <div id="roomtag"></div>
  <div id="toast"></div>
  <button id="atk">🔫</button>
</div>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="game.js"></script>
</body>
</html>
