<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Minecraft 64x64 Skin Studio</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            mcbg: '#0f0f12',
            mcpanel: '#18181c',
            mcaccent: '#2563eb',
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    
    html, body { 
      background-color: #0f0f12 !important; 
      color: #f4f4f5; 
      margin: 0; 
      padding: 0; 
      width: 100vw; 
      height: 100vh;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
    }
    
    canvas.pixelated {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
    }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    
    /* Sol Raf Kapanma Animasyonu */
    #shelfPanel {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), width 0.3s ease;
      flex-shrink: 0;
      height: 100%;
    }
    #shelfPanel.closed {
      transform: translateX(-100%);
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      border: none !important;
      overflow: hidden;
    }

    /* Sağ Üst 3D Panel Çekmece (İlk Açılışta Kapalı) */
    #floatingPanel {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    #floatingPanel.panel-closed {
      transform: translateX(110%);
      opacity: 0;
      pointer-events: none;
    }

    .grid-overlay {
      background-size: 16px 16px;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 255, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-[#0f0f12] text-gray-100 flex flex-col font-sans select-none">

  <!-- ÜST NAVBAR -->
  <header class="bg-mcpanel border-b border-zinc-800 px-4 py-2 flex items-center justify-between shrink-0 h-14 z-30 w-full">
    <div class="flex items-center gap-3">
      <div class="bg-red-600 text-white font-bold px-2.5 py-1 rounded text-xs tracking-wider flex items-center gap-1.5 shadow">
        <i data-lucide="box" class="w-4 h-4"></i> MC SKIN STUDIO
      </div>
      <h1 class="text-sm font-semibold text-zinc-300 hidden sm:block">Kostüm Rafı & 3D Voxel Düzenleyici</h1>
    </div>

    <!-- Sağ Üst Butonlar -->
    <div class="flex items-center gap-2">
      <button id="downloadSkinTopBtn" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-200 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 border border-zinc-700 transition">
        <i data-lucide="download" class="w-3.5 h-3.5 text-green-400"></i>
        <span class="hidden md:inline">Doku İndir</span>
      </button>

      <button id="toggleCornerPanelBtn" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-semibold flex items-center gap-2 transition shadow-lg border border-blue-400">
        <i data-lucide="box" class="w-4 h-4"></i>
        <span>3D Panel</span>
        <i data-lucide="chevron-left" id="panelChevron" class="w-3.5 h-3.5 transition-transform duration-300"></i>
      </button>
    </div>
  </header>

  <!-- ANA ÇALIŞMA ALANI CONTAINER -->
  <div class="flex-1 flex overflow-hidden relative w-full" style="height: calc(100vh - 3.5rem);">

    <!-- SOL TARAF: KOSTÜM RAFI -->
    <aside id="shelfPanel" class="w-72 sm:w-80 bg-mcpanel border-r border-zinc-800 flex flex-col p-3 gap-3 z-25">
      <div class="flex items-center justify-between pb-2 border-b border-zinc-800 shrink-0">
        <div class="flex items-center gap-2 text-xs font-bold text-zinc-300 uppercase tracking-wider">
          <i data-lucide="shirt" class="w-4 h-4 text-blue-400"></i>
          <span>Kostüm Rafı</span>
        </div>
        
        <div class="flex items-center gap-2">
          <button id="addCostumeBtn" class="bg-emerald-600 hover:bg-emerald-500 text-white px-2.5 py-1 rounded-lg text-xs font-bold flex items-center gap-1 shadow transition active:scale-95">
            <i data-lucide="plus" class="w-3.5 h-3.5"></i> Ekle
          </button>
          
          <button id="closeShelfBtn" class="bg-zinc-800 hover:bg-zinc-700 text-zinc-300 px-2 py-1 rounded-lg text-xs font-bold border border-zinc-700 transition" title="Rafı Kapat">
            ◀ Kapat
          </button>
        </div>
      </div>

      <!-- Raf İçindeki Kostüm Listesi -->
      <div id="costumeShelfList" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
    </aside>

    <!-- Raf Kapalıyken Sol Üstte Beliren Açma Butonu -->
    <button id="openShelfBtn" class="hidden fixed left-3 top-16 z-30 bg-blue-600 hover:bg-blue-500 text-white px-3 py-2 rounded-xl text-xs font-bold shadow-xl transition active:scale-95 border border-blue-400 flex items-center gap-1.5">
      <i data-lucide="panel-left-open" class="w-4 h-4"></i> Kostüm Rafını Aç
    </button>

    <!-- SAĞ/ORTA ÇALIŞMA ALANI -->
    <main class="flex-1 bg-[#0f0f12] flex flex-col relative overflow-hidden h-full">

      <!-- ÜST KONTROL ŞERİDİ (2D/3D GEÇİŞ BUTONLARI) -->
      <div class="bg-mcpanel/80 border-b border-zinc-800 px-4 py-2 flex items-center justify-between shrink-0 z-20">
        <div class="flex items-center gap-2">
          <button id="btnMode3D" class="px-3.5 py-1.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow border border-blue-400 transition active:scale-95 flex items-center gap-1.5">
            <i data-lucide="box" class="w-3.5 h-3.5"></i> 3D Görünüm
          </button>
          <button id="btnMode2D" class="px-3.5 py-1.5 bg-zinc-800 text-zinc-300 hover:bg-zinc-700 font-bold text-xs rounded-xl shadow border border-zinc-700 transition active:scale-95 flex items-center gap-1.5">
            <i data-lucide="edit-3" class="w-3.5 h-3.5"></i> 2D Görünüm
          </button>
        </div>
      </div>

      <!-- VIEWPORT BÖLGESİ (TAM EKRAN FLEX KORUMALI) -->
      <div class="flex-1 flex w-full relative items-center justify-center overflow-hidden">

        <!-- 3D ANA KARAKTER GÖRÜNÜMÜ -->
        <div id="container3D" class="w-full h-full flex-1 relative bg-[#0f0f12]">
          <canvas id="canvas3D" class="w-full h-full block"></canvas>
          <div class="absolute bottom-4 left-4 text-[11px] text-zinc-400 bg-black/60 px-3 py-1.5 rounded-lg backdrop-blur pointer-events-none border border-zinc-800 z-10">
            Sol tık: Döndür | Sağ tık: Kaydır | Tekerlek: Yakınlaş

        </div>

        <div id="panel2D" class="w-full h-full flex-1 hidden flex-col items-center justify-center p-4 bg-[#0f0f12]/95 z-10 backdrop-blur">
          <div class="text-xs text-zinc-400 mb-2 font-semibold">2D Kostüm Şablonu (64x64 Pixel)</div>
          <div class="relative border-2 border-cyan-500/50 rounded-xl overflow-hidden bg-black shadow-2xl grid-overlay">

            <canvas id="gridCanvas" width="512" height="512" class="absolute top-0 left-0 pointer-events-none w-[300px] h-[300px] sm:w-[400px] sm:h-[400px] md:w-[480px] md:h-[480px]"></canvas>
          </div>
        </div>

      </div>

      <!-- SAĞ ÜST KÖŞE: 3D İNDİRME PANELİ (İLK AÇILIŞTA KAPALI) -->
      <aside id="floatingPanel" class="absolute top-16 right-3 w-80 sm:w-96 bg-mcpanel/95 backdrop-blur-md border border-zinc-700/80 rounded-2xl shadow-2xl flex flex-col z-25 overflow-hidden panel-closed">
        <div class="p-3 border-b border-zinc-800 flex items-center justify-end bg-zinc-900/80">
          <button id="closeFloatingPanelBtn" class="text-zinc-400 hover:text-white p-1 rounded-lg hover:bg-zinc-800 transition" title="Kapat">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="p-3 bg-zinc-900/90 flex flex-col gap-2">
          <div class="grid grid-cols-2 gap-2">
            <button id="downloadSnapshotBtn" class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 transition shadow">
              <i data-lucide="camera" class="w-3.5 h-3.5"></i>
              <span>3D Poz İndir</span>
            </button>

            <button id="downloadSkinBtn" class="bg-green-700 hover:bg-green-600 text-white p-2 rounded-xl text-xs font-medium flex items-center justify-center gap-1.5 transition shadow">
              <i data-lucide="download" class="w-3.5 h-3.5"></i>
              <span>Doku İndir</span>
            </button>
          </div>
        </div>
      </aside>

      <!-- ALT ANA EYLEM PANELİ -->
      <div class="absolute bottom-4 left-1/2 -translate-x-1/2 z-20 bg-zinc-900/95 border border-zinc-700/80 px-5 py-2.5 rounded-2xl shadow-2xl flex flex-col items-center gap-2 backdrop-blur">
        
        <!-- VARSAYILAN KONTROL BUTONLARI -->
        <div id="defaultActionBtns" class="flex items-center gap-3">
          <button id="btnUseCostume" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow transition active:scale-95 flex items-center gap-1.5">
            <i data-lucide="check" class="w-4 h-4"></i> Kullan
          </button>
          
          <button id="btnStartEdit" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl shadow transition active:scale-95 flex items-center gap-1.5">
            <i data-lucide="pencil" class="w-4 h-4"></i> Düzenle
          </button>
          
          <button id="btnDeleteCostume" class="px-3 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl shadow transition active:scale-95 flex items-center gap-1.5">
            <i data-lucide="trash-2" class="w-4 h-4"></i> Sil
          </button>
        </div>

        <!-- DÜZENLEME MODU ARAÇLARI -->
        <div id="editToolBar" class="hidden flex items-center gap-2.5 border-b border-zinc-800 pb-2 mb-1 flex-wrap justify-center">
          <input type="color" id="primaryColor" value="#208ea3" class="w-7 h-7 rounded-lg border-0 cursor-pointer bg-transparent">
          
          <select id="brushSizeSelect" class="bg-zinc-800 text-zinc-200 text-xs px-2 py-1.5 rounded-lg border border-zinc-700 font-semibold focus:outline-none">
            <option value="1">1 px</option>
            <option value="2">2 px</option>
            <option value="3">3 px</option>
            <option value="4">4 px</option>
            <option value="6">6 px</option>
            <option value="8">8 px</option>
            <option value="10">10 px</option>
          </select>

          <button id="toolPencil" class="px-2.5 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg shadow flex items-center gap-1">
            <i data-lucide="pencil" class="w-3.5 h-3.5"></i> Kalem
          </button>
          
          <button id="toolEraser" class="px-2.5 py-1.5 bg-zinc-800 text-zinc-300 hover:bg-zinc-700 text-xs font-bold rounded-lg transition flex items-center gap-1">
            <i data-lucide="eraser" class="w-3.5 h-3.5"></i> Silgi
          </button>

          <button id="toolPicker" class="px-2.5 py-1.5 bg-zinc-800 text-zinc-300 hover:bg-zinc-700 text-xs font-bold rounded-lg transition flex items-center gap-1">
            <i data-lucide="pipette" class="w-3.5 h-3.5"></i> Damlalık
          </button>

          <button id="btnSaveEdit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow transition active:scale-95 flex items-center gap-1.5">
            <i data-lucide="save" class="w-4 h-4"></i> Kaydet
          </button>
        </div>

        <!-- EN ALT: DIŞA AKTAR / İÇERİ AKTAR -->
        <div class="flex items-center gap-3 pt-1 border-t border-zinc-800/80 w-full justify-center">
          <button id="btnExport2D" class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium rounded-xl border border-zinc-700 transition active:scale-95 flex items-center gap-1.5">
            <i data-lucide="download" class="w-3.5 h-3.5 text-green-400"></i> Dışa Aktar (2D Doku)
          </button>

          <label class="px-3 py-1.5 bg-zinc-800 hover:bg-zinc-700 text-zinc-200 text-xs font-medium rounded-xl border border-zinc-700 transition active:scale-95 cursor-pointer flex items-center gap-1.5">
            <i data-lucide="upload" class="w-3.5 h-3.5 text-blue-400"></i> İçeri Aktar (2D Doku)
            <input type="file" id="importInput" accept="image/png" class="hidden">
          </label>
        </div>

      </div>

    </main>

  </div>

  <!-- JAVASCRIPT LOJİĞİ -->
  <script>
    lucide.createIcons();

    const skinCanvas = document.getElementById('skinCanvas');
    const ctx = skinCanvas.getContext('2d', { willReadFrequently: true });
    const gridCanvas = document.getElementById('gridCanvas');
    const gridCtx = gridCanvas.getContext('2d');

    let currentTool = 'pencil';
    let currentColor = '#208ea3';
    let isDrawing = false;
    let isEditing = false;
    let isPanelOpen = false;
    let activeCostumeId = 1;
    let mini3DScenes = [];

    function createCostumeCanvas(initializer) {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const tCtx = c.getContext('2d', { willReadFrequently: true });
      initializer(tCtx);
      return c;
    }

    let costumes = [
      { 
        id: 1, 
        name: "Mecaga Özel Zırh", 
        canvas: createCostumeCanvas(tCtx => {
          tCtx.fillStyle = '#52341d'; tCtx.fillRect(8, 0, 8, 8); tCtx.fillRect(16, 0, 8, 8); tCtx.fillRect(0, 8, 32, 8);
          tCtx.fillStyle = '#cba07a'; tCtx.fillRect(8, 10, 8, 6);
          tCtx.fillStyle = '#ffffff'; tCtx.fillRect(9, 13, 2, 1); tCtx.fillRect(13, 13, 2, 1);
          tCtx.fillStyle = '#4b382a'; tCtx.fillRect(10, 13, 1, 1); tCtx.fillRect(13, 13, 1, 1);
          tCtx.fillStyle = '#208ea3'; tCtx.fillRect(20, 16, 8, 4); tCtx.fillRect(28, 16, 8, 4); tCtx.fillRect(16, 20, 24, 12);
          tCtx.fillStyle = '#cc182b'; tCtx.fillRect(32, 20, 8, 12);
          tCtx.fillStyle = '#ffffff'; tCtx.fillRect(34, 23, 3, 5);
          tCtx.fillStyle = '#cc182b'; tCtx.fillRect(35, 24, 2, 3);
          tCtx.fillStyle = '#ffffff'; tCtx.fillRect(37, 25, 1, 1);
          tCtx.fillStyle = '#176979'; tCtx.fillRect(44, 16, 4, 4); tCtx.fillRect(48, 16, 4, 4); tCtx.fillRect(40, 20, 16, 4);
          tCtx.fillStyle = '#cba07a'; tCtx.fillRect(40, 24, 16, 8);
          tCtx.fillStyle = '#2b2358'; tCtx.fillRect(4, 16, 4, 4); tCtx.fillRect(8, 16, 4, 4); tCtx.fillRect(0, 20, 16, 12);
          tCtx.fillStyle = '#3b3175'; tCtx.fillRect(20, 48, 4, 4); tCtx.fillRect(24, 48, 4, 4); tCtx.fillRect(16, 52, 16, 12);
          tCtx.fillStyle = '#208ea3'; tCtx.fillRect(36, 48, 4, 4); tCtx.fillRect(40, 48, 4, 4); tCtx.fillRect(32, 52, 16, 4);
          tCtx.fillStyle = '#cba07a'; tCtx.fillRect(32, 56, 16, 8);
        })
      },
      { 
        id: 2, 
        name: "Savaşçı Kostümü", 
        canvas: createCostumeCanvas(tCtx => {
          tCtx.fillStyle = '#333333'; tCtx.fillRect(0, 0, 32, 16);
          tCtx.fillStyle = '#ef4444'; tCtx.fillRect(16, 16, 24, 12);
          tCtx.fillStyle = '#222222'; tCtx.fillRect(0, 16, 16, 16); tCtx.fillRect(16, 48, 16, 16); tCtx.fillRect(32, 48, 16, 16); tCtx.fillRect(40, 16, 16, 16);
        })
      },
      { 
        id: 3, 
        name: "Zümrüt Muhafız", 
        canvas: createCostumeCanvas(tCtx => {
          tCtx.fillStyle = '#115e59'; tCtx.fillRect(0, 0, 32, 16);
          tCtx.fillStyle = '#10b981'; tCtx.fillRect(16, 16, 24, 12);
          tCtx.fillStyle = '#065f46'; tCtx.fillRect(0, 16, 16, 16); tCtx.fillRect(16, 48, 16, 16); tCtx.fillRect(32, 48, 16, 16); tCtx.fillRect(40, 16, 16, 16);
        })
      }
    ];

    function getActiveCostume() {
      return costumes.find(c => c.id === activeCostumeId) || costumes[0];
    }

    function syncActiveCanvasToEditor() {
      const activeC = getActiveCostume();
      ctx.clearRect(0, 0, 64, 64);
      ctx.drawImage(activeC.canvas, 0, 0);
      updateGridOverlay();
    }

    function saveEditorToActiveCanvas() {
      const activeC = getActiveCostume();
      const tCtx = activeC.canvas.getContext('2d', { willReadFrequently: true });
      tCtx.clearRect(0, 0, 64, 64);
      tCtx.drawImage(skinCanvas, 0, 0);
    }

    function setBoxUVs(geometry, u, v, w, h, d, textureWidth = 64, textureHeight = 64) {
      const uvAttribute = geometry.attributes.uv;
      const faces = [
        { x: u,         y: v + d,     w: d, h: h },
        { x: u + d + w, y: v + d,     w: d, h: h },
        { x: u + d,     y: v,         w: w, h: d },
        { x: u + d + w, y: v,         w: w, h: d },
        { x: u + d,     y: v + d,     w: w, h: h },
        { x: u + d + w + d, y: v + d, w: w, h: h }
      ];

      for (let i = 0; i < 6; i++) {
        const f = faces[i];
        const u0 = f.x / textureWidth;
        const u1 = (f.x + f.w) / textureWidth;
        const v0 = 1 - (f.y + f.h) / textureHeight;
        const v1 = 1 - f.y / textureHeight;

        uvAttribute.setXY(i * 4 + 0, u0, v1);
        uvAttribute.setXY(i * 4 + 1, u1, v1);
        uvAttribute.setXY(i * 4 + 2, u0, v0);
        uvAttribute.setXY(i * 4 + 3, u1, v0);
      }
      uvAttribute.needsUpdate = true;
    }

    function renderCostumeShelf() {
      const shelfList = document.getElementById('costumeShelfList');
      shelfList.innerHTML = '';
      mini3DScenes = [];

      costumes.forEach(c => {
        const isActive = c.id === activeCostumeId;
        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border cursor-pointer transition flex items-center justify-between shadow ${
          isActive ? 'bg-blue-600/20 border-blue-500 ring-1 ring-blue-500' : 'bg-zinc-900/80 border-zinc-800 hover:bg-zinc-800/60'
        }`;

        const miniCanvasId = `miniCanvas_${c.id}`;

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-14 h-14 rounded-lg bg-zinc-950 border border-zinc-800 overflow-hidden relative shrink-0 flex items-center justify-center">
              <canvas id="${miniCanvasId}" class="w-full h-full block"></canvas>
            </div>
            <div>
              <div class="font-bold text-xs text-zinc-200">${c.name}</div>
              <div class="text-[10px] text-zinc-500">ID: #${c.id}</div>
            </div>
          </div>
          ${isActive ? '<span class="text-[10px] text-emerald-400 font-bold bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-800">Aktif</span>' : ''}
        `;

        card.onclick = () => {
          activeCostumeId = c.id;
          syncActiveCanvasToEditor();
          update3DTexture();
          renderCostumeShelf();
        };

        shelfList.appendChild(card);
        setTimeout(() => initMini3DCard(miniCanvasId, c.canvas), 10);
      });
    }

    function initMini3DCard(canvasId, costumeCanvas) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;

      const mScene = new THREE.Scene();
      mScene.background = new THREE.Color(0x0f0f12);

      const mCam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      mCam.position.set(0, 0.2, 4.2);

      const mRen = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      mRen.setSize(56, 56);

      mScene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const dir = new THREE.DirectionalLight(0xffffff, 0.5);
      dir.position.set(2, 3, 2);
      mScene.add(dir);

      const mTexture = new THREE.CanvasTexture(costumeCanvas);
      mTexture.magFilter = THREE.NearestFilter;
      mTexture.minFilter = THREE.NearestFilter;
      const mat = new THREE.MeshBasicMaterial({ map: mTexture, transparent: true });

      const mGroup = new THREE.Group();

      function createMiniPart(w, h, d, x, y, z, u, v, pw, ph, pd) {
        const geo = new THREE.BoxGeometry(w, h, d);
        setBoxUVs(geo, u, v, pw, ph, pd, 64, 64);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        return mesh;
      }

      mGroup.add(createMiniPart(0.6, 0.6, 0.6, 0, 0.6, 0, 0, 0, 8, 8, 8));
      mGroup.add(createMiniPart(0.6, 0.9, 0.3, 0, -0.15, 0, 16, 16, 8, 12, 4));
      mGroup.add(createMiniPart(0.3, 0.9, 0.3, -0.45, -0.15, 0, 40, 16, 4, 12, 4));
      mGroup.add(createMiniPart(0.3, 0.9, 0.3, 0.45, -0.15, 0, 32, 48, 4, 12, 4));
      mGroup.add(createMiniPart(0.3, 0.9, 0.3, -0.15, -1.05, 0, 0, 16, 4, 12, 4));
      mGroup.add(createMiniPart(0.3, 0.9, 0.3, 0.15, -1.05, 0, 16, 48, 4, 12, 4));

      mScene.add(mGroup);
      mini3DScenes.push({ scene: mScene, camera: mCam, renderer: mRen, group: mGroup, texture: mTexture });
    }

    function updateGridOverlay() {
      gridCtx.clearRect(0, 0, 512, 512);
      const scale = 512 / 64;
      gridCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      gridCtx.lineWidth = 0.5;

      for (let i = 0; i <= 64; i++) {
        gridCtx.beginPath(); gridCtx.moveTo(i * scale, 0); gridCtx.lineTo(i * scale, 512); gridCtx.stroke();
        gridCtx.beginPath(); gridCtx.moveTo(0, i * scale); gridCtx.lineTo(512, i * scale); gridCtx.stroke();
      }
    }

    // --- THREE.JS ANA 3D SAHNE ---
    let scene, camera, renderer, controls, skinTexture, characterGroup, mainMaterial;

    function init3D() {
      const container = document.getElementById('container3D');
      const canvas = document.getElementById('canvas3D');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f0f12);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 1.2, 4.5);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(3, 5, 4);
      scene.add(dirLight);

      skinTexture = new THREE.CanvasTexture(skinCanvas);
      skinTexture.magFilter = THREE.NearestFilter;
      skinTexture.minFilter = THREE.NearestFilter;

      mainMaterial = new THREE.MeshStandardMaterial({ map: skinTexture, roughness: 0.8, metalness: 0.1 });
      characterGroup = new THREE.Group();

      function createPartWithUV(w, h, d, x, y, z, u, v, pw, ph, pd) {
        const geo = new THREE.BoxGeometry(w, h, d);
        setBoxUVs(geo, u, v, pw, ph, pd, 64, 64);
        const mesh = new THREE.Mesh(geo, mainMaterial);
        mesh.position.set(x, y, z);

        const edges = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 }));
        mesh.add(line);
        return mesh;
      }

      characterGroup.add(createPartWithUV(0.8, 0.8, 0.8, 0, 0.8, 0, 0, 0, 8, 8, 8));
      characterGroup.add(createPartWithUV(0.8, 1.2, 0.4, 0, -0.2, 0, 16, 16, 8, 12, 4));
      characterGroup.add(createPartWithUV(0.4, 1.2, 0.4, -0.6, -0.2, 0, 40, 16, 4, 12, 4));
      characterGroup.add(createPartWithUV(0.4, 1.2, 0.4, 0.6, -0.2, 0, 32, 48, 4, 12, 4));
      characterGroup.add(createPartWithUV(0.4, 1.2, 0.4, -0.2, -1.4, 0, 0, 16, 4, 12, 4));
      characterGroup.add(createPartWithUV(0.4, 1.2, 0.4, 0.2, -1.4, 0, 16, 48, 4, 12, 4));

      scene.add(characterGroup);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);

        mini3DScenes.forEach(m => {
          if (m.group) m.group.rotation.y += 0.02;
          if (m.texture) m.texture.needsUpdate = true;
          if (m.renderer && m.scene && m.camera) m.renderer.render(m.scene, m.camera);
        });
      }
      animate();
    }

    function update3DTexture() {
      if (skinTexture) skinTexture.needsUpdate = true;
    }

    function onWindowResize() {
      const container = document.getElementById('container3D');
      if (!container || !renderer || !camera) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
    window.addEventListener('resize', onWindowResize);

    // --- ETKİLEŞİMLER VE ÇİZİM ---
    document.addEventListener('DOMContentLoaded', () => {
      init3D();
      syncActiveCanvasToEditor();
      update3DTexture();
      renderCostumeShelf();
      onWindowResize();

      const shelfPanel = document.getElementById('shelfPanel');
      const closeShelfBtn = document.getElementById('closeShelfBtn');
      const openShelfBtn = document.getElementById('openShelfBtn');

      closeShelfBtn.onclick = () => {
        shelfPanel.classList.add('closed');
        setTimeout(() => {
          openShelfBtn.classList.remove('hidden');
          onWindowResize();
        }, 150);
      };

      openShelfBtn.onclick = () => {
        shelfPanel.classList.remove('closed');
        openShelfBtn.classList.add('hidden');
        setTimeout(() => onWindowResize(), 150);
      };

      // Sağ Üst 3D Panel Çekmece Kontrolleri
      const floatingPanel = document.getElementById('floatingPanel');
      const toggleCornerPanelBtn = document.getElementById('toggleCornerPanelBtn');
      const closeFloatingPanelBtn = document.getElementById('closeFloatingPanelBtn');
      const panelChevron = document.getElementById('panelChevron');

      function setFloatingPanel(open) {
        isPanelOpen = open;
        if (isPanelOpen) {
          floatingPanel.classList.remove('panel-closed');
          panelChevron.style.transform = 'rotate(180deg)';
        } else {
          floatingPanel.classList.add('panel-closed');
          panelChevron.style.transform = 'rotate(0deg)';
        }
      }

      toggleCornerPanelBtn.onclick = () => setFloatingPanel(!isPanelOpen);
      closeFloatingPanelBtn.onclick = () => setFloatingPanel(false);

      // Mod Butonları
      const btnMode3D = document.getElementById('btnMode3D');
      const btnMode2D = document.getElementById('btnMode2D');
      const panel2D = document.getElementById('panel2D');
      const container3D = document.getElementById('container3D');

      btnMode3D.onclick = () => {
        btnMode3D.className = "px-3.5 py-1.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow border border-blue-400 transition active:scale-95 flex items-center gap-1.5";
        btnMode2D.className = "px-3.5 py-1.5 bg-zinc-800 text-zinc-300 hover:bg-zinc-700 font-bold text-xs rounded-xl shadow border border-zinc-700 transition active:scale-95 flex items-center gap-1.5";
        panel2D.classList.add('hidden');
        panel2D.classList.remove('flex');
        container3D.classList.remove('hidden');
        onWindowResize();
      };

      btnMode2D.onclick = () => {
        btnMode2D.className = "px-3.5 py-1.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow border border-blue-400 transition active:scale-95 flex items-center gap-1.5";
        btnMode3D.className = "px-3.5 py-1.5 bg-zinc-800 text-zinc-300 hover:bg-zinc-700 font-bold text-xs rounded-xl shadow border border-zinc-700 transition active:scale-95 flex items-center gap-1.5";
        container3D.classList.add('hidden');
        panel2D.classList.remove('hidden');
        panel2D.classList.add('flex');
        onWindowResize();
      };

      // Çizim Olayları
      function getCanvasCoords(e) {
        const rect = skinCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = Math.floor((clientX - rect.left) / (rect.width / 64));
        const y = Math.floor((clientY - rect.top) / (rect.height / 64));
        return { x: Math.max(0, Math.min(63, x)), y: Math.max(0, Math.min(63, y)) };
      }

      function applyTool(x, y) {
        if (!isEditing) return;
        const brushSize = parseInt(document.getElementById('brushSizeSelect').value) || 1;

        if (currentTool === 'pencil') {
          ctx.fillStyle = currentColor;
          ctx.fillRect(x, y, brushSize, brushSize);
        } else if (currentTool === 'eraser') {
          ctx.clearRect(x, y, brushSize, brushSize);
        } else if (currentTool === 'picker') {
          const pixel = ctx.getImageData(x, y, 1, 1).data;
          if (pixel[3] > 0) {
            const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
            currentColor = hex;
            document.getElementById('primaryColor').value = hex;
          }
        }
        saveEditorToActiveCanvas();
        update3DTexture();
      }

      skinCanvas.addEventListener('mousedown', (e) => { isDrawing = true; const c = getCanvasCoords(e); applyTool(c.x, c.y); });
      skinCanvas.addEventListener('mousemove', (e) => { if (isDrawing) { const c = getCanvasCoords(e); applyTool(c.x, c.y); } });
      window.addEventListener('mouseup', () => isDrawing = false);

      skinCanvas.addEventListener('touchstart', (e) => { isDrawing = true; const c = getCanvasCoords(e); applyTool(c.x, c.y); }, { passive: true });
      skinCanvas.addEventListener('touchmove', (e) => { if (isDrawing) { const c = getCanvasCoords(e); applyTool(c.x, c.y); } }, { passive: true });
      window.addEventListener('touchend', () => isDrawing = false);

      document.getElementById('toolPencil').onclick = () => currentTool = 'pencil';
      document.getElementById('toolEraser').onclick = () => currentTool = 'eraser';
      document.getElementById('toolPicker').onclick = () => currentTool = 'picker';
      document.getElementById('primaryColor').addEventListener('input', (e) => currentColor = e.target.value);

      // Düzenleme / Kaydet / Kullan / Sil
      const defaultActionBtns = document.getElementById('defaultActionBtns');
      const editToolBar = document.getElementById('editToolBar');
      const btnStartEdit = document.getElementById('btnStartEdit');
      const btnSaveEdit = document.getElementById('btnSaveEdit');

      btnStartEdit.onclick = () => {
        isEditing = true;
        defaultActionBtns.classList.add('hidden');
        editToolBar.classList.remove('hidden');
        editToolBar.classList.add('flex');
        btnMode2D.click();
      };

      btnSaveEdit.onclick = () => {
        isEditing = false;
        saveEditorToActiveCanvas();
        update3DTexture();
        editToolBar.classList.add('hidden');
        editToolBar.classList.remove('flex');
        defaultActionBtns.classList.remove('hidden');
        btnMode3D.click();
        renderCostumeShelf();
      };

      document.getElementById('btnUseCostume').onclick = () => {
        saveEditorToActiveCanvas();
        update3DTexture();
        alert('Kostüm aktif kılındı!');
      };

      document.getElementById('btnDeleteCostume').onclick = () => {
        if (costumes.length <= 1) return alert('En az bir kostüm kalmalıdır!');
        costumes = costumes.filter(c => c.id !== activeCostumeId);
        activeCostumeId = costumes[0].id;
        syncActiveCanvasToEditor();
        update3DTexture();
        renderCostumeShelf();
      };

      document.getElementById('addCostumeBtn').onclick = () => {
        const newId = Date.now();
        const newCanvas = createCostumeCanvas(tCtx => {
          tCtx.fillStyle = '#2563eb';
          tCtx.fillRect(16, 16, 24, 12);
        });
        costumes.push({ id: newId, name: `Kostüm ${costumes.length + 1}`, canvas: newCanvas });
        activeCostumeId = newId;
        syncActiveCanvasToEditor();
        update3DTexture();
        renderCostumeShelf();
      };

      // İndirmeler & Yüklemeler
      document.getElementById('btnExport2D').onclick = () => {
        saveEditorToActiveCanvas();
        const a = document.createElement('a');
        a.download = 'skin-texture-64x64.png';
        a.href = getActiveCostume().canvas.toDataURL('image/png');
        a.click();
      };

      document.getElementById('downloadSkinBtn').onclick = document.getElementById('downloadSkinTopBtn').onclick = () => {
        saveEditorToActiveCanvas();
        const a = document.createElement('a');
        a.download = 'skin_64x64.png';
        a.href = getActiveCostume().canvas.toDataURL('image/png');
        a.click();
      };

      document.getElementById('downloadSnapshotBtn').onclick = () => {
        renderer.render(scene, camera);
        const a = document.createElement('a');
        a.download = 'character_3d.png';
        a.href = renderer.domElement.toDataURL('image/png');
        a.click();
      };

      document.getElementById('importInput').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              ctx.clearRect(0, 0, 64, 64);
              ctx.drawImage(img, 0, 0, 64, 64);
              saveEditorToActiveCanvas();
              update3DTexture();
              renderCostumeShelf();
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      };
    });
  </script>
</body>
</html>
