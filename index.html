<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlokDiyar - Öneriler Panosu</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <!-- Harici Stil Dosyası -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="theme-dark">

  <!-- Arka Planda Hareket Eden Emojiler Alanı -->
  <div class="emoji-background" id="emojiBackground"></div>

  <div class="container">
    
    <!-- Üst Bar, Temalar & Admin Paneli -->
    <div class="top-bar">
      <div class="status-badge">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Bağlantı Kuruluyor...</span>
      </div>
      <div class="top-controls">
        <div class="theme-selector">
          <span>Arka Plan:</span>
          <button class="theme-btn t-dark active" onclick="setTheme('dark')" title="Koyu"></button>
          <button class="theme-btn t-blue" onclick="setTheme('blue')" title="Mavi"></button>
          <button class="theme-btn t-voxel" onclick="setTheme('voxel')" title="Voxel / Yeşil"></button>
          <button class="theme-btn t-night" onclick="setTheme('night')" title="Gece"></button>
        </div>
        <button class="admin-toggle-btn" id="adminToggleBtn" onclick="toggleAdminMode()">
          <i class="fa-solid fa-lock" id="adminIcon"></i>
          <span id="adminText">Admin</span>
        </button>
      </div>
    </div>

    <!-- Karşılama / Duyuru Alanı -->
    <div class="announcement-card">
      <div class="announcement-text">
        "Merhaba Ben mecaga Minecraft benzeri olan BlokDiyar oyunu yapıyom fikrin veya düşüncen ve değiştirmesini istediğin varsa tabloya ekleyebilirsin istersen bende bakıp eklemeye çalışırım sırayla"
      </div>
      <div class="announcement-votes">
        <button class="vote-btn" id="mainLikeBtn" onclick="voteMain('like')">
          <i class="fa-regular fa-thumbs-up"></i>
          <span id="mainLikeCount">0</span>
        </button>
        <button class="vote-btn" id="mainDislikeBtn" onclick="voteMain('dislike')">
          <i class="fa-regular fa-thumbs-down"></i>
          <span id="mainDislikeCount">0</span>
        </button>
      </div>
    </div>

    <!-- Öneri Ekleme Formu -->
    <div class="form-card">
      <div class="form-title">
        <i class="fa-solid fa-lightbulb" style="color: #f59e0b;"></i>
        Yeni Öneri / Fikir Ekle
      </div>
      <div class="form-row">
        <input type="text" id="nicknameInput" class="input-field input-nickname" placeholder="Takma adın..." maxlength="20">
        <select id="categoryInput" class="input-field input-category">
          <option value="Öneri">📌 Öneri</option>
          <option value="Karakter">👤 Karakter</option>
          <option value="Görsel">🎨 Görsel</option>
          <option value="Diğer">📦 Diğer</option>
        </select>
        <input type="text" id="contentInput" class="input-field input-content" placeholder="İstediğin şey veya önerin...">
      </div>
      <button class="submit-btn" onclick="addSuggestion()">
        <i class="fa-solid fa-paper-plane"></i>
        Öneriyi Gönder
      </button>
    </div>

    <!-- Durum Sekmeleri (Paneller Arası Geçiş) -->
    <div class="status-tabs-bar">
      <button class="status-tab-btn active" onclick="filterByStatus('all', this)">📋 Tümü</button>
      <button class="status-tab-btn" onclick="filterByStatus('pending', this)">⏳ İnceleniyor</button>
      <button class="status-tab-btn" onclick="filterByStatus('planned', this)">🚀 Planlanıyor</button>
      <button class="status-tab-btn" onclick="filterByStatus('added', this)">✅ Eklendi</button>
      <button class="status-tab-btn" onclick="filterByStatus('rejected', this)">❌ Reddedildi</button>
      <button class="status-tab-btn" onclick="filterByStatus('failed', this)">⚠️ Yapılamadı</button>
    </div>

    <!-- Arama ve Sıralama Kontrolleri -->
    <div class="controls-bar">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass" style="color: var(--text-muted);"></i>
        <input type="text" id="searchInput" placeholder="Öneriler içinde ara..." oninput="renderSuggestions()">
      </div>
      <div class="sort-container">
        <i class="fa-solid fa-sort" style="color: var(--text-muted);"></i>
        <select id="sortSelect" class="sort-select" onchange="renderSuggestions()">
          <option value="newest">🕒 En Yeni</option>
          <option value="oldest">⏳ En Eski</option>
          <option value="likes">🔥 En Çok Beğenilen</option>
        </select>
      </div>
    </div>

    <div class="list-header">
      Topluluk Önerileri (<span id="totalCount">0</span>)
    </div>

    <!-- Öneri Listesi -->
    <div id="suggestionsList" class="suggestions-list">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 10px;">Öneriler yükleniyor...</p>
      </div>
    </div>

  </div>

  <!-- Harici JavaScript Dosyası -->
  <script src="app.js"></script>
</body>
</html>
