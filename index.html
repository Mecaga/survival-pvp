<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Minecraft 3D Kostüm Stüdyosu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
        .shelf-scroll::-webkit-scrollbar { width: 6px; }
        .shelf-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .shelf-scroll::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col select-none">

    <!-- ÜST BAR / HEADER -->
    <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 z-20 shrink-0">
        <div class="flex items-center gap-2">
            <span class="text-2xl">👕</span>
            <h1 class="font-bold text-base md:text-lg text-slate-100 tracking-wide">Minecraft Kostüm Stüdyosu</h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-save-snapshot" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl border border-slate-700 text-slate-200 transition active:scale-95">
                📸 3D Resim İndir
            </button>
            <button id="btn-download-texture" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-xl border border-slate-700 text-slate-200 transition active:scale-95">
                💾 Doku İndir (PNG)
            </button>
            <label class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-xs font-semibold rounded-xl text-white cursor-pointer transition active:scale-95 shadow-md">
                📂 Skin Yükle
                <input type="file" id="input-upload-skin" accept="image/png" class="hidden">
            </label>
        </div>
    </header>

    <!-- BÖLÜNMÜŞ ANA EKRAN -->
    <main class="flex-1 flex overflow-hidden relative">

        <!-- SOL TARAF: KOSTÜM RAFI -->
        <section class="w-72 md:w-80 bg-slate-900/95 border-r border-slate-800 flex flex-col p-4 shrink-0 z-10">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-bold text-slate-300 text-xs tracking-wider uppercase">Kostüm Rafı</h2>
                <button id="btn-add-costume" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl flex items-center gap-1 shadow-md transition active:scale-95">
                    <span>+</span> Yeni Ekle
                </button>
            </div>

            <!-- KOSTÜM LİSTESİ -->
            <div id="costume-list" class="flex-1 overflow-y-auto shelf-scroll space-y-3 pr-1">
                <!-- Dinamik Kostüm Kartları -->
            </div>
        </section>

        <!-- SAĞ TARAF: ÇALIŞMA ALANI (3D & 2D EŞ ZAMANLI) -->
        <section class="flex-1 flex flex-col relative bg-slate-950 overflow-hidden">

            <!-- ÜST KONTROL BUTONLARI -->
            <div class="absolute top-4 left-4 z-20 flex gap-2">
                <button id="btn-mode-3d" class="px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-lg border border-blue-400 transition active:scale-95">
                    🧊 3D İncele (360°)
                </button>
                <button id="btn-mode-2d" class="px-4 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-lg border border-slate-700 transition active:scale-95">
                    ✏️ 2D Doku Düzenle
                </button>
                <button id="btn-toggle-bed" class="px-3 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-lg border border-slate-700 transition active:scale-95">
                    🛏️ Yatak Modu
                </button>
            </div>

            <!-- 2D ÇİZİM ARAÇ ÇUBUĞU (SADECE 2D MODUNDA GÖRÜNÜR) -->
            <div id="toolbar-2d" class="absolute top-16 left-4 z-20 hidden bg-slate-900/90 border border-slate-700 p-2 rounded-2xl shadow-xl flex items-center gap-2">
                <input type="color" id="color-picker" value="#3b82f6" class="w-8 h-8 rounded-lg border-0 cursor-pointer bg-transparent">
                <button id="tool-pencil" class="px-3 py-1.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow transition">Kalem</button>
                <button id="tool-eraser" class="px-3 py-1.5 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl transition">Silgi</button>
                <button id="btn-save-2d" class="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl shadow ml-2 transition active:scale-95">💾 Kaydet & Uygula</button>
            </div>

            <!-- ALT DÜZENLEME / EYLEM BAR -->
            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 bg-slate-900/90 border border-slate-700 px-5 py-2.5 rounded-2xl shadow-2xl flex items-center gap-3 backdrop-blur-md">
                <button id="btn-use" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow transition active:scale-95">
                    ✓ Kullan
                </button>
                <button id="btn-edit" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl shadow transition active:scale-95">
                    ✏️ Değiştir
                </button>
                <button id="btn-delete" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl shadow transition active:scale-95">
                    🗑️ Sil
                </button>
            </div>

            <!-- VIEWPORT BÖLGESİ (2D & 3D YAN YANA) -->
            <div class="flex-1 flex w-full h-full">
                <!-- 2D PANEL (ÇİZİM TUVALİ) -->
                <div id="panel-2d" class="w-1/2 h-full hidden flex-col items-center justify-center p-4 border-r border-slate-800 bg-slate-900/50">
                    <div class="relative border-2 border-slate-700 rounded-xl overflow-hidden bg-black/60 shadow-2xl">
                        <canvas id="canvas-2d" width="512" height="512" class="cursor-crosshair"></canvas>
                    </div>
                </div>

                <!-- 3D PANEL (THREE.JS CANVAS) -->
                <div id="container-3d" class="flex-1 h-full relative"></div>
            </div>

        </section>

    </main>

    <script>
        // --- SİSTEM DEĞİŞKENLERİ ---
        let scene, camera, renderer, controls, characterGroup;
        let activeCostumeId = 1;
        let isSleeping = false;
        let currentTool = 'pencil';
        let activeMode = '3d'; // '3d' veya '2d'

        // 2D Tuval Kurulumu (64x64 Çözünürlük)
        const offCanvas = document.createElement('canvas');
        offCanvas.width = 64; offCanvas.height = 64;
        const offCtx = offCanvas.getContext('2d');

        const displayCanvas = document.getElementById('canvas-2d');
        const displayCtx = displayCanvas.getContext('2d');

        let costumeTexture, textureMaterial;

        // Varsayılan Kostüm Verileri
        let costumes = [
            { id: 1, name: "Mecaga Savaşçı", color: "#ef4444" },
            { id: 2, name: "Mor Elit", color: "#8b5cf6" },
            { id: 3, name: "Zümrüt Muhafız", color: "#10b981" }
        ];

        // --- DOKU ÇİZİM FONKSİYONLARI ---
        function createBaseTexture(baseColor) {
            offCtx.fillStyle = baseColor;
            offCtx.fillRect(0, 0, 64, 64);

            // Baş / Yüz Detayı
            offCtx.fillStyle = '#ffdbac';
            offCtx.fillRect(8, 8, 8, 8); // Ön Yüz
            offCtx.fillStyle = '#222222';
            offCtx.fillRect(10, 11, 1, 1); // Sol Göz
            offCtx.fillRect(13, 11, 1, 1); // Sağ Göz

            // Türk Bayrağı Detayı (Gövde)
            offCtx.fillStyle = '#e11d48';
            offCtx.fillRect(20, 20, 8, 12);
            offCtx.fillStyle = '#ffffff';
            offCtx.fillText('C*', 21, 28);

            updateDisplayCanvas();
        }

        function updateDisplayCanvas() {
            displayCtx.imageSmoothingEnabled = false;
            displayCtx.drawImage(offCanvas, 0, 0, 512, 512);

            // Grid / Izgara Çizgileri
            displayCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            displayCtx.lineWidth = 1;
            for (let i = 0; i <= 512; i += 8) {
                displayCtx.beginPath(); displayCtx.moveTo(i, 0); displayCtx.lineTo(i, 512); displayCtx.stroke();
                displayCtx.beginPath(); displayCtx.moveTo(0, i); displayCtx.lineTo(512, i); displayCtx.stroke();
            }
        }

        function update3DTexture() {
            if (costumeTexture) {
                costumeTexture.needsUpdate = true;
            }
        }

        // --- THREE.JS 3D KURULUMU ---
        function init3D() {
            const container = document.getElementById('container-3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 1.2, 4.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.target.set(0, 0, 0);

            // Işıklandırma
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(3, 5, 4);
            scene.add(dirLight);

            // Doku
            costumeTexture = new THREE.CanvasTexture(offCanvas);
            costumeTexture.magFilter = THREE.NearestFilter;
            costumeTexture.minFilter = THREE.NearestFilter;

            textureMaterial = new THREE.MeshStandardMaterial({
                map: costumeTexture,
                roughness: 0.8,
                metalness: 0.1
            });

            // 3D Karakter Grubu (Minecraft Ölçüleri)
            characterGroup = new THREE.Group();

            function createBodyPart(w, h, d, x, y, z) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geo, textureMaterial);
                mesh.position.set(x, y, z);
                
                // Voxel Kenar Çizgileri
                const edges = new THREE.EdgesGeometry(geo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 1 }));
                mesh.add(line);

                return mesh;
            }

            // Parçaları Ekle
            characterGroup.add(createBodyPart(0.8, 0.8, 0.8, 0, 0.8, 0));  // Kafa
            characterGroup.add(createBodyPart(0.8, 1.2, 0.4, 0, -0.2, 0)); // Gövde
            characterGroup.add(createBodyPart(0.4, 1.2, 0.4, -0.6, -0.2, 0)); // Sol Kol
            characterGroup.add(createBodyPart(0.4, 1.2, 0.4, 0.6, -0.2, 0));  // Sağ Kol
            characterGroup.add(createBodyPart(0.4, 1.2, 0.4, -0.2, -1.4, 0)); // Sol Bacak
            characterGroup.add(createBodyPart(0.4, 1.2, 0.4, 0.2, -1.4, 0));  // Sağ Bacak

            scene.add(characterGroup);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);
        }

        // --- KOSTÜM RAFI YÖNETİMİ ---
        function renderCostumeList() {
            const listEl = document.getElementById('costume-list');
            listEl.innerHTML = '';

            costumes.forEach(c => {
                const isActive = c.id === activeCostumeId;
                const card = document.createElement('div');
                card.className = `p-3 rounded-2xl border cursor-pointer transition flex items-center gap-3 ${
                    isActive ? 'bg-blue-600/20 border-blue-500 shadow-lg' : 'bg-slate-800/60 border-slate-700/60 hover:bg-slate-800'
                }`;

                card.innerHTML = `
                    <div class="w-10 h-10 rounded-xl flex items-center justify-center font-bold text-white shadow" style="background-color: ${c.color}">
                        👕
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <h3 class="font-bold text-xs text-slate-200 truncate">${c.name}</h3>
                        <p class="text-[10px] text-slate-400">ID: #${c.id}</p>
                    </div>
                `;

                card.onclick = () => selectCostume(c.id);
                listEl.appendChild(card);
            });
        }

        function selectCostume(id) {
            activeCostumeId = id;
            const costume = costumes.find(c => c.id === id);
            if (costume) {
                createBaseTexture(costume.color);
                update3DTexture();
            }
            renderCostumeList();
        }

        // --- ETKİLEŞİM VE ARAYÜZ OLAYLARI ---
        document.addEventListener('DOMContentLoaded', () => {
            init3D();
            createBaseTexture('#ef4444');
            renderCostumeList();

            // Mod Değiştirme
            const btn3D = document.getElementById('btn-mode-3d');
            const btn2D = document.getElementById('btn-mode-2d');
            const panel2D = document.getElementById('panel-2d');
            const toolbar2D = document.getElementById('toolbar-2d');

            btn3D.onclick = () => {
                activeMode = '3d';
                btn3D.className = "px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-lg border border-blue-400 transition active:scale-95";
                btn2D.className = "px-4 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-lg border border-slate-700 transition active:scale-95";
                panel2D.classList.add('hidden');
                toolbar2D.classList.add('hidden');
                onWindowResize();
            };

            btn2D.onclick = () => {
                activeMode = '2d';
                btn2D.className = "px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-lg border border-blue-400 transition active:scale-95";
                btn3D.className = "px-4 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-lg border border-slate-700 transition active:scale-95";
                panel2D.classList.remove('hidden');
                panel2D.classList.add('flex');
                toolbar2D.classList.remove('hidden');
                toolbar2D.classList.add('flex');
                onWindowResize();
            };

            // Yatak Modu
            document.getElementById('btn-toggle-bed').onclick = () => {
                isSleeping = !isSleeping;
                if (characterGroup) {
                    characterGroup.rotation.x = isSleeping ? -Math.PI / 2 : 0;
                    characterGroup.position.y = isSleeping ? -0.5 : 0;
                }
            };

            // Eylem Butonları
            document.getElementById('btn-add-costume').onclick = () => {
                const newId = Date.now();
                const colors = ['#f59e0b', '#ec4899', '#06b6d4', '#84cc16'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                costumes.push({ id: newId, name: `Yeni Kostüm ${costumes.length + 1}`, color: randomColor });
                selectCostume(newId);
            };

            document.getElementById('btn-use').onclick = () => {
                update3DTexture();
                alert('Kostüm başarıyla uygulandı!');
            };

            document.getElementById('btn-edit').onclick = () => btn2D.click();

            document.getElementById('btn-delete').onclick = () => {
                if (costumes.length <= 1) {
                    alert('En az bir kostüm bulunmalıdır!');
                    return;
                }
                costumes = costumes.filter(c => c.id !== activeCostumeId);
                selectCostume(costumes[0].id);
            };

            // 2D Çizim Olayları
            let isDrawing = false;
            displayCanvas.onpointerdown = (e) => { isDrawing = true; draw(e); };
            displayCanvas.onpointermove = (e) => { if (isDrawing) draw(e); };
            window.onpointerup = () => isDrawing = false;

            function draw(e) {
                const rect = displayCanvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / (rect.width / 64));
                const y = Math.floor((e.clientY - rect.top) / (rect.height / 64));

                if (x >= 0 && x < 64 && y >= 0 && y < 64) {
                    offCtx.fillStyle = currentTool === 'pencil' ? document.getElementById('color-picker').value : '#00000000';
                    if (currentTool === 'eraser') {
                        offCtx.clearRect(x, y, 1, 1);
                    } else {
                        offCtx.fillRect(x, y, 1, 1);
                    }
                    updateDisplayCanvas();
                    update3DTexture();
                }
            }

            document.getElementById('tool-pencil').onclick = () => currentTool = 'pencil';
            document.getElementById('tool-eraser').onclick = () => currentTool = 'eraser';
            document.getElementById('btn-save-2d').onclick = () => {
                update3DTexture();
                alert('Değişiklikler kaydedildi ve 3D karaktere uygulandı!');
            };

            // İndirme ve Yükleme İşlemleri
            document.getElementById('btn-save-snapshot').onclick = () => {
                renderer.render(scene, camera);
                const link = document.createElement('a');
                link.download = 'minecraft-character-3d.png';
                link.href = renderer.domElement.toDataURL('image/png');
                link.click();
            };

            document.getElementById('btn-download-texture').onclick = () => {
                const link = document.createElement('a');
                link.download = 'skin-texture-64x64.png';
                link.href = offCanvas.toDataURL('image/png');
                link.click();
            };

            document.getElementById('input-upload-skin').onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const img = new Image();
                    img.onload = () => {
                        offCtx.clearRect(0, 0, 64, 64);
                        offCtx.drawImage(img, 0, 0, 64, 64);
                        updateDisplayCanvas();
                        update3DTexture();
                    };
                    img.src = URL.createObjectURL(file);
                }
            };
        });

        function onWindowResize() {
            const container = document.getElementById('container-3d');
            if (!container || !renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
