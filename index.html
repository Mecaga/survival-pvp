<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MCPE Ev & Ok Tuşları Testi</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #1a1a1a; 
            font-family: sans-serif;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        /* --- AŞAĞIDAKİ OK TUŞLARI (KAMERA DÖNDÜRME) --- */
        #arrow-controls {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 10;
        }
        .arrow-btn {
            width: 60px;
            height: 60px;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid #ffffff;
            color: white;
            font-size: 26px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }
        .arrow-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.92);
        }
    </style>
</head>
<body>
    <div id="info">Evin etrafında dönüp her tarafını görmek için ok tuşlarına basın.</div>
    
    <!-- Ok Tuşları -->
    <div id="arrow-controls">
        <div class="arrow-btn" id="left-arrow">◀</div>
        <div class="arrow-btn" id="right-arrow">►</div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Sahne ve Kamera
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // 2. Blok Materyalleri (Tahta, Taş, Cam vb.)
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B }); // Ahşap
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x7F7F7F }); // Taş
        const glassMat = new THREE.MeshStandardMaterial({ color: 0xadd8e6, transparent: true, opacity: 0.6 }); // Cam
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 }); // Çatı Ahşabı

        // Doku Yükleyici (deneme.png için)
        const textureLoader = new THREE.TextureLoader();
        let customMat = new THREE.MeshBasicMaterial({ color: 0xffffff }); // Varsayılan

        textureLoader.load('deneme.png', (texture) => {
            customMat = new THREE.MeshBasicMaterial({ 
                map: texture, 
                transparent: true,
                side: THREE.DoubleSide
            });
            buildHouse(); // Resim yüklenince evi inşa et
        }, undefined, () => {
            // Görsel yüklenemezse varsayılan malzemeyle evi yine de kur
            buildHouse();
        });

        // 3. MCPE 1 Ev Oluşturma Fonksiyonu
        function buildHouse() {
            const blockSize = 1;

            // Zemin Çimi / Taş Taban
            for (let x = -3; x <= 3; x++) {
                for (let z = -3; z <= 3; z++) {
                    const stone = new THREE.Mesh(new THREE.BoxGeometry(blockSize, blockSize, blockSize), stoneMat);
                    stone.position.set(x, -0.5, z);
                    scene.add(stone);
                }
            }

            // Duvarlar ve Camlar (3x3 Ev alanı, 2 blok yükseklik)
            for (let x = -2; x <= 2; x++) {
                for (let z = -2; z <= 2; z++) {
                    // Sadece dış duvarlar
                    if (Math.abs(x) === 2 || Math.abs(z) === 2) {
                        // Kapı boşluğu (Ön taraf z = 2, x = 0)
                        if (z === 2 && x === 0) continue; 

                        for (let y = 0.5; y <= 1.5; y++) {
                            // Pencereler (Yan duvarların üst sırasına cam koy)
                            let mat = woodMat;
                            if (y === 1.5 && (x === -2 || x === 2)) mat = glassMat;

                            const wallBlock = new THREE.Mesh(new THREE.BoxGeometry(blockSize, blockSize, blockSize), mat);
                            wallBlock.position.set(x, y, z);
                            scene.add(wallBlock);
                        }
                    }
                }
            }

            // Çatı Yapısı
            for (let x = -2; x <= 2; x++) {
                for (let z = -2; z <= 2; z++) {
                    const roofBlock = new THREE.Mesh(new THREE.BoxGeometry(blockSize, 0.4, blockSize), roofMat);
                    roofBlock.position.set(x, 2.2, z);
                    scene.add(roofBlock);
                }
            }

            // --- deneme.png Görselinin Ev Üstünde Kullanımı ---
            
            // A) Çatının üstündeki Tabela / Bayrak Bloğu
            const signGeo = new THREE.PlaneGeometry(1.2, 1.2);
            const signMesh = new THREE.Mesh(signGeo, customMat);
            signMesh.position.set(0, 3.1, 0);
            scene.add(signMesh);

            // B) Kapı Yanındaki Dekoratif Gösterge Bloğu
            const customBlockGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
            const customBlock = new THREE.Mesh(customBlockGeo, customMat);
            customBlock.position.set(1.2, 0.5, 2.2);
            scene.add(customBlock);
        }

        // 4. Ok Tuşları ile Kamerayı Evin Etrafında Döndürme
        let cameraAngle = 0; // Başlangıç açısı
        const radius = 8;     // Evden uzaklık
        const cameraHeight = 3.5;

        function updateCameraPosition() {
            camera.position.x = Math.sin(cameraAngle) * radius;
            camera.position.z = Math.cos(cameraAngle) * radius;
            camera.position.y = cameraHeight;
            camera.lookAt(0, 1, 0); // Evin merkezine bak
        }

        updateCameraPosition();

        // Sol / Sağ Ok Buton Dinleyicileri
        const step = 0.35; // Her basışta dönecek açı miktarı

        function rotateLeft() {
            cameraAngle -= step;
            updateCameraPosition();
        }

        function rotateRight() {
            cameraAngle += step;
            updateCameraPosition();
        }

        // Dokunmatik ve Tıklama Desteği
        document.getElementById('left-arrow').addEventListener('touchstart', (e) => { e.preventDefault(); rotateLeft(); });
        document.getElementById('right-arrow').addEventListener('touchstart', (e) => { e.preventDefault(); rotateRight(); });
        document.getElementById('left-arrow').addEventListener('click', rotateLeft);
        document.getElementById('right-arrow').addEventListener('click', rotateRight);

        // Klavyedeki Sol/Sağ Ok Tuşları Desteği
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') rotateLeft();
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') rotateRight();
        });

        // 5. Render Döngüsü
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }

        animate();

        // Ekran Boyutu Değişimi
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
