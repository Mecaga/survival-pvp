<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Ortak Görev Takibi</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icon Seti -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0b0f19 0%, #111827 50%, #1f2937 100%);
            min-height: 100vh;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(17, 24, 39, 0.6);
        }
        ::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4b5563;
        }
        .ping-online {
            animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes ping {
            75%, 100% {
                transform: scale(2);
                opacity: 0;
            }
        }
    </style>

    <!-- Firebase Compat SDK v8/v9 JS CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="text-slate-100 flex flex-col justify-between p-4 sm:p-6 md:p-8">

    <div class="max-w-2xl w-full mx-auto space-y-6 my-auto">
        
        <!-- Üst Başlık Kartı -->
        <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl p-6 border border-slate-700/60 shadow-2xl relative overflow-hidden">
            <div class="flex flex-col sm:flex-row items-center justify-between gap-4">
                <div class="text-center sm:text-left">
                    <h1 class="text-2xl sm:text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-indigo-400 to-purple-400 flex items-center justify-center sm:justify-start gap-3">
                        <i class="fa-solid fa-gamepad text-cyan-400"></i>
                        <span>Ortak Kod & Oyun Listesi</span>
                    </h1>
                    <p class="text-slate-400 text-xs sm:text-sm mt-1">Anlık canlı veritabanı senkronizasyonlu görev panosu</p>
                </div>
                
                <!-- Canlı Bağlantı Rozeti -->
                <div class="flex items-center gap-2 bg-slate-900/90 border border-slate-700/80 px-3.5 py-1.5 rounded-full text-xs font-medium text-slate-300 shadow-inner">
                    <span class="relative flex h-2.5 w-2.5">
                      <span id="statusPulse" class="ping-online absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                      <span id="statusDot" class="relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500"></span>
                    </span>
                    <span id="statusText">Canlı Bağlantı</span>
                </div>
            </div>
        </div>

        <!-- İlerleme & Yüzde Barı Kartı -->
        <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl p-6 border border-slate-700/60 shadow-2xl space-y-4">
            <div class="flex justify-between items-center text-sm font-semibold">
                <span class="text-slate-300 flex items-center gap-2">
                    <i class="fa-solid fa-bars-progress text-indigo-400"></i> Tamamlama Durumu
                </span>
                <span id="counterText" class="text-cyan-300 bg-cyan-950/60 px-3 py-1 rounded-full border border-cyan-800/60 font-mono text-xs">
                    0 / 0 Görev
                </span>
            </div>

            <!-- Dinamik Yüzde Barı -->
            <div class="w-full bg-slate-900/90 h-4 rounded-full overflow-hidden p-0.5 border border-slate-700/60 relative">
                <div id="progressBar" class="h-full bg-gradient-to-r from-cyan-500 via-indigo-500 to-purple-500 rounded-full transition-all duration-500 ease-out w-0 shadow-lg shadow-indigo-500/30"></div>
            </div>

            <div class="flex justify-between items-center text-xs text-slate-400 pt-0.5">
                <span>Başarı Oranı</span>
                <span id="percentageText" class="font-bold text-cyan-400 text-sm font-mono">%0 Tamamlandı</span>
            </div>
        </div>

        <!-- Görev Ekleme Formu -->
        <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl p-4 border border-slate-700/60 shadow-2xl">
            <form id="todoForm" class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="text" 
                    id="todoInput" 
                    placeholder="Örn: Oyuncu hareket kodlarını test et veya hataları gider..." 
                    class="flex-1 bg-slate-900/90 border border-slate-700/80 focus:border-cyan-500 focus:ring-2 focus:ring-cyan-500/20 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 outline-none transition-all duration-200 text-sm"
                    required
                    autocomplete="off"
                >
                <button 
                    type="submit" 
                    id="addButton"
                    class="bg-gradient-to-r from-cyan-500 to-indigo-600 hover:from-cyan-400 hover:to-indigo-500 active:scale-95 text-white font-medium px-6 py-3 rounded-xl flex items-center justify-center gap-2 transition-all duration-200 shadow-lg shadow-cyan-500/20 text-sm"
                >
                    <i class="fa-solid fa-plus"></i>
                    <span>Ekle</span>
                </button>
            </form>
        </div>

        <!-- Filtreler ve Görev Listesi -->
        <div class="bg-slate-800/80 backdrop-blur-md rounded-2xl p-6 border border-slate-700/60 shadow-2xl space-y-4">
            
            <div class="flex items-center justify-between border-b border-slate-700/60 pb-4 flex-wrap gap-2">
                <h2 class="text-base font-semibold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-cyan-400"></i> Görev Listesi
                </h2>
                <!-- Filtreleme Butonları -->
                <div class="flex bg-slate-900/90 p-1 rounded-xl border border-slate-700/60 text-xs font-medium">
                    <button id="filterAll" onclick="setFilter('all')" class="px-3 py-1.5 rounded-lg transition-all bg-indigo-600 text-white shadow-md">Hepsini Göster</button>
                    <button id="filterActive" onclick="setFilter('active')" class="px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-slate-200">Yapılacaklar</button>
                    <button id="filterCompleted" onclick="setFilter('completed')" class="px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-slate-200">Tamamlananlar</button>
                </div>
            </div>

            <!-- Yükleniyor Mesajı -->
            <div id="loadingState" class="text-center py-8 text-cyan-400 space-y-3">
                <i class="fa-solid fa-spinner fa-spin text-3xl"></i>
                <p class="text-xs text-slate-400">Canlı veritabanı verileri senkronize ediliyor...</p>
            </div>

            <!-- Liste Alanı -->
            <ul id="todoList" class="space-y-2.5 max-h-[380px] overflow-y-auto pr-1 hidden">
            </ul>

            <!-- Boş Liste Uyarısı -->
            <div id="emptyState" class="hidden text-center py-10 text-slate-500 space-y-2">
                <i class="fa-solid fa-folder-open text-4xl text-slate-600"></i>
                <p class="text-xs sm:text-sm">Henüz eklenmiş bir görev bulunmuyor.</p>
            </div>
        </div>

    </div>

    <!-- Alt Bilgi -->
    <footer class="text-center text-xs text-slate-500 py-4">
        <span>Firebase Realtime DB • Canlı Ortak Liste</span>
    </footer>

    <!-- Firebase Bağlantı ve Uygulama Mantığı -->
    <script>
        // 1. Kullanıcının sağladığı Firebase Kurulumu
        const firebaseConfig = {
            databaseURL: "https://survival-pvp-game-default-rtdb.firebaseio.com"
        };

        // Firebase'i Başlat
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const todosRef = database.ref('todos');

        // Uygulama Durumları
        let todos = [];
        let currentFilter = 'all';

        // DOM Elemanları
        const todoForm = document.getElementById('todoForm');
        const todoInput = document.getElementById('todoInput');
        const todoList = document.getElementById('todoList');
        const progressBar = document.getElementById('progressBar');
        const counterText = document.getElementById('counterText');
        const percentageText = document.getElementById('percentageText');
        const emptyState = document.getElementById('emptyState');
        const loadingState = document.getElementById('loadingState');
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const statusPulse = document.getElementById('statusPulse');

        // İnternet Bağlantı Durumu Takibi
        const connectedRef = database.ref('.info/connected');
        connectedRef.on('value', (snap) => {
            if (snap.val() === true) {
                statusText.textContent = "Canlı Bağlantı";
                statusDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-emerald-500";
                statusPulse.className = "ping-online absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75";
            } else {
                statusText.textContent = "Bağlantı Kesildi";
                statusDot.className = "relative inline-flex rounded-full h-2.5 w-2.5 bg-rose-500";
                statusPulse.className = "hidden";
            }
        });

        // 2. Canlı Veri Dinleme (Real-time DB Listener)
        todosRef.on('value', (snapshot) => {
            const data = snapshot.val();
            todos = [];

            if (data) {
                Object.keys(data).forEach((key) => {
                    todos.push({
                        id: key,
                        ...data[key]
                    });
                });
                // En yeni eklenen en üstte
                todos.sort((a, b) => b.createdAt - a.createdAt);
            }

            loadingState.classList.add('hidden');
            todoList.classList.remove('hidden');
            render();
        });

        // Görev Ekleme
        todoForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = todoInput.value.trim();
            if (!text) return;

            const newTodoRef = todosRef.push();
            newTodoRef.set({
                text: text,
                completed: false,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            });

            todoInput.value = '';
        });

        // Tamamlandı / Yapılacak Durumunu Değiştirme
        window.toggleTodo = function(id, currentCompleted) {
            todosRef.child(id).update({
                completed: !currentCompleted
            });
        };

        // Görev Silme
        window.deleteTodo = function(id) {
            todosRef.child(id).remove();
        };

        // Filtre Butonları Mantığı
        window.setFilter = function(filter) {
            currentFilter = filter;
            const btnAll = document.getElementById('filterAll');
            const btnActive = document.getElementById('filterActive');
            const btnCompleted = document.getElementById('filterCompleted');

            const activeClass = "px-3 py-1.5 rounded-lg transition-all bg-indigo-600 text-white shadow-md font-medium";
            const inactiveClass = "px-3 py-1.5 rounded-lg transition-all text-slate-400 hover:text-slate-200 font-medium";

            btnAll.className = filter === 'all' ? activeClass : inactiveClass;
            btnActive.className = filter === 'active' ? activeClass : inactiveClass;
            btnCompleted.className = filter === 'completed' ? activeClass : inactiveClass;

            render();
        };

        // Ekrana Çizme Mantığı (Render)
        function render() {
            const total = todos.length;
            const completedCount = todos.filter(t => t.completed).length;
            const percentage = total === 0 ? 0 : Math.round((completedCount / total) * 100);

            // Üst Sayaç ve Progress Bar Güncelleme
            progressBar.style.width = `${percentage}%`;
            counterText.textContent = `${completedCount} / ${total} Görev`;
            percentageText.textContent = `%${percentage} Tamamlandı`;

            // Filtreleme
            let filteredTodos = todos;
            if (currentFilter === 'active') {
                filteredTodos = todos.filter(t => !t.completed);
            } else if (currentFilter === 'completed') {
                filteredTodos = todos.filter(t => t.completed);
            }

            todoList.innerHTML = '';

            if (filteredTodos.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');

                filteredTodos.forEach(todo => {
                    const li = document.createElement('li');
                    li.className = `group flex items-center justify-between p-3 rounded-xl border transition-all duration-200 ${
                        todo.completed 
                            ? 'bg-slate-900/40 border-slate-800/80 text-slate-500' 
                            : 'bg-slate-900/90 border-slate-700/70 text-slate-100 hover:border-slate-600'
                    }`;

                    li.innerHTML = `
                        <div class="flex items-center gap-3 min-w-0 flex-1 cursor-pointer select-none" onclick="toggleTodo('${todo.id}', ${todo.completed})">
                            <div class="w-5 h-5 rounded-lg border flex items-center justify-center transition-all ${
                                todo.completed 
                                    ? 'bg-gradient-to-r from-emerald-500 to-teal-500 border-emerald-500 text-white' 
                                    : 'border-slate-600 group-hover:border-cyan-400 bg-slate-800/50'
                            }">
                                ${todo.completed ? '<i class="fa-solid fa-check text-xs"></i>' : ''}
                            </div>
                            <span class="truncate text-sm font-medium ${todo.completed ? 'line-through text-slate-500' : ''}">
                                ${escapeHtml(todo.text)}
                            </span>
                        </div>
                        <button 
                            onclick="deleteTodo('${todo.id}')" 
                            class="text-slate-500 hover:text-rose-400 p-2 rounded-lg hover:bg-slate-800 transition-colors opacity-90 sm:opacity-0 group-hover:opacity-100 ml-2"
                            title="Sil"
                        >
                            <i class="fa-regular fa-trash-can text-sm"></i>
                        </button>
                    `;
                    todoList.appendChild(li);
                });
            }
        }

        // Güvenli Metin Dönüştürme (XSS Önlemi)
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
