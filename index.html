<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mobil Uyumlu Karakter Testi</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #1a1a1a; 
            font-family: sans-serif;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
            pointer-events: none;
            padding: 0 10px;
            box-sizing: border-box;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        #controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid white;
            color: white;
            padding: 14px 22px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="info">Karakteri hareket ettirmek için alttaki butonları kullanın.</div>
    
    <!-- Mobil Dokunmatik Kontrol Butonları -->
    <div id="controls">
        <button class="btn" id="leftBtn">◀ Sol</button>
        <button class="btn" id="midBtn">● Orta</button>
        <button class="btn" id="rightBtn">Sağ ▶</button>
    </div>

    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Mobil performans için pixel ratio sınırı
        document.body.appendChild(renderer.domElement);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Ortadaki Kutu
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x3498db });
        const centerBox = new THREE.Mesh(boxGeo, boxMat);
        centerBox.position.set(0, 0, 0);
        scene.add(centerBox);

        let character;
        let targetX = 0;

        // Resmi Yükleme ve Orijinal Oranını (Aspect Ratio) Koruma
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load('deneme.png', (texture) => {
            const image = texture.image;
            const aspect = image.width / image.height; // Resmin en/boy oranı
            
            const height = 1.4; // Sahnedeki sabit yüksekliği
            const width = height * aspect; // Genişliği orana göre otomatik ayarla (Resim asla bozulmaz/ezilmez)

            const charGeo = new THREE.PlaneGeometry(width, height);
            const charMat = new THREE.MeshBasicMaterial({ 
                map: texture, 
                transparent: true, // Şeffaf arka plan
                side: THREE.DoubleSide 
            });
            
            character = new THREE.Mesh(charGeo, charMat);
            character.position.set(0, 0, 2); // Kutunun önünde
            scene.add(character);
        });

        camera.position.set(0, 1.5, 4.5);
        camera.lookAt(0, 0, 0);

        // Dokunmatik Buton Olayları (Mobilde parmakla basınca çalışır)
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); targetX = -1.3; });
        document.getElementById('midBtn').addEventListener('touchstart', (e) => { e.preventDefault(); targetX = 0; });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); targetX = 1.3; });

        // Bilgisayardan fareyle test etmek isteyenler için tıklama desteği de ekledik
        document.getElementById('leftBtn').addEventListener('click', () => { targetX = -1.3; });
        document.getElementById('midBtn').addEventListener('click', () => { targetX = 0; });
        document.getElementById('rightBtn').addEventListener('click', () => { targetX = 1.3; });

        // Animasyon Döngüsü
        function animate() {
            requestAnimationFrame(animate);

            // Karakter varsa hedefe yumuşakça kaydır
            if (character) {
                character.position.x += (targetX - character.position.x) * 0.1;
            }
            centerBox.rotation.y += 0.01;

            renderer.render(scene, camera);
        }

        animate();

        // Ekran Boyutu veya Telefon Yan çevrilirse (Orientation Change) uyum sağla
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
