<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlokDiyar - Öneriler Panosu</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --red: #ef4444;
      --input-bg: #1e293b;
    }

    body.theme-dark {
      --bg-primary: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --input-bg: #1e293b;
    }

    body.theme-blue {
      --bg-primary: #030712;
      --bg-card: rgba(17, 24, 39, 0.8);
      --bg-card-border: rgba(59, 130, 246, 0.2);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #1d4ed8;
      --input-bg: #111827;
    }

    body.theme-voxel {
      --bg-primary: #14281d;
      --bg-card: rgba(26, 47, 35, 0.85);
      --bg-card-border: rgba(74, 222, 128, 0.2);
      --text-main: #f0fdf4;
      --text-muted: #86efac;
      --accent: #16a34a;
      --input-bg: #1c3827;
    }

    body.theme-night {
      --bg-primary: #050505;
      --bg-card: rgba(20, 20, 20, 0.9);
      --bg-card-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --accent: #8b5cf6;
      --input-bg: #18181b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--bg-card-border);
      padding: 14px 20px;
      border-radius: 16px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .theme-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-selector span {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .theme-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      outline: none;
    }

    .theme-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    .theme-btn.t-dark { background: #0f172a; }
    .theme-btn.t-blue { background: #1e3a8a; }
    .theme-btn.t-voxel { background: #14281d; }
    .theme-btn.t-night { background: #050505; }

    .announcement-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--bg-card-border);
      padding: 24px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .announcement-text {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-main);
      font-weight: 500;
      flex: 1;
    }

    .announcement-votes {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vote-btn {
      background: var(--input-bg);
      border: 1px solid var(--bg-card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .vote-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .vote-btn.active-like {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--green);
      color: var(--green);
    }

    .vote-btn.active-dislike {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--red);
      color: var(--red);
    }

    .form-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--bg-card-border);
      padding: 20px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-field {
      background: var(--input-bg);
      border: 1px solid var(--bg-card-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .input-nickname {
      flex: 1;
      min-width: 160px;
    }

    .input-content {
      flex: 3;
      min-width: 240px;
    }

    .submit-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 0 4px;
    }

    .list-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .sort-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-select {
      background: var(--input-bg);
      border: 1px solid var(--bg-card-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .suggestions-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .suggestion-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--bg-card-border);
      padding: 16px 20px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
    }

    .suggestion-main {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .suggestion-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .nickname-tag {
      font-weight: 700;
      color: var(--accent);
      background: rgba(59, 130, 246, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .date-tag {
      font-size: 0.78rem;
      opacity: 0.8;
    }

    .suggestion-content {
      font-size: 1rem;
      color: var(--text-main);
      word-break: break-word;
      line-height: 1.5;
    }

    .suggestion-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--bg-card-border);
    }

    @media (max-width: 600px) {
      .announcement-card {
        flex-direction: column;
        align-items: stretch;
      }
      .announcement-votes {
        flex-direction: row;
        justify-content: flex-start;
      }
      .form-row {
        flex-direction: column;
      }
      .input-nickname, .input-content {
        width: 100%;
      }
      .suggestion-card {
        flex-direction: column;
        align-items: stretch;
      }
      .suggestion-actions {
        justify-content: flex-end;
      }
    }
  </style>
</head>
<body class="theme-dark">

  <div class="container">
    
    <!-- Üst Bar & Temalar -->
    <div class="top-bar">
      <div class="status-badge">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Bağlantı Kuruluyor...</span>
      </div>
      <div class="theme-selector">
        <span>Arka Plan:</span>
        <button class="theme-btn t-dark active" onclick="setTheme('dark')" title="Koyu"></button>
        <button class="theme-btn t-blue" onclick="setTheme('blue')" title="Mavi"></button>
        <button class="theme-btn t-voxel" onclick="setTheme('voxel')" title="Voxel / Yeşil"></button>
        <button class="theme-btn t-night" onclick="setTheme('night')" title="Gece"></button>
      </div>
    </div>

    <!-- Karşılama / Duyuru Alanı -->
    <div class="announcement-card">
      <div class="announcement-text">
        "Merhaba Ben mecaga Minecraft benzeri olan BlokDiyar oyunu yapıyom fikrin veya düşüncen ve değiştirmesini istediğin varsa tabloya ekleyebilirsin istersen bende bakıp eklemeye çalışırım sırayla"
      </div>
      <div class="announcement-votes">
        <button class="vote-btn" id="mainLikeBtn" onclick="voteMain('like')">
          <i class="fa-regular fa-thumbs-up"></i>
          <span id="mainLikeCount">0</span>
        </button>
        <button class="vote-btn" id="mainDislikeBtn" onclick="voteMain('dislike')">
          <i class="fa-regular fa-thumbs-down"></i>
          <span id="mainDislikeCount">0</span>
        </button>
      </div>
    </div>

    <!-- Öneri Ekleme Formu -->
    <div class="form-card">
      <div class="form-title">
        <i class="fa-solid fa-lightbulb" style="color: #f59e0b;"></i>
        Yeni Öneri / Fikir Ekle
      </div>
      <div class="form-row">
        <input type="text" id="nicknameInput" class="input-field input-nickname" placeholder="Kısa takma adınız..." maxlength="20">
        <input type="text" id="contentInput" class="input-field input-content" placeholder="Takma ad | İstediğin şey veya önerin...">
      </div>
      <button class="submit-btn" onclick="addSuggestion()">
        <i class="fa-solid fa-paper-plane"></i>
        Öneriyi Gönder
      </button>
    </div>

    <!-- Liste Başlığı ve Sıralama -->
    <div class="list-header">
      <div class="list-title">
        Topluluk Önerileri (<span id="totalCount">0</span>)
      </div>
      <div class="sort-container">
        <i class="fa-solid fa-sort" style="color: var(--text-muted);"></i>
        <select id="sortSelect" class="sort-select" onchange="renderSuggestions()">
          <option value="likes">En Çok Beğenilene Göre</option>
          <option value="newest">En Yeniye Göre</option>
          <option value="oldest">En Eskiye Göre</option>
        </select>
      </div>
    </div>

    <!-- Öneri Listesi -->
    <div id="suggestionsList" class="suggestions-list">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 10px;">Öneriler yükleniyor...</p>
      </div>
    </div>

  </div>

  <script>
    // Firebase Başlatma
    const firebaseConfig = {
      databaseURL: "https://survival-pvp-game-default-rtdb.firebaseio.com/"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const suggestionsRef = db.ref('suggestions');
    const mainVotesRef = db.ref('announcement_votes');

    let suggestionsData = {};
    let localVotes = JSON.parse(localStorage.getItem('blokdiyar_votes') || '{}');

    // Bağlantı Durumu Kontrolü (Firebase .info/connected)
    db.ref('.info/connected').on('value', (snap) => {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (snap.val() === true) {
        dot.style.backgroundColor = 'var(--green)';
        text.textContent = 'Canlı Veritabanı Bağlı';
      } else {
        dot.style.backgroundColor = 'var(--red)';
        text.textContent = 'Bağlantı Bekleniyor...';
      }
    });

    // Tema Değiştirici
    function setTheme(theme) {
      document.body.className = 'theme-' + theme;
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.theme-btn.t-${theme}`).classList.add('active');
    }

    // Duyuru Beğeni Sistemi
    function voteMain(type) {
      if (localVotes['main_announcement']) {
        alert('Bu duyuru için zaten oy kullandınız!');
        return;
      }
      mainVotesRef.child(type).transaction((current) => (current || 0) + 1);
      localVotes['main_announcement'] = type;
      localStorage.setItem('blokdiyar_votes', JSON.stringify(localVotes));
      updateMainVoteUI();
    }

    mainVotesRef.on('value', (snapshot) => {
      const votes = snapshot.val() || { like: 0, dislike: 0 };
      document.getElementById('mainLikeCount').textContent = votes.like || 0;
      document.getElementById('mainDislikeCount').textContent = votes.dislike || 0;
      updateMainVoteUI();
    });

    function updateMainVoteUI() {
      const userVote = localVotes['main_announcement'];
      const likeBtn = document.getElementById('mainLikeBtn');
      const dislikeBtn = document.getElementById('mainDislikeBtn');

      likeBtn.classList.remove('active-like');
      dislikeBtn.classList.remove('active-dislike');

      if (userVote === 'like') likeBtn.classList.add('active-like');
      if (userVote === 'dislike') dislikeBtn.classList.add('active-dislike');
    }

    // Öneri Ekleme
    function addSuggestion() {
      const nicknameInput = document.getElementById('nicknameInput');
      const contentInput = document.getElementById('contentInput');

      const nickname = nicknameInput.value.trim();
      const content = contentInput.value.trim();

      if (!nickname) {
        alert('Lütfen kısa bir takma ad girin!');
        return;
      }
      if (!content) {
        alert('Lütfen öneri içeriğini yazın!');
        return;
      }

      const now = new Date();
      const dateStr = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '
