<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MCPE 3 Slot Envanter & Hizalanmış Item</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #1a1a1a; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
            pointer-events: none;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
        }

        /* --- 3 SLOTLU HOTBAR CONTAINER --- */
        #hotbar-container {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 10px;
            border: 2px solid #555;
            z-index: 10;
        }
        .hotbar-slot {
            width: 52px;
            height: 52px;
            background: rgba(139, 139, 139, 0.4);
            border: 3px solid #3c3c3c;
            border-right-color: #8b8b8b;
            border-bottom-color: #8b8b8b;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
        }
        .hotbar-slot.active {
            border: 3px solid #ffffff;
            box-shadow: 0 0 12px rgba(255,255,255,0.9);
            background: rgba(200, 200, 200, 0.45);
        }
        .slot-img {
            width: 38px;
            height: 38px;
            object-fit: contain;
            image-rendering: pixelated;
        }

        /* --- BUTONLAR (ÇANTA & AT) --- */
        .action-btn {
            height: 52px;
            padding: 0 14px;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.4);
        }
        #bag-btn {
            background: #4a6b22;
            border: 3px solid #2d4213;
        }
        #drop-btn {
            background: #a93226;
            border: 3px solid #641e16;
        }
        .action-btn:active {
            transform: scale(0.94);
        }

        /* --- ENVANTER PANELİ --- */
        #inventory-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            backdrop-filter: blur(4px);
        }
        #inventory-window {
            width: 88%;
            max-width: 380px;
            background: #c6c6c6;
            border: 4px solid #ffffff;
            border-right-color: #555555;
            border-bottom-color: #555555;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.8);
            color: #333;
        }
        .inv-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 2px solid #8b8b8b;
            padding-bottom: 6px;
            font-weight: bold;
        }
        .close-btn {
            background: #c0392b;
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
        }
        .inv-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 6px;
            background: #8b8b8b;
            border: 3px solid #373737;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            border-radius: 4px;
        }
        .inv-slot {
            aspect-ratio: 1;
            background: #8b8b8b;
            border: 3px solid #373737;
            border-right-color: #ffffff;
            border-bottom-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .inv-slot:active {
            background: #aaa;
        }
    </style>
</head>
<body>
    <div id="info">Eşya tam olarak bloğun üst yüzeyine hizalandı.</div>
    
    <!-- 3 Slotlu Hotbar ve Aksiyon Butonları -->
    <div id="hotbar-container">
        <div id="hotbar-slots" style="display: flex; gap: 6px;"></div>
        <div class="action-btn" id="bag-btn">...</div>
        <div class="action-btn" id="drop-btn">At 🗑️</div>
    </div>

    <!-- Envanter Paneli -->
    <div id="inventory-overlay">
        <div id="inventory-window">
            <div class="inv-header">
                <span>Eşya Deposu</span>
                <button class="close-btn" id="close-inv">X</button>
            </div>
            <div class="inv-grid" id="inv-grid"></div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Sahne ve Kamera Kurulumu
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        // Zemin Bloğu (Yüksekliği 0.8, Y konumu -0.8 -> Üst Yüzeyi Y = -0.4 noktasıdır)
        const blockGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const blockMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const groundBlock = new THREE.Mesh(blockGeo, blockMat);
        groundBlock.position.set(0, -0.8, 0);
        scene.add(groundBlock);

        // Bloğun üst yüzeyinin Y yüksekliği
        const blockTopY = -0.4; 

        // 2. Depo Eşya Listesi
        const items = [
            { id: 'deneme', name: 'Özel Eşya', icon: 'deneme.png' },
            { id: 'wood', name: 'Tahta', icon: 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/block/oak_planks.png' },
            { id: 'diamond', name: 'Elmas', icon: 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/item/diamond.png' },
            { id: 'sword', name: 'Kılıç', icon: 'https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.19/assets/minecraft/textures/item/diamond_sword.png' }
        ];

        let hotbarData = ['deneme.png', null, null]; 
        let activeSlotIndex = 0;

        // 3D MCPE Düşen Eşya Nesnesi
        let mcpeItemMesh = null;
        let itemHeight = 0.7; // Eşyanın yüksekliği
        const textureLoader = new THREE.TextureLoader();
        const clock = new THREE.Clock();

        function update3DItem(textureUrl) {
            if (!textureUrl) {
                if (mcpeItemMesh) scene.remove(mcpeItemMesh);
                mcpeItemMesh = null;
                return;
            }

            textureLoader.load(textureUrl, (texture) => {
                if (mcpeItemMesh) scene.remove(mcpeItemMesh);

                const aspect = texture.image.width / texture.image.height;
                const width = itemHeight * aspect;

                const itemGeo = new THREE.PlaneGeometry(width, itemHeight);
                // Resmi alt merkezinden bağımlı yapmak için geometriyi yukarı kaydırıyoruz
                itemGeo.translate(0, itemHeight / 2, 0);

                const itemMat = new THREE.MeshBasicMaterial({ 
                    map: texture, 
                    transparent: true, 
                    side: THREE.DoubleSide 
                });

                mcpeItemMesh = new THREE.Mesh(itemGeo, itemMat);
                // Başlangıç pozisyonu tam bloğun üst yüzeyi
                mcpeItemMesh.position.set(0, blockTopY, 0);
                scene.add(mcpeItemMesh);
            });
        }

        camera.position.set(0, 0.4, 2.2);
        camera.lookAt(0, -0.2, 0);

        update3DItem(hotbarData[activeSlotIndex]);

        // 3. UI İşlemleri (Hotbar & Çanta)
        const hotbarSlotsEl = document.getElementById('hotbar-slots');
        const invGridEl = document.getElementById('inv-grid');

        function renderHotbar() {
            hotbarSlotsEl.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const slot = document.createElement('div');
                slot.className = `hotbar-slot ${i === activeSlotIndex ? 'active' : ''}`;
                
                if (hotbarData[i]) {
                    const img = document.createElement('img');
                    img.src = hotbarData[i];
                    img.className = 'slot-img';
                    slot.appendChild(img);
                }

                slot.addEventListener('click', () => {
                    activeSlotIndex = i;
                    renderHotbar();
                    update3DItem(hotbarData[activeSlotIndex]);
                });

                hotbarSlotsEl.appendChild(slot);
            }
        }

        function renderInventory() {
            invGridEl.innerHTML = '';
            items.forEach((item) => {
                const slot = document.createElement('div');
                slot.className = 'inv-slot';
                
                const img = document.createElement('img');
                img.src = item.icon;
                img.className = 'slot-img';
                slot.appendChild(img);

                slot.addEventListener('click', () => {
                    hotbarData[activeSlotIndex] = item.icon;
                    renderHotbar();
                    update3DItem(hotbarData[activeSlotIndex]);
                    toggleInventory(false);
                });

                invGridEl.appendChild(slot);
            });
        }

        function dropCurrentItem() {
            if (hotbarData[activeSlotIndex]) {
                hotbarData[activeSlotIndex] = null;
                renderHotbar();
                update3DItem(null);
            }
        }

        const overlay = document.getElementById('inventory-overlay');
        function toggleInventory(show) {
            overlay.style.display = show ? 'flex' : 'none';
        }

        document.getElementById('bag-btn').addEventListener('click', () => toggleInventory(true));
        document.getElementById('close-inv').addEventListener('click', () => toggleInventory(false));
        document.getElementById('drop-btn').addEventListener('click', dropCurrentItem);

        window.addEventListener('keydown', (e) => {
            if (e.key === 'e' || e.key === 'E') toggleInventory(overlay.style.display !== 'flex');
            if (e.key === 'q' || e.key === 'Q') dropCurrentItem();
        });

        // 4. Animasyon Döngüsü
        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            if (mcpeItemMesh) {
                // Kameraya bakma (Billboarding)
                mcpeItemMesh.quaternion.copy(camera.quaternion);

                // Bloğun tam üst yüzeyinden başlayarak tatlı bir süzülme hareketi
                const floatOffset = (Math.sin(elapsedTime * 3) + 1) * 0.04; // 0 ile 0.08 arası hafif süzülme
                mcpeItemMesh.position.y = blockTopY + floatOffset;
            }

            renderer.render(scene, camera);
        }

        renderHotbar();
        renderInventory();
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
