<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Minecraft 64x64 Skin Studio</title>
  <!-- Tailwind CSS & Lucide Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Three.js & OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            mcbg: '#0f0f12',
            mcpanel: '#18181c',
            mcaccent: '#2563eb',
          }
        }
      }
    }
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body, html { 
      background-color: #0f0f12 !important; 
      color: #f4f4f5; 
      margin: 0; 
      padding: 0; 
      overflow: hidden; 
      width: 100vw; 
      height: 100vh;
      position: fixed;
    }
    
    canvas.pixelated {
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      -ms-interpolation-mode: nearest-neighbor;
    }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #18181b; }
    ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 3px; }
    
    /* Sol Raf Kapanma & Stabilizasyon */
    #shelfPanel {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), width 0.3s ease;
      flex-shrink: 0;
    }
    #shelfPanel.closed {
      transform: translateX(-100%);
      width: 0 !important;
      min-width: 0 !important;
      padding: 0 !important;
      border: none !important;
      overflow: hidden;
    }

    /* Sağ Üst 3D Panel Çekmece */
    #floatingPanel {
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    #floatingPanel.panel-closed {
      transform: translateX(110%);
      opacity: 0;
      pointer-events: none;
    }

    .grid-overlay {
      background-size: 16px 16px;
      background-image: 
        linear-gradient(to right, rgba(0, 255, 255, 0.15) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
    }
  </style>
</head>
<body class="bg-[#0f0f12] text-gray-100 flex flex-col font-sans select-none">

  <!-- JAVASCRIPT LOJİĞİ -->
  <script>
    lucide.createIcons();

    const skinCanvas = document.getElementById('skinCanvas');
    const ctx = skinCanvas.getContext('2d', { willReadFrequently: true });
    const gridCanvas = document.getElementById('gridCanvas');
    const gridCtx = gridCanvas.getContext('2d');

    let currentTool = 'pencil';
    let currentColor = '#208ea3';
    let isDrawing = false;
    let isEditing = false;
    let isBedMode = false;
    let isPanelOpen = true;
    let activeCostumeId = 1;
    let mini3DScenes = [];

    let costumes = [
      { id: 1, name: "Mecaga Özel Zırh", color: "#208ea3" },
      { id: 2, name: "Savaşçı Kostümü", color: "#ef4444" },
      { id: 3, name: "Zümrüt Muhafız", color: "#10b981" }
    ];

    // --- MİNECRAFT 64x64 UV MAP KOORDİNATLARI (SETBOXUVS) ---
    function setBoxUVs(geometry, u, v, w, h, d, textureWidth = 64, textureHeight = 64) {
      const uvAttribute = geometry.attributes.uv;
      const x0 = u / textureWidth;
      const x1 = (u + d) / textureWidth;
      const x2 = (u + d + w) / textureWidth;
      const x3 = (u + 2 * d + w) / textureWidth;
      const x4 = (u + 2 * d + 2 * w) / textureWidth;

      const y0 = 1 - (v + h + d) / textureHeight;
      const y1 = 1 - (v + d) / textureHeight;
      const y2 = 1 - v / textureHeight;

      const uvs = [
        x1, y1,  x0, y1,  x1, y2,  x0, y2, // Right
        x3, y1,  x2, y1,  x3, y2,  x2, y2, // Left
        x2, y1,  x1, y1,  x2, y0,  x1, y0, // Top
        x3, y0,  x2, y0,  x3, y1,  x2, y1, // Bottom
        x2, y1,  x1, y1,  x2, y2,  x1, y2, // Front
        x4, y1,  x3, y1,  x4, y2,  x3, y2  // Back
      ];

      for (let i = 0; i < uvs.length; i++) {
        uvAttribute.setX(i, uvs[i]);
      }
      uvAttribute.needsUpdate = true;
    }

    // --- SOL RAF MİNİ 3D MODELLERİ ---
    function renderCostumeShelf() {
      const shelfList = document.getElementById('costumeShelfList');
      shelfList.innerHTML = '';
      mini3DScenes = [];

      costumes.forEach(c => {
        const isActive = c.id === activeCostumeId;
        const card = document.createElement('div');
        card.className = `p-3 rounded-xl border cursor-pointer transition flex items-center justify-between shadow ${
          isActive ? 'bg-blue-600/20 border-blue-500 ring-1 ring-blue-500' : 'bg-zinc-900/80 border-zinc-800 hover:bg-zinc-800/60'
        }`;

        const miniCanvasId = `miniCanvas_${c.id}`;

        card.innerHTML = `
          <div class="flex items-center gap-3">
            <div class="w-14 h-14 rounded-lg bg-zinc-950 border border-zinc-800 overflow-hidden relative shrink-0 flex items-center justify-center">
              <canvas id="${miniCanvasId}" class="w-full h-full block"></canvas>
            </div>
            <div>
              <div class="font-bold text-xs text-zinc-200">${c.name}</div>
              <div class="text-[10px] text-zinc-500">ID: #${c.id}</div>
            </div>
          </div>
          ${isActive ? '<span class="text-[10px] text-emerald-400 font-bold bg-emerald-950/80 px-2 py-0.5 rounded border border-emerald-800">Aktif</span>' : ''}
        `;

        card.onclick = () => {
          activeCostumeId = c.id;
          drawDefaultSkinData();
          renderCostumeShelf();
        };

        shelfList.appendChild(card);
        setTimeout(() => initMini3DCard(miniCanvasId, c.color), 10);
      });
    }

    function initMini3DCard(canvasId, mainColor) {
      const canvas = document.getElementById(canvasId);
      if (!canvas) return;

      const mScene = new THREE.Scene();
      mScene.background = new THREE.Color(0x0f0f12);

      const mCam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
      mCam.position.set(0, 0.2, 3.8);

      const mRen = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
      mRen.setSize(56, 56);

      const mLight = new THREE.DirectionalLight(0xffffff, 1);
      mLight.position.set(2, 3, 2);
      mScene.add(mLight);
      mScene.add(new THREE.AmbientLight(0xffffff, 0.6));

      const mGroup = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: mainColor, roughness: 0.5 });

      function createMiniPart(w, h, d, x, y, z) {
        const geo = new THREE.BoxGeometry(w, h, d);
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(x, y, z);
        const edges = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffff }));
        mesh.add(line);
        return mesh;
      }

      mGroup.add(createMiniPart(0.6, 0.6, 0.6, 0, 0.6, 0));
      mGroup.add(createMiniPart(0.6, 0.9, 0.3, 0, -0.15, 0));
      mGroup.add(createMiniPart(0.3, 0.9, 0.3, -0.45, -0.15, 0));
      mGroup.add(createMiniPart(0.3, 0.9, 0.3, 0.45, -0.15, 0));
      mGroup.add(createMiniPart(0.3, 0.9, 0.3, -0.15, -1.05, 0));
      mGroup.add(createMiniPart(0.3, 0.9, 0.3, 0.15, -1.05, 0));

      mScene.add(mGroup);
      mini3DScenes.push({ scene: mScene, camera: mCam, renderer: mRen, group: mGroup });
    }

    // --- DOKU ÇİZİMİ (TÜRK BAYRAĞI C* DAHİL) ---
    function drawDefaultSkinData() {
      ctx.clearRect(0, 0, 64, 64);

      const cHair = '#52341d', cFace = '#cba07a', cEyeW = '#ffffff', cEyeB = '#4b382a';
      const cShirt = '#208ea3', cShirtDark = '#176979', cPants = '#3b3175', cPantsDark = '#2b2358';
      const cRed = '#cc182b', cWhite = '#ffffff';

      // Kafa
      ctx.fillStyle = cHair; ctx.fillRect(8, 0, 8, 8); ctx.fillRect(16, 0, 8, 8); ctx.fillRect(0, 8, 32, 8);
      ctx.fillStyle = cFace; ctx.fillRect(8, 10, 8, 6);
      ctx.fillStyle = cEyeW; ctx.fillRect(9, 13, 2, 1); ctx.fillRect(13, 13, 2, 1);
      ctx.fillStyle = cEyeB; ctx.fillRect(10, 13, 1, 1); ctx.fillRect(13, 13, 1, 1);

      // Gövde & Türk Bayrağı C*
      ctx.fillStyle = cShirt; ctx.fillRect(20, 16, 8, 4); ctx.fillRect(28, 16, 8, 4); ctx.fillRect(16, 20, 24, 12);
      ctx.fillStyle = cRed; ctx.fillRect(32, 20, 8, 12);
      ctx.fillStyle = cWhite; ctx.fillRect(34, 23, 3, 5);
      ctx.fillStyle = cRed; ctx.fillRect(35, 24, 2, 3);
      ctx.fillStyle = cWhite; ctx.fillRect(37, 25, 1, 1);

      // Kollar & Bacaklar
      ctx.fillStyle = cShirtDark; ctx.fillRect(44, 16, 4, 4); ctx.fillRect(48, 16, 4, 4); ctx.fillRect(40, 20, 16, 4);
      ctx.fillStyle = cFace; ctx.fillRect(40, 24, 16, 8);
      ctx.fillStyle = cPantsDark; ctx.fillRect(4, 16, 4, 4); ctx.fillRect(8, 16, 4, 4); ctx.fillRect(0, 20, 16, 12);
      ctx.fillStyle = cPants; ctx.fillRect(20, 48, 4, 4); ctx.fillRect(24, 48, 4, 4); ctx.fillRect(16, 52, 16, 12);
      ctx.fillStyle = cShirt; ctx.fillRect(36, 48, 4, 4); ctx.fillRect(40, 48, 4, 4); ctx.fillRect(32, 52, 16, 4);
      ctx.fillStyle = cFace; ctx.fillRect(32, 56, 16, 8);

      updateGridOverlay();
      update3DTexture();
    }

    function updateGridOverlay() {
      gridCtx.clearRect(0, 0, 512, 512);
      const scale = 512 / 64;
      gridCtx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      gridCtx.lineWidth = 0.5;

      for (let i = 0; i <= 64; i++) {
        gridCtx.beginPath(); gridCtx.moveTo(i * scale, 0); gridCtx.lineTo(i * scale, 512); gridCtx.stroke();
        gridCtx.beginPath(); gridCtx.moveTo(0, i * scale); gridCtx.lineTo(512, i * scale); gridCtx.stroke();
      }
    }

    // --- THREE.JS ANA 3D SAHNE & DOĞRU 64x64 UV HARİTASI ---
    let scene, camera, renderer, controls, skinTexture, characterGroup;

    function init3D() {
      const container = document.getElementById('container3D');
      const canvas = document.getElementById('canvas3D');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f0f12);

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(0, 1.2, 4.5);

      renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight.position.set(3, 5, 4);
      scene.add(dirLight);

      skinTexture = new THREE.CanvasTexture(skinCanvas);
      skinTexture.magFilter = THREE.NearestFilter;
      skinTexture.minFilter = THREE.NearestFilter;

      const skinMaterial = new THREE.MeshStandardMaterial({ map: skinTexture, roughness: 0.8, metalness: 0.1 });
      characterGroup = new THREE.Group();

      function createPartWithUV(w, h, d, x, y, z, u, v) {
        const geo = new THREE.BoxGeometry(w, h, d);
        setBoxUVs(geo, u, v, w * 10, h * 10, d * 10);
        const mesh = new THREE.Mesh(geo, skinMaterial);
        mesh.position.set(x, y, z);

        const edges = new THREE.EdgesGeometry(geo);
        const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 }));
        mesh.add(line);
        return mesh;
      }

      // Minecraft Standart 3D Uzuv Hiyerarşisi
      characterGroup.add(createPartWithUV(0.8, 0.8, 0.8, 0, 0.8, 0, 0, 0));       // Kafa
      characterGroup.add(createPartWithUV(0.8, 1.2, 0.4, 0, -0.2, 0, 16, 16));    // Gövde
      characterGroup.add(createPartWithUV(0.4, 1.2, 0.4, -0.6, -0.2, 0, 40, 16)); // Sağ Kol
      characterGroup.add(createPartWithUV(0.4, 1.2, 0.4, 0.6, -0.2, 0, 40, 16));  // Sol Kol
      characterGroup.add(createPartWithUV(0.4, 1.2, 0.4, -0.2, -1.4, 0, 0, 16));  // Sol Bacak
      characterGroup.add(createPartWithUV(0.4, 1.2, 0.4, 0.2, -1.4, 0, 0, 16));   // Sağ Bacak

      scene.add(characterGroup);

      function animate() {
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);

        mini3DScenes.forEach(m => {
          if (m.group) m.group.rotation.y += 0.02;
          if (m.renderer && m.scene && m.camera) m.renderer.render(m.scene, m.camera);
        });
      }
      animate();
    }

    function update3DTexture() {
      if (skinTexture) skinTexture.needsUpdate = true;
    }

    function onWindowResize() {
      const container = document.getElementById('container3D');
      if (!container || !renderer || !camera) return;
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }
    window.addEventListener('resize', onWindowResize);

    // --- ETKİLEŞİMLER VE ÇİZİM ---
    document.addEventListener('DOMContentLoaded', () => {
      init3D();
      drawDefaultSkinData();
      renderCostumeShelf();

      const shelfPanel = document.getElementById('shelfPanel');
      const closeShelfBtn = document.getElementById('closeShelfBtn');
      const openShelfBtn = document.getElementById('openShelfBtn');

      closeShelfBtn.onclick = () => {
        shelfPanel.classList.add('closed');
        setTimeout(() => {
          openShelfBtn.classList.remove('hidden');
          onWindowResize();
        }, 150);
      };

      openShelfBtn.onclick = () => {
        shelfPanel.classList.remove('closed');
        openShelfBtn.classList.add('hidden');
        setTimeout(onWindowResize, 150);
      };

      // Sağ Üst 3D Panel Çekmece Kontrolleri
      const floatingPanel = document.getElementById('floatingPanel');
      const toggleCornerPanelBtn = document.getElementById('toggleCornerPanelBtn');
      const closeFloatingPanelBtn = document.getElementById('closeFloatingPanelBtn');
      const panelChevron = document.getElementById('panelChevron');

      function setFloatingPanel(open) {
        isPanelOpen = open;
        if (isPanelOpen) {
          floatingPanel.classList.remove('panel-closed');
          panelChevron.style.transform = 'rotate(180deg)';
        } else {
          floatingPanel.classList.add('panel-closed');
          panelChevron.style.transform = 'rotate(0deg)';
        }
      }

      toggleCornerPanelBtn.onclick = () => setFloatingPanel(!isPanelOpen);
      closeFloatingPanelBtn.onclick = () => setFloatingPanel(false);

      // Yatak Modu
      document.getElementById('toggleSleepBtn').onclick = () => {
        isBedMode = !isBedMode;
        const btnText = document.getElementById('sleepBtnText');
        if (isBedMode) {
          characterGroup.rotation.x = -Math.PI / 2;
          characterGroup.position.set(0, -0.5, 0);
          btnText.innerText = "Ayakta";
        } else {
          characterGroup.rotation.x = 0;
          characterGroup.position.set(0, 0, 0);
          btnText.innerText = "Yatak Modu";
        }
      };

      // Mod Butonları
      const btnMode3D = document.getElementById('btnMode3D');
      const btnMode2D = document.getElementById('btnMode2D');
      const panel2D = document.getElementById('panel2D');
      const container3D = document.getElementById('container3D');

      btnMode3D.onclick = () => {
        btnMode3D.className = "px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-lg border border-blue-400 transition active:scale-95 flex items-center gap-1.5";
        btnMode2D.className = "px-4 py-2 bg-zinc-800 text-zinc-300 hover:bg-zinc-700 font-bold text-xs rounded-xl shadow-lg border border-zinc-700 transition active:scale-95 flex items-center gap-1.5";
        panel2D.classList.add('hidden');
        container3D.classList.remove('hidden');
        onWindowResize();
      };

      btnMode2D.onclick = () => {
        btnMode2D.className = "px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-lg border border-blue-400 transition active:scale-95 flex items-center gap-1.5";
        btnMode3D.className = "px-4 py-2 bg-zinc-800 text-zinc-300 hover:bg-zinc-700 font-bold text-xs rounded-xl shadow-lg border border-zinc-700 transition active:scale-95 flex items-center gap-1.5";
        container3D.classList.add('hidden');
        panel2D.classList.remove('hidden');
        panel2D.classList.add('flex');
      };

      // Çizim Olayları
      function getCanvasCoords(e) {
        const rect = skinCanvas.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        const x = Math.floor((clientX - rect.left) / (rect.width / 64));
        const y = Math.floor((clientY - rect.top) / (rect.height / 64));
        return { x: Math.max(0, Math.min(63, x)), y: Math.max(0, Math.min(63, y)) };
      }

      function applyTool(x, y) {
        if (!isEditing) return;
        if (currentTool === 'pencil') {
          ctx.fillStyle = currentColor;
          ctx.fillRect(x, y, 1, 1);
        } else if (currentTool === 'eraser') {
          ctx.clearRect(x, y, 1, 1);
        } else if (currentTool === 'picker') {
          const pixel = ctx.getImageData(x, y, 1, 1).data;
          if (pixel[3] > 0) {
            const hex = "#" + ((1 << 24) + (pixel[0] << 16) + (pixel[1] << 8) + pixel[2]).toString(16).slice(1);
            currentColor = hex;
            document.getElementById('primaryColor').value = hex;
          }
        }
        update3DTexture();
      }

      skinCanvas.addEventListener('mousedown', (e) => { isDrawing = true; const c = getCanvasCoords(e); applyTool(c.x, c.y); });
      skinCanvas.addEventListener('mousemove', (e) => { if (isDrawing) { const c = getCanvasCoords(e); applyTool(c.x, c.y); } });
      window.addEventListener('mouseup', () => isDrawing = false);

      document.getElementById('toolPencil').onclick = () => currentTool = 'pencil';
      document.getElementById('toolEraser').onclick = () => currentTool = 'eraser';
      document.getElementById('toolPicker').onclick = () => currentTool = 'picker';
      document.getElementById('primaryColor').addEventListener('input', (e) => currentColor = e.target.value);

      // Düzenleme / Kullan / Sil
      const defaultActionBtns = document.getElementById('defaultActionBtns');
      const editToolBar = document.getElementById('editToolBar');
      const btnStartEdit = document.getElementById('btnStartEdit');
      const btnSaveEdit = document.getElementById('btnSaveEdit');

      btnStartEdit.onclick = () => {
        isEditing = true;
        defaultActionBtns.classList.add('hidden');
        editToolBar.classList.remove('hidden');
        btnMode2D.click();
      };

      btnSaveEdit.onclick = () => {
        isEditing = false;
        update3DTexture();
        editToolBar.classList.add('hidden');
        defaultActionBtns.classList.remove('hidden');
        btnMode3D.click();
        alert('Kostüm kaydedildi!');
      };

      document.getElementById('btnUseCostume').onclick = () => {
        update3DTexture();
        alert('Kostüm aktif kılındı!');
      };

      document.getElementById('btnDeleteCostume').onclick = () => {
        if (costumes.length <= 1) return alert('En az bir kostüm kalmalıdır!');
        costumes = costumes.filter(c => c.id !== activeCostumeId);
        activeCostumeId = costumes[0].id;
        renderCostumeShelf();
      };

      document.getElementById('addCostumeBtn').onclick = () => {
        const newId = Date.now();
        costumes.push({ id: newId, name: `Kostüm ${costumes.length + 1}`, color: "#f59e0b" });
        activeCostumeId = newId;
        renderCostumeShelf();
      };

      // İndirmeler & Yüklemeler
      document.getElementById('btnExport2D').onclick = () => {
        const a = document.createElement('a');
        a.download = 'skin-texture-64x64.png';
        a.href = skinCanvas.toDataURL('image/png');
        a.click();
      };

      document.getElementById('downloadSkinBtn').onclick = () => {
        const a = document.createElement('a');
        a.download = 'skin_64x64.png';
        a.href = skinCanvas.toDataURL('image/png');
        a.click();
      };

      document.getElementById('downloadSnapshotBtn').onclick = () => {
        renderer.render(scene, camera);
        const a = document.createElement('a');
        a.download = 'character_3d.png';
        a.href = renderer.domElement.toDataURL('image/png');
        a.click();
      };

      document.getElementById('importInput').onchange = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (event) => {
            const img = new Image();
            img.onload = () => {
              ctx.clearRect(0, 0, 64, 64);
              ctx.drawImage(img, 0, 0, 64, 64);
              update3DTexture();
            };
            img.src = event.target.result;
          };
          reader.readAsDataURL(file);
        }
      };
    });
  </script>
</body>
</html>
