<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Minecraft 3D Kostüm Stüdyosu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0f172a; color: #f8fafc; font-family: sans-serif; overflow: hidden; }
        .canvas-container { position: relative; width: 100%; height: 100%; }
        /* Custom Scrollbar for Shelf */
        .shelf-scroll::-webkit-scrollbar { width: 6px; }
        .shelf-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .shelf-scroll::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 3px; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="h-screen w-screen flex flex-col select-none">

    <!-- ÜST BAR / HEADER -->
    <header class="h-14 bg-slate-900/90 border-b border-slate-800 flex items-center justify-between px-4 z-20 shrink-0">
        <div class="flex items-center gap-2">
            <span class="text-xl">👕</span>
            <h1 class="font-bold text-lg text-slate-100 tracking-wide">Kostüm Stüdyosu</h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-save-snapshot" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 text-slate-200 transition">
                📸 3D Resim İndir
            </button>
            <button id="btn-download-texture" class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-semibold rounded-lg border border-slate-700 text-slate-200 transition">
                💾 Doku İndir (PNG)
            </button>
            <label class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-xs font-semibold rounded-lg text-white cursor-pointer transition">
                📂 Skin Yükle
                <input type="file" id="input-upload-skin" accept="image/png" class="hidden">
            </label>
        </div>
    </header>

    <!-- İKİYE BÖLÜNMÜŞ ANA EKRAN (SPLIT SCREEN) -->
    <main class="flex-1 flex overflow-hidden">

        <!-- SOL TARAF: KOSTÜM RAFI (UP/DOWN SCROLL) -->
        <section class="w-80 md:w-96 bg-slate-900 border-r border-slate-800 flex flex-col p-4 shrink-0">
            <div class="flex items-center justify-between mb-4">
                <h2 class="font-bold text-slate-300 text-sm tracking-wider uppercase">Kostüm Rafı</h2>
                <button id="btn-add-costume" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg flex items-center gap-1 shadow-md transition">
                    <span>+</span> Yeni Ekle
                </button>
            </div>

            <!-- KOSTÜM LİSTESİ -->
            <div id="costume-list" class="flex-1 overflow-y-auto shelf-scroll space-y-4 pr-1">
                <!-- Dinamik Kostüm Kartları Buraya Eklenecek -->
            </div>
        </section>

        <!-- SAĞ TARAF: ÇALIŞMA ALANI (3D / 2D VIEWPORT) -->
        <section class="flex-1 flex flex-col relative bg-slate-950">

            <!-- MOD DEĞİŞTİRME BARIBUTONLARI -->
            <div class="absolute top-4 left-4 z-10 flex gap-2">
                <button id="btn-mode-3d" class="px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-lg border border-blue-400">
                    🧊 3D İncele (360°)
                </button>
                <button id="btn-mode-2d" class="px-4 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-lg border border-slate-700">
                    ✏️ 2D Doku Düzenle
                </button>
                <button id="btn-toggle-bed" class="px-3 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-lg border border-slate-700">
                    🛏️ Yatak Modu
                </button>
            </div>

            <!-- AKTİF KOSTÜM EYLEM BUTONLARI (ALT ORTA) -->
            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-10 bg-slate-900/90 backdrop-blur border border-slate-700 px-4 py-2.5 rounded-2xl shadow-2xl flex items-center gap-3">
                <button id="btn-use" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl transition">
                    ✓ Kullan
                </button>
                <button id="btn-edit" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl transition">
                    ✏️ Değiştir
                </button>
                <button id="btn-delete" class="px-4 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl transition">
                    🗑️ Sil
                </button>
            </div>

            <!-- 3D VIEWPORT CONTAINER -->
            <div id="container-3d" class="w-full h-full"></div>

            <!-- 2D EDITCONTAINER (GİZLİ BAŞLAR) -->
            <div id="container-2d" class="w-full h-full hidden flex-col items-center justify-center p-6 bg-slate-900">
                <div class="mb-3 flex items-center gap-4 bg-slate-800 p-2 rounded-xl border border-slate-700">
                    <input type="color" id="color-picker" value="#3b82f6" class="w-8 h-8 rounded border-0 cursor-pointer">
                    <button id="tool-pencil" class="px-3 py-1 bg-blue-600 text-white text-xs font-bold rounded">Kalem</button>
                    <button id="tool-eraser" class="px-3 py-1 bg-slate-700 text-slate-300 text-xs font-bold rounded">Silgi</button>
                    <button id="btn-save-2d" class="px-4 py-1 bg-emerald-600 text-white text-xs font-bold rounded ml-auto">💾 Kaydet & Uygula</button>
                </div>
                <div class="relative border-2 border-slate-700 rounded-lg overflow-hidden bg-black/40">
                    <canvas id="canvas-2d" width="512" height="512" class="cursor-crosshair"></canvas>
                </div>
            </div>

        </section>

    </main>

    <script>
        // TS / JS Kod Yapısı & Three.js Başlatma Mantığı
        let scene, camera, renderer, controls, characterGroup;
        let activeCostumeId = 1;
        let isSleeping = false;
        let currentTool = 'pencil';

        // 64x64 Standart Minecraft UV Çizim Tuvali
        const offCanvas = document.createElement('canvas');
        offCanvas.width = 64; offCanvas.height = 64;
        const offCtx = offCanvas.getContext('2d');

        const displayCanvas = document.getElementById('canvas-2d');
        const displayCtx = displayCanvas.getContext('2d');

        let costumeTexture, textureMaterial;

        // Varsayılan Kostüm Verileri
        let costumes = [
            { id: 1, name: "Savaşçı Kostümü", color: "#ef4444" },
            { id: 2, name: "Mecaga Özel", color: "#8b5cf6" },
            { id: 3, name: "Şövalye Zırhı", color: "#10b981" }
        ];

        // Temel Dokuyu Çiz
        function drawBaseTexture(color) {
            offCtx.fillStyle = color;
            offCtx.fillRect(0, 0, 64, 64);

            // Baş / Yüz Alanı (UV Haritasına Uygun)
            offCtx.fillStyle = '#ffdbac';
            offCtx.fillRect(8, 8, 8, 8); // Ön Yüz
            offCtx.fillStyle = '#1e293b';
            offCtx.fillRect(10, 11, 1, 1); // Sol Göz
            offCtx.fillRect(13, 11, 1, 1); // Sağ Göz

            // Gövde Türk Bayrağı Detayı
            offCtx.fillStyle = '#dc2626';
            offCtx.fillRect(20, 20, 8, 12);
            offCtx.fillStyle = '#ffffff';
            offCtx.fillText('C*', 21, 28);

            updateDisplayCanvas();
            update3DTexture();
        }

        function updateDisplayCanvas() {
            displayCtx.imageSmoothingEnabled = false;
            displayCtx.drawImage(offCanvas, 0, 0, 512, 512);

            // Piksel Izgara Çizgileri
            displayCtx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            displayCtx.lineWidth = 1;
            for (let i = 0; i <= 512; i += 8) {
                displayCtx.beginPath(); displayCtx.moveTo(i, 0); displayCtx.lineTo(i, 512); displayCtx.stroke();
                displayCtx.beginPath(); displayCtx.moveTo(0, i); displayCtx.lineTo(512, i); displayCtx.stroke();
            }
        }

        function update3DTexture() {
            if (costumeTexture) {
                costumeTexture.needsUpdate = true;
            }
        }

        function init3D() {
            const container = document.getElementById('container-3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0f172a);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 1.2, 4.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const light = new THREE.DirectionalLight(0xffffff, 0.9);
            light.position.set(2, 4, 3);
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));

            // Doku
            costumeTexture = new THREE.CanvasTexture(offCanvas);
            costumeTexture.magFilter = THREE.NearestFilter;
            costumeTexture.minFilter = THREE.NearestFilter;

            textureMaterial = new THREE.MeshStandardMaterial({
                map: costumeTexture,
                roughness: 0.8,
                metalness: 0.1
            });

            // Minecraft Karakter Parçaları
            characterGroup = new THREE.Group();

            function createPart(w, h, d, x, y, z) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geo, textureMaterial);
                mesh.position.set(x, y, z);
                
                const edges = new THREE.EdgesGeometry(geo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffff }));
                mesh.add(line);
                return mesh;
            }

            characterGroup.add(createPart(0.8, 0.8, 0.8, 0, 0.8, 0));   // Kafa
            characterGroup.add(createPart(0.8, 1.2, 0.4, 0, -0.2, 0));  // Gövde
            characterGroup.add(createPart(0.4, 1.2, 0.4, -0.6, -0.2, 0));// Sol Kol
            characterGroup.add(createPart(0.4, 1.2, 0.4, 0.6, -0.2, 0)); // Sağ Kol
            characterGroup.add(createPart(0.4, 1.2, 0.4, -0.2, -1.4, 0));// Sol Bacak
            characterGroup.add(createPart(0.4, 1.2, 0.4, 0.2, -1.4, 0)); // Sağ Bacak

            scene.add(characterGroup);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if(controls) controls.update();
            if(renderer && scene && camera) renderer.render(scene, camera);
        }

        function renderCostumeShelf() {
            const listEl = document.getElementById('costume-list');
            listEl.innerHTML = '';

            costumes.forEach(c => {
                const isActive = c.id === activeCostumeId;
                const card = document.createElement('div');
                card.className = `p-3 rounded-xl border cursor-pointer transition flex items-center justify-between ${
                    isActive ? 'bg-blue-600/20 border-blue-500' : 'bg-slate-800/60 border-slate-700 hover:bg-slate-800'
                }`;

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-8 h-8 rounded-lg flex items-center justify-center font-bold text-xs text-white" style="background-color: ${c.color}">
                            👕
                        </div>
                        <div>
                            <div class="font-bold text-xs text-slate-200">${c.name}</div>
                            <div class="text-[10px] text-slate-400">ID: #${c.id}</div>
                        </div>
                    </div>
                `;

                card.onclick = () => selectCostume(c.id);
                listEl.appendChild(card);
            });
        }

        function selectCostume(id) {
            activeCostumeId = id;
            const costume = costumes.find(c => c.id === id);
            if (costume) {
                drawBaseTexture(costume.color);
            }
            renderCostumeShelf();
        }

        window.addEventListener('resize', () => {
            const container = document.getElementById('container-3d');
            if(!container || !renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        document.addEventListener("DOMContentLoaded", () => {
            init3D();
            drawBaseTexture('#ef4444');
            renderCostumeShelf();

            // Mod Butonları Olayları
            const btn3D = document.getElementById('btn-mode-3d');
            const btn2D = document.getElementById('btn-mode-2d');
            const container3D = document.getElementById('container-3d');
            const container2D = document.getElementById('container-2d');

            btn3D.onclick = () => {
                container2D.classList.add('hidden');
                container2D.classList.remove('flex');
                container3D.classList.remove('hidden');
                btn3D.className = "px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-lg border border-blue-400";
                btn2D.className = "px-4 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-lg border border-slate-700";
            };

            btn2D.onclick = () => {
                container3D.classList.add('hidden');
                container2D.classList.remove('hidden');
                container2D.classList.add('flex');
                btn2D.className = "px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-lg border border-blue-400";
                btn3D.className = "px-4 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-lg border border-slate-700";
            };

            // Yatak Modu
            document.getElementById('btn-toggle-bed').onclick = () => {
                isSleeping = !isSleeping;
                if (characterGroup) {
                    characterGroup.rotation.x = isSleeping ? -Math.PI / 2 : 0;
                    characterGroup.position.y = isSleeping ? -0.5 : 0;
                }
            };

            // Kostüm Yönetim Butonları
            document.getElementById('btn-add-costume').onclick = () => {
                const newId = Date.now();
                const colors = ['#f59e0b', '#ec4899', '#06b6d4', '#10b981', '#3b82f6'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                costumes.push({ id: newId, name: `Kostüm ${costumes.length + 1}`, color: randomColor });
                selectCostume(newId);
            };

            document.getElementById('btn-use').onclick = () => {
                update3DTexture();
                alert('Kostüm başarıyla giydirildi!');
            };

            document.getElementById('btn-edit').onclick = () => btn2D.click();

            document.getElementById('btn-delete').onclick = () => {
                if (costumes.length <= 1) {
                    alert('En az bir kostüm kalmalıdır!');
                    return;
                }
                costumes = costumes.filter(c => c.id !== activeCostumeId);
                selectCostume(costumes[0].id);
            };

            // 2D Çizim İşlemleri
            let isDrawing = false;
            displayCanvas.onpointerdown = (e) => { isDrawing = true; draw(e); };
            displayCanvas.onpointermove = (e) => { if (isDrawing) draw(e); };
            window.onpointerup = () => isDrawing = false;

            function draw(e) {
                const rect = displayCanvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / (rect.width / 64));
                const y = Math.floor((e.clientY - rect.top) / (rect.height / 64));

                if (x >= 0 && x < 64 && y >= 0 && y < 64) {
                    if (currentTool === 'eraser') {
                        offCtx.clearRect(x, y, 1, 1);
                    } else {
                        offCtx.fillStyle = document.getElementById('color-picker').value;
                        offCtx.fillRect(x, y, 1, 1);
                    }
                    updateDisplayCanvas();
                    update3DTexture();
                }
            }

            document.getElementById('tool-pencil').onclick = () => currentTool = 'pencil';
            document.getElementById('tool-eraser').onclick = () => currentTool = 'eraser';

            document.getElementById('btn-save-2d').onclick = () => {
                update3DTexture();
                alert('Kostüm değişiklikleri kaydedildi!');
                btn3D.click();
            };

            // Dosya ve İndirme Olayları
            document.getElementById('btn-save-snapshot').onclick = () => {
                renderer.render(scene, camera);
                const a = document.createElement('a');
                a.download = 'minecraft-costume-3d.png';
                a.href = renderer.domElement.toDataURL('image/png');
                a.click();
            };

            document.getElementById('btn-download-texture').onclick = () => {
                const a = document.createElement('a');
                a.download = 'skin-texture-64x64.png';
                a.href = offCanvas.toDataURL('image/png');
                a.click();
            };

            document.getElementById('input-upload-skin').onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const img = new Image();
                    img.onload = () => {
                        offCtx.clearRect(0, 0, 64, 64);
                        offCtx.drawImage(img, 0, 0, 64, 64);
                        updateDisplayCanvas();
                        update3DTexture();
                    };
                    img.src = URL.createObjectURL(file);
                }
            };
        });
    </script>
</body>
</html>
