<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Survival PvP - Multiplayer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #07070f; color: #fff; font-family: sans-serif; overflow: hidden; height: 100vh; display: flex; align-items: center; justify-content: center; }

        .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle, #1a1a2e 0%, #07070f 100%); }
        .screen.active { display: flex; }

        .btn { width: 80%; max-width: 280px; padding: 14px; margin: 8px 0; background: #e74c3c; border: none; border-radius: 8px; color: white; font-size: 16px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.4); cursor: pointer; text-align: center; }
        .btn:active { transform: scale(0.97); }
        .btn-blue { background: #3498db; }
        .btn-green { background: #2ecc71; }
        .input-box { width: 80%; max-width: 280px; padding: 14px; margin: 8px 0; background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3); border-radius: 8px; color: white; font-size: 16px; text-align: center; outline: none; }

        #game-screen { background: #132213; justify-content: flex-start; }
        #ui {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; align-items: flex-start;
            font-size: 12px; font-weight: bold; text-shadow: 1px 1px 2px #000; z-index: 10; pointer-events: none;
        }
        .panel { background: rgba(0,0,0,0.75); padding: 6px 10px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.2); pointer-events: auto; }
        canvas { background: #132213; display: block; box-shadow: 0 0 20px rgba(0,0,0,0.9); margin-top: 50px; }

        #joystick-base {
            position: absolute; bottom: 25px; left: 25px; width: 110px; height: 110px;
            background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.3);
            border-radius: 55px; z-index: 10; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 32px; left: 32px; width: 46px; height: 46px;
            background: rgba(255,255,255,0.6); border-radius: 23px; pointer-events: none;
        }
        .action-container { position: absolute; bottom: 25px; right: 25px; display: flex; gap: 12px; z-index: 10; align-items: flex-end; }
        .btn-round {
            width: 65px; height: 65px; border-radius: 32px; display: flex; align-items: center; justify-content: center; font-size: 24px;
            border: 2px solid rgba(255,255,255,0.4); box-shadow: 0 4px 10px rgba(0,0,0,0.5); background: rgba(40,40,60,0.8);
            touch-action: manipulation;
        }
        #btn-attack { background: rgba(231, 76, 60, 0.8); border-color: #e74c3c; }
        #btn-inv { background: rgba(52, 152, 219, 0.8); border-color: #3498db; }
        #btn-interact { background: rgba(46, 204, 113, 0.8); border-color: #2ecc71; display: none; }

        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 90%; max-width: 380px; background: rgba(18, 18, 26, 0.96);
            border: 2px solid #3498db; border-radius: 12px; padding: 15px; z-index: 100;
            display: none; flex-direction: column; gap: 10px; box-shadow: 0 0 30px rgba(0,0,0,0.9);
            max-height: 80vh; overflow-y: auto;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; font-size: 15px; border-bottom: 1px solid #444; padding-bottom: 6px; }
        .close-btn { background: #e74c3c; border: none; color: white; padding: 3px 8px; border-radius: 4px; font-weight: bold; }
        .item-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.05); padding: 8px; border-radius: 6px; font-size: 12px; }
        .craft-btn { background: #2ecc71; border: none; color: white; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
    </style>

    <!-- Firebase SDK (Modular v10) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, remove, push, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 🔥 BURAYA KENDİ FIREBASE BILGILERINI YAZACAKSIN 🔥
        const firebaseConfig = {
            databaseURL: "BURAYA_FIREBASE_URL_YAZACAKSIN" 
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global olarak oyun içine aktarıyoruz
        window.FB = { db, ref, set, onValue, remove, push, update };
    </script>
</head>
<body>

    <div id="login-screen" class="screen active">
        <h1 style="font-size: 28px; margin-bottom: 20px; text-shadow: 0 0 10px #3498db;">⚔️ SURVIVAL PVP</h1>
        <input type="text" id="username-input" class="input-box" placeholder="Kullanıcı Adı" maxlength="15">
        <button class="btn" onclick="handleLogin()">Giriş Yap</button>
    </div>

    <div id="menu-screen" class="screen">
        <h2 id="welcome-text" style="margin-bottom: 20px; color: #2ecc71;">Hoş Geldin</h2>
        <button class="btn btn-green" onclick="createRoom()">Oda Kur (Lobi)</button>
        <button class="btn btn-blue" onclick="joinRoomPrompt()">Odaya Katıl</button>
        <button class="btn" style="background: #7f8c8d;" onclick="logout()">Çıkış Yap</button>
    </div>

    <div id="game-screen" class="screen">
        <div id="ui">
            <div class="panel">
                ❤️ <span id="hp-val">100</span> | 🍖 <span id="hunger-val">100</span> | Oda: <span id="room-code-display"></span>
            </div>
            <div class="panel">
                🪵<span id="i-wood">5</span> 🪨<span id="i-stone">2</span> 🔩<span id="i-iron">0</span> 💎<span id="i-diamond">0</span>
            </div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div id="joystick-base">
            <div id="joystick-knob"></div>
        </div>
        
        <div class="action-container">
            <div class="btn-round" id="btn-interact">🛠️ Masa</div>
            <div class="btn-round" id="btn-inv">🎒</div>
            <div class="btn-round" id="btn-attack">⚔️</div>
        </div>
    </div>

    <div class="modal" id="craft-modal">
        <div class="modal-header">
            <span id="modal-title">Çalışma Masası</span>
            <button class="close-btn" onclick="closeModals()">X</button>
        </div>
        <div id="craft-list">
            <div class="item-row">
                <span>⚔️ Demir Kılıç (Gerek: 4 Demir, 2 Odun)</span>
                <button class="craft-btn" onclick="craftItem('sword', 2, 4)">Yap</button>
            </div>
        </div>
    </div>

    <div class="modal" id="inv-modal">
        <div class="modal-header">
            <span>Çanta ve Eşyalar</span>
            <button class="close-btn" onclick="closeModals()">X</button>
        </div>
        <div id="inv-list" style="display:flex; flex-direction:column; gap:8px;"></div>
        <div style="margin-top:10px; border-top:1px solid #444; padding-top:8px;">
            <button class="craft-btn" style="width:100%; background:#e67e22;" onclick="placeWorkbench()">Çalışma Masasını Kur (5 Odun, 3 Taş)</button>
        </div>
    </div>

    <script>
        let playerName = "";
        let currentRoomId = "";
        let myPlayerId = "p_" + Math.random().toString(36.substring(2, 9));
        let remotePlayers = {};

        function handleLogin() {
            const input = document.getElementById('username-input').value.trim();
            if (input.length < 2) { alert("En az 2 harfli isim gir!"); return; }
            playerName = input;
            document.getElementById('welcome-text').innerText = "Hoş Geldin, " + playerName;
            switchScreen('menu-screen');
        }

        function logout() { switchScreen('login-screen'); }

        function createRoom() {
            currentRoomId = "oda_" + Math.floor(Math.random() * 9000 + 1000);
            alert("Oda Kuruldu! Kodun: " + currentRoomId);
            startGame();
        }

        function joinRoomPrompt() {
            let code = prompt("Oda Kodunu Gir:");
            if (code) {
                currentRoomId = code.trim();
                startGame();
            }
        }

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeGame() {
            canvas.width = 600;
            canvas.height = 600;
            let scale = Math.min(window.innerWidth / 600, (window.innerHeight - 60) / 600) * 0.95;
            canvas.style.width = (600 * scale) + 'px';
            canvas.style.height = (600 * scale) + 'px';
        }

        let player = {
            x: 300, y: 300, radius: 15, speed: 3.2,
            hp: 100, hunger: 100, angle: 0,
            inventory: { wood: 8, stone: 5, iron: 2, diamond: 0, cookedFood: 1 }
        };

        let resources = [
            { x: 100, y: 100, type: 'wood', emoji: '🪵', radius: 18 },
            { x: 500, y: 120, type: 'stone', emoji: '🪨', radius: 16 },
            { x: 120, y: 480, type: 'iron', emoji: '🔩', radius: 15 },
            { x: 480, y: 450, type: 'diamond', emoji: '💎', radius: 12 }
        ];

        let worldObjects = [];
        let projectiles = [];

        function startGame() {
            if (!currentRoomId) currentRoomId = "genel_oda";
            document.getElementById('room-code-display').innerText = currentRoomId;
            switchScreen('game-screen');
            resizeGame();
            updateUI();
            initFirebaseMultiplayer();
        }

        // Firebase Çok Oyunculu Senkronizasyon Dinleyicileri
        function initFirebaseMultiplayer() {
            const { db, ref, onValue, set, remove } = window.FB;
            
            // Diğer oyuncuları dinle
            const roomPlayersRef = ref(db, 'rooms/' + currentRoomId + '/players');
            onValue(roomPlayersRef, (snapshot) => {
                const data = snapshot.val();
                remotePlayers = data || {};
            });

            // Oyundan çıkınca veritabanından sil
            window.addEventListener('beforeunload', () => {
                remove(ref(db, 'rooms/' + currentRoomId + '/players/' + myPlayerId));
            });
        }

        // Joystick
        const jBase = document.getElementById('joystick-base');
        const jKnob = document.getElementById('joystick-knob');
        let joyActive = false;
        let joyVector = { x: 0, y: 0 };
        let activeTouchId = null;

        jBase.addEventListener('pointerdown', (e) => {
            joyActive = true; activeTouchId = e.pointerId;
            jBase.setPointerCapture(activeTouchId);
            handleJoyMove(e);
        });
        jBase.addEventListener('pointermove', (e) => {
            if (joyActive && e.pointerId === activeTouchId) handleJoyMove(e);
        });
        function resetJoystick() {
            joyActive = false; activeTouchId = null;
            joyVector = { x: 0, y: 0 };
            jKnob.style.transform = `translate(0px, 0px)`;
        }
        jBase.addEventListener('pointerup', resetJoystick);
        jBase.addEventListener('pointercancel', resetJoystick);

        function handleJoyMove(e) {
            const rect = jBase.getBoundingClientRect();
            let cx = rect.left + rect.width / 2;
            let cy = rect.top + rect.height / 2;
            let dx = e.clientX - cx;
            let dy = e.clientY - cy;
            let dist = Math.hypot(dx, dy);
            let maxDist = 40;
            if (dist > maxDist) { dx = (dx / dist) * maxDist; dy = (dy / dist) * maxDist; }
            jKnob.style.transform = `translate(${dx}px, ${dy}px)`;
            joyVector = dist < 5 ? { x: 0, y: 0 } : { x: dx / maxDist, y: dy / maxDist };
        }

        document.getElementById('btn-attack').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            projectiles.push({
                x: player.x, y: player.y,
                vx: Math.cos(player.angle) * 8, vy: Math.sin(player.angle) * 8,
                radius: 5, color: '#f1c40f'
            });
        });

        document.getElementById('btn-inv').addEventListener('click', () => {
            let invList = document.getElementById('inv-list');
            invList.innerHTML = `
                <div class="item-row"><span>🪵 Odun: ${player.inventory.wood}</span></div>
                <div class="item-row"><span>🪨 Taş: ${player.inventory.stone}</span></div>
                <div class="item-row"><span>🔩 Demir: ${player.inventory.iron}</span></div>
                <div class="item-row"><span>💎 Elmas: ${player.inventory.diamond}</span></div>
            `;
            document.getElementById('inv-modal').style.display = 'flex';
        });

        function placeWorkbench() {
            if (player.inventory.wood >= 5 && player.inventory.stone >= 3) {
                player.inventory.wood -= 5; player.inventory.stone -= 3;
                worldObjects.push({ x: player.x + 30, y: player.y, type: 'workbench' });
                updateUI(); closeModals();
                alert('Çalışma Masası kuruldu!');
            } else { alert('Yetersiz malzeme!'); }
        }

        let activeWorkbench = null;
        function checkWorkbenchProximity() {
            let interactBtn = document.getElementById('btn-interact');
            activeWorkbench = null;
            worldObjects.forEach(obj => {
                if (Math.hypot(player.x - obj.x, player.y - obj.y) < 45) activeWorkbench = obj;
            });
            interactBtn.style.display = activeWorkbench ? 'flex' : 'none';
        }

        document.getElementById('btn-interact').addEventListener('click', () => {
            if (activeWorkbench) document.getElementById('craft-modal').style.display = 'flex';
        });

        function closeModals() {
            document.getElementById('craft-modal').style.display = 'none';
            document.getElementById('inv-modal').style.display = 'none';
        }

        function craftItem(type, reqWood, reqIron) {
            if (player.inventory.wood >= reqWood && player.inventory.iron >= reqIron) {
                player.inventory.wood -= reqWood; player.inventory.iron -= reqIron;
                updateUI(); closeModals(); alert('Üretildi!');
            } else { alert('Yetersiz malzeme!'); }
        }

        function updateUI() {
            document.getElementById('hp-val').innerText = player.hp;
            document.getElementById('hunger-val').innerText = player.hunger;
            document.getElementById('i-wood').innerText = player.inventory.wood;
            document.getElementById('i-stone').innerText = player.inventory.stone;
            document.getElementById('i-iron').innerText = player.inventory.iron;
            document.getElementById('i-diamond').innerText = player.inventory.diamond;
        }

        let firebaseSyncTimer = 0;
        function update() {
            if (joyVector.x !== 0 || joyVector.y !== 0) {
                player.x += joyVector.x * player.speed;
                player.y += joyVector.y * player.speed;
                player.angle = Math.atan2(joyVector.y, joyVector.x);
            }
            player.x = Math.max(player.radius, Math.min(canvas.width - player.radius, player.x));
            player.y = Math.max(player.radius, Math.min(canvas.height - player.radius, player.y));

            // Firebase'e konum gönderme (Her 50ms'de bir günceller)
            firebaseSyncTimer++;
            if (firebaseSyncTimer > 3 && window.FB) {
                firebaseSyncTimer = 0;
                window.FB.set(window.FB.ref(window.FB.db, 'rooms/' + currentRoomId + '/players/' + myPlayerId), {
                    name: playerName,
                    x: player.x,
                    y: player.y,
                    angle: player.angle
                });
            }

            resources.forEach(res => {
                if (Math.hypot(player.x - res.x, player.y - res.y) < player.radius + res.radius) {
                    if (res.type === 'wood') player.inventory.wood++;
                    if (res.type === 'stone') player.inventory.stone++;
                    if (res.type === 'iron') player.inventory.iron++;
                    if (res.type === 'diamond') player.inventory.diamond++;
                    res.x = Math.random() * 520 + 40; res.y = Math.random() * 520 + 40;
                    updateUI();
                }
            });

            checkWorkbenchProximity();

            for (let i = projectiles.length - 1; i >= 0; i--) {
                let p = projectiles[i];
                p.x += p.vx; p.y += p.vy;
                if (p.x < 0 || p.x > canvas.width || p.y < 0 || p.y > canvas.height) projectiles.splice(i, 1);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = 'rgba(255,255,255,0.03)';
            for (let x = 0; x < canvas.width; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke(); }
            for (let y = 0; y < canvas.height; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(canvas.width, y); ctx.stroke(); }

            // Diğer Oyuncuları Çiz
            for (let id in remotePlayers) {
                if (id === myPlayerId) continue;
                let p = remotePlayers[id];
                ctx.save();
                ctx.translate(p.x, p.y); ctx.rotate(p.angle);
                ctx.fillStyle = '#e74c3c'; // Diğer oyuncular kırmızı tonunda
                ctx.beginPath(); ctx.arc(0, 0, 15, 0, Math.PI * 2); ctx.fill();
                ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
                ctx.restore();

                // İsim Yazısı
                ctx.fillStyle = "#fff"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
                ctx.fillText(p.name, p.x, p.y - 22);
            }

            worldObjects.forEach(obj => {
                ctx.font = "24px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText("🪵🛠️", obj.x, obj.y);
            });

            resources.forEach(res => {
                ctx.font = "20px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
                ctx.fillText(res.emoji, res.x, res.y);
            });

            projectiles.forEach(p => {
                ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
            });

            // Kendi Oyuncumuz
            ctx.save();
            ctx.translate(player.x, player.y); ctx.rotate(player.angle);
            ctx.fillStyle = '#3498db'; ctx.beginPath(); ctx.arc(0, 0, player.radius, 0, Math.PI * 2); ctx.fill();
            ctx.lineWidth = 3; ctx.strokeStyle = '#fff'; ctx.stroke();
            ctx.fillStyle = '#e74c3c'; ctx.fillRect(0, -4, player.radius + 10, 8);
            ctx.restore();

            // Kendi İsminiz
            ctx.fillStyle = "#2ecc71"; ctx.font = "10px sans-serif"; ctx.textAlign = "center";
            ctx.fillText(playerName + " (Sen)", player.x, player.y - 22);
        }

        function loop() {
            if (document.getElementById('game-screen').classList.contains('active')) {
                update();
                draw();
            }
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>
</html>
