<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MCPE Karakter & Eşya Toplama</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #1a1a1a; 
            font-family: sans-serif;
            touch-action: none;
        }
        #score-board {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6);
            border: 2px solid #555;
            color: white;
            padding: 8px 18px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            z-index: 5;
            text-shadow: 0 2px 4px rgba(0,0,0,0.9);
            pointer-events: none;
        }

        /* --- MOBİL KONTROL BUTONLARI --- */
        #controls {
            position: absolute;
            bottom: 25px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10;
            pointer-events: none;
        }
        .control-group {
            display: flex;
            gap: 12px;
            pointer-events: auto;
        }
        .ctrl-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid white;
            color: white;
            font-size: 22px;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(4px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
        }
        .ctrl-btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.92);
        }
    </style>
</head>
<body>
    <div id="score-board">Toplanan Eşya: <span id="score">0</span> / 5</div>
    
    <!-- Kontrol Butonları -->
    <div id="controls">
        <div class="control-group">
            <div class="ctrl-btn" id="turn-left">◀</div>
            <div class="ctrl-btn" id="turn-right">►</div>
        </div>
        <div class="control-group">
            <div class="ctrl-btn" id="move-back">⬇</div>
            <div class="ctrl-btn" id="move-forward">⬆</div>
        </div>
    </div>

    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        // 1. Sahne ve Kamera
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        // 2. Evi İnşa Etme
        const woodMat = new THREE.MeshStandardMaterial({ color: 0x8B5A2B });
        const stoneMat = new THREE.MeshStandardMaterial({ color: 0x7F7F7F });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0xadd8e6, transparent: true, opacity: 0.6 });
        const roofMat = new THREE.MeshStandardMaterial({ color: 0x5c4033 });

        function buildHouse() {
            const blockSize = 1;
            // Zemin
            for (let x = -4; x <= 4; x++) {
                for (let z = -4; z <= 4; z++) {
                    const stone = new THREE.Mesh(new THREE.BoxGeometry(blockSize, blockSize, blockSize), stoneMat);
                    stone.position.set(x, -0.5, z);
                    scene.add(stone);
                }
            }
            // Duvarlar
            for (let x = -2; x <= 2; x++) {
                for (let z = -2; z <= 2; z++) {
                    if (Math.abs(x) === 2 || Math.abs(z) === 2) {
                        if (z === 2 && x === 0) continue; // Kapı
                        for (let y = 0.5; y <= 1.5; y++) {
                            let mat = woodMat;
                            if (y === 1.5 && (x === -2 || x === 2)) mat = glassMat;
                            const wall = new THREE.Mesh(new THREE.BoxGeometry(blockSize, blockSize, blockSize), mat);
                            wall.position.set(x, y, z);
                            scene.add(wall);
                        }
                    }
                }
            }
            // Çatı
            for (let x = -2; x <= 2; x++) {
                for (let z = -2; z <= 2; z++) {
                    const roof = new THREE.Mesh(new THREE.BoxGeometry(blockSize, 0.4, blockSize), roofMat);
                    roof.position.set(x, 2.2, z);
                    scene.add(roof);
                }
            }
        }
        buildHouse();

        // 3. Karakter Oluşturma (Oyuncu)
        const playerGeo = new THREE.BoxGeometry(0.6, 1.2, 0.4);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xe74c3c }); // Kırmızı gövdeli karakter
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 0.6, 5); // Evin önünde başlar
        scene.add(player);

        // 4. Eşya Spawner Sistemi (deneme.png)
        const textureLoader = new THREE.TextureLoader();
        let spawnedItems = [];
        let score = 0;
        let itemMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, side: THREE.DoubleSide });

        textureLoader.load('deneme.png', (texture) => {
            itemMaterial = new THREE.MeshBasicMaterial({ 
                map: texture, 
                transparent: true, 
                side: THREE.DoubleSide 
            });
            createSpawnedItems();
        }, undefined, () => {
            createSpawnedItems(); // Resim yüklenemezse beyaz karelerle başlat
        });

        const itemPositions = [
            { x: -3, z: -3 },
            { x: 3, z: -3 },
            { x: -3, z: 3 },
            { x: 4, z: 1 },
            { x: 0, z: -4 }
        ];

        function createSpawnedItems() {
            itemPositions.forEach(pos => {
                const itemGeo = new THREE.PlaneGeometry(0.8, 0.8);
                const itemMesh = new THREE.Mesh(itemGeo, itemMaterial);
                itemMesh.position.set(pos.x, 0.4, pos.z);
                scene.add(itemMesh);
                spawnedItems.push(itemMesh);
            });
        }

        // 5. Kontrol ve Hareket Mantığı
        let moveForward = false;
        let moveBack = false;
        let turnLeft = false;
        let turnRight = false;

        const moveSpeed = 0.06;
        const rotSpeed = 0.04;

        // Buton Dinleyicileri (Dokunma ve Fare)
        function bindButton(id, onDown, onUp) {
            const el = document.getElementById(id);
            el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); });
            el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); });
            el.addEventListener('mousedown', onDown);
            el.addEventListener('mouseup', onUp);
        }

        bindButton('move-forward', () => moveForward = true, () => moveForward = false);
        bindButton('move-back', () => moveBack = true, () => moveBack = false);
        bindButton('turn-left', () => turnLeft = true, () => turnLeft = false);
        bindButton('turn-right', () => turnRight = true, () => turnRight = false);

        // Klavye Desteği (W, A, S, D veya Ok Tuşları)
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') moveForward = true;
            if (e.key === 'ArrowDown' || e.key === 's') moveBack = true;
            if (e.key === 'ArrowLeft' || e.key === 'a') turnLeft = true;
            if (e.key === 'ArrowRight' || e.key === 'd') turnRight = true;
        });
        window.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') moveForward = false; // Keyup için ayrı
        }); // Basitçe bırakma mantığı için keyup event:
        window.addEventListener('keyup', (e) => {
            if (e.key === 'ArrowUp' || e.key === 'w') moveForward = false;
            if (e.key === 'ArrowDown' || e.key === 's') moveBack = false;
            if (e.key === 'ArrowLeft' || e.key === 'a') turnLeft = false;
            if (e.key === 'ArrowRight' || e.key === 'd') turnRight = false;
        });

        // 6. Animasyon ve Oyun Döngüsü
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // Karakter Dönüşü
            if (turnLeft) player.rotation.y += rotSpeed;
            if (turnRight) player.rotation.y -= rotSpeed;

            // Karakter İleri/Geri Hareketi
            let direction = new THREE.Vector3(0, 0, 1).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            if (moveForward) player.position.addScaledVector(direction, moveSpeed);
            if (moveBack) player.position.addScaledVector(direction, -moveSpeed);

            // Kamera Takibi (Üçüncü Şahıs Görünüm - Arkadan Takip)
            const camOffset = new THREE.Vector3(0, 2.5, 4.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rotation.y);
            camera.position.copy(player.position).add(camOffset);
            camera.lookAt(player.position.clone().add(new THREE.Vector3(0, 0.5, 0)));

            // Eşya Süzülmesi ve Toplanma Kontrolü
            spawnedItems.forEach((item, index) => {
                // MCPE Billboarding (kameraya bakma) ve süzülme
                item.quaternion.copy(camera.quaternion);
                item.position.y = 0.4 + Math.sin(elapsedTime * 3 + index) * 0.1;

                // Oyuncu ile eşya arasındaki mesafe kontrolü (Toplama)
                const distance = player.position.distanceTo(item.position);
                if (distance < 1.0) {
                    scene.remove(item); // Sahneden kaldır
                    spawnedItems.splice(index, 1); // Listeden çıkar
                    score++;
                    document.getElementById('score').innerText = score;
                }
            });

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
