<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MCPE Tarzı Item Testi</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #1a1a1a; 
            font-family: sans-serif;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
            pointer-events: none;
            padding: 0 10px;
            box-sizing: border-box;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        #controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid white;
            color: white;
            padding: 14px 22px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="info">MCPE Tarzı Item: Kameraya bakan ve havada süzülen 2D eşya efekti.</div>
    
    <div id="controls">
        <button class="btn" id="leftBtn">◄ Sola Dön</button>
        <button class="btn" id="rightBtn">Sağa Dön ►</button>
    </div>

    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.6);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        // Referans için zemine ufak bir blok koyalım ki item'ın havada süzüldüğü anlaşılsın
        const blockGeo = new THREE.BoxGeometry(0.8, 0.8, 0.8);
        const blockMat = new THREE.MeshStandardMaterial({ color: 0x555555 });
        const groundBlock = new THREE.Mesh(blockGeo, blockMat);
        groundBlock.position.set(0, -0.8, 0);
        scene.add(groundBlock);

        let mcpeItem;
        let clock = new THREE.Clock();
        let cameraAngle = 0; // Kamerayı döndürmek için açı

        // Doku yükleme ve MCPE Item (Plane) oluşturma
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load('deneme.png', (texture) => {
            const image = texture.image;
            const aspect = image.width / image.height;
            
            const height = 1.0; 
            const width = height * aspect; // Oranı bozmadan boyutlandırma

            const itemGeo = new THREE.PlaneGeometry(width, height);
            const itemMat = new THREE.MeshBasicMaterial({ 
                map: texture, 
                transparent: true, // Şeffaf arka plan
                side: THREE.DoubleSide    // Arkadan da görünmesini sağlar
            });
            
            mcpeItem = new THREE.Mesh(itemGeo, itemMat);
            mcpeItem.position.set(0, 0.3, 0); // Bloğun hemen üstü
            scene.add(mcpeItem);
        });

        camera.position.set(0, 1, 3);

        // Butonlarla kamerayı etrafında döndürüp item'ın her an oyuncuya baktığını test edelim
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); cameraAngle -= 0.5; });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); cameraAngle += 0.5; });
        document.getElementById('leftBtn').addEventListener('click', () => { cameraAngle -= 0.5; });
        document.getElementById('rightBtn').addEventListener('click', () => { cameraAngle += 0.5; });

        // Animasyon Döngüsü
        function animate() {
            requestAnimationFrame(animate);

            const elapsedTime = clock.getElapsedTime();

            // Kamerayı yavaşça hareket ettirelim
            camera.position.x = Math.sin(cameraAngle) * 3;
            camera.position.z = Math.cos(cameraAngle) * 3;
            camera.lookAt(0, 0, 0);

            if (mcpeItem) {
                // 1. MCPE Kuralı: Item HER ZAMAN kameraya baksın (Billboarding)
                mcpeItem.quaternion.copy(camera.quaternion);

                // 2. MCPE Kuralı: Havada yukarı aşağı hafifçe süzülme (Bobbing efekti)
                mcpeItem.position.y = 0.3 + Math.sin(elapsedTime * 3) * 0.1;
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
