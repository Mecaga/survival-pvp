<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Minecraft 3D Kostüm Stüdyosu</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { margin: 0; padding: 0; background-color: #0b0f19; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; overflow: hidden; }
        .shelf-scroll::-webkit-scrollbar { width: 6px; }
        .shelf-scroll::-webkit-scrollbar-track { background: #1e293b; }
        .shelf-scroll::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
        canvas { touch-action: none; }
        .shelf-transition { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .grid-overlay {
            background-size: 16px 16px;
            background-image: 
                linear-gradient(to right, rgba(0, 255, 255, 0.15) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 255, 255, 0.15) 1px, transparent 1px);
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col select-none">

    <!-- ÜST BAR / HEADER -->
    <header class="h-14 bg-slate-900 border-b border-slate-800 flex items-center justify-between px-4 sm:px-6 z-20 shrink-0">
        <div class="flex items-center gap-3">
            <span class="text-2xl">👕</span>
            <h1 class="font-bold text-sm sm:text-base text-slate-100 tracking-wide">MC SKIN STUDIO</h1>
        </div>
        <div class="flex items-center gap-2">
            <button id="btn-save-snapshot" class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-xs font-bold rounded-xl text-white transition active:scale-95 shadow-md">
                📸 3D Poz İndir
            </button>
            <button id="btn-download-texture" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-xs font-bold rounded-xl text-white transition active:scale-95 shadow-md">
                💾 Doku İndir (PNG)
            </button>
            <label class="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 text-xs font-bold rounded-xl border border-slate-700 text-slate-200 cursor-pointer transition active:scale-95">
                📂 Skin Yükle
                <input type="file" id="input-upload-skin" accept="image/png" class="hidden">
            </label>
        </div>
    </header>

    <!-- BÖLÜNMÜŞ ANA EKRAN -->
    <main class="flex-1 flex overflow-hidden relative">

        <!-- SOL TARAF: KOSTÜM RAFI -->
        <section id="shelf-panel" class="w-80 sm:w-96 bg-slate-900/95 border-r border-slate-800 flex flex-col p-4 shrink-0 z-30 shelf-transition absolute left-0 top-0 bottom-0 md:relative">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-800">
                <div class="flex items-center gap-2">
                    <span class="text-slate-400 text-xs">📦</span>
                    <h2 class="font-bold text-slate-300 text-xs tracking-wider uppercase">Kostüm Rafı</h2>
                </div>
                <div class="flex items-center gap-2">
                    <button id="btn-add-costume" class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-xl flex items-center gap-1 shadow-md transition active:scale-95">
                        <span>+</span> Ekle
                    </button>
                    <button id="btn-close-shelf" class="px-2.5 py-1.5 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold text-xs rounded-xl border border-slate-700 transition active:scale-95" title="Rafı Kapat">
                        ◀ Kapat
                    </button>
                </div>
            </div>

            <!-- KOSTÜM LİSTESİ -->
            <div id="costume-list" class="flex-1 overflow-y-auto shelf-scroll space-y-3 pr-1">
                <!-- Dinamik Kartlar -->
            </div>
        </section>

        <!-- PENCERE AÇMA BUTONU -->
        <button id="btn-open-shelf" class="hidden fixed left-3 top-16 z-20 px-3 py-2 bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold rounded-xl shadow-xl transition active:scale-95 border border-blue-400">
            ▶ Kostüm Rafını Aç
        </button>

        <!-- SAĞ TARAF: ÇALIŞMA ALANI & DÜZENLEME -->
        <section class="flex-1 flex flex-col relative bg-slate-950 overflow-hidden w-full h-full">

            <!-- ÜST MOD SEÇİMİ (3D GÖRÜNÜM / 2D ŞABLON) -->
            <div class="absolute top-4 right-4 z-20 flex gap-2">
                <button id="btn-mode-3d" class="px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-lg border border-blue-400 transition active:scale-95">
                    🧊 3D Görünüm
                </button>
                <button id="btn-mode-2d" class="px-4 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-lg border border-slate-700 transition active:scale-95">
                    ✏️ 2D Şablon
                </button>
            </div>

            <!-- ALT DÜZENLEME / ANA EYLEM BARI -->
            <div class="absolute bottom-6 left-1/2 -translate-x-1/2 z-20 bg-slate-900/90 border border-slate-700 px-5 py-2.5 rounded-2xl shadow-2xl flex items-center gap-3 backdrop-blur-md">
                
                <!-- VARSAYILAN KONTROL BUTONLARI -->
                <div id="default-actions" class="flex items-center gap-3">
                    <button id="btn-use" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow transition active:scale-95">
                        ✓ Kullan
                    </button>
                    <button id="btn-start-edit" class="px-4 py-2 bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold rounded-xl shadow transition active:scale-95">
                        ✏️ Düzenle
                    </button>
                    <button id="btn-delete" class="px-3 py-2 bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold rounded-xl shadow transition active:scale-95">
                        🗑️ Sil
                    </button>
                </div>

                <!-- DÜZENLEME MODU ARAÇLARI -->
                <div id="edit-tools" class="hidden flex items-center gap-3">
                    <input type="color" id="color-picker" value="#3b82f6" class="w-7 h-7 rounded-lg border-0 cursor-pointer bg-transparent">
                    
                    <button id="tool-eyedropper" class="px-2.5 py-1.5 bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-bold rounded-lg border border-slate-700 transition" title="Renk Alma (Eyedropper)">
                        🧪 Damlalık
                    </button>
                    
                    <button id="tool-pencil" class="px-2.5 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg shadow">
                        ✏️ Kalem
                    </button>
                    
                    <button id="tool-eraser" class="px-2.5 py-1.5 bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-bold rounded-lg transition">
                        🧹 Silgi
                    </button>

                    <!-- FIRÇA BOYUTU -->
                    <select id="brush-size" class="bg-slate-800 border border-slate-700 text-xs font-bold text-slate-200 rounded-lg px-2 py-1 outline-none">
                        <option value="1">1px</option>
                        <option value="2">2px</option>
                        <option value="3">3px</option>
                    </select>

                    <button id="btn-save-edit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold rounded-xl shadow ml-2 transition active:scale-95">
                        💾 Kaydet
                    </button>
                </div>

            </div>

            <!-- VIEWPORT CONTAINERS -->
            <div class="flex-1 flex w-full h-full relative">
                
                <!-- 2D DOKU ŞABLONU -->
                <div id="panel-2d" class="w-full h-full hidden flex-col items-center justify-center p-4 bg-slate-900/90 z-10 backdrop-blur-md">
                    <div class="text-xs text-slate-400 mb-2 font-semibold">2D Kostüm Şablonu (64x64 Pixel)</div>
                    <div class="relative border-2 border-cyan-500/50 rounded-xl overflow-hidden bg-black/80 shadow-2xl grid-overlay">
                        <canvas id="canvas-2d" width="512" height="512" class="cursor-crosshair"></canvas>
                    </div>
                </div>

                <!-- 3D KARAKTER VIEWPORT -->
                <div id="container-3d" class="flex-1 h-full w-full relative">
                    <div class="absolute bottom-3 left-4 text-[11px] text-slate-400 bg-black/40 px-3 py-1 rounded-lg pointer-events-none backdrop-blur-sm z-10">
                        Sol tık: Döndür | Sağ tık: Kaydır | Tekerlek: Yakınlaş
                    </div>
                </div>
            </div>

        </section>

    </main>

    <script>
        // --- SİSTEM DEĞİŞKENLERİ ---
        let scene, camera, renderer, controls, characterGroup;
        let activeCostumeId = 1;
        let currentTool = 'pencil';
        let isEditing = false;
        let miniScenes = [];

        // 64x64 Doku Tuvali
        const offCanvas = document.createElement('canvas');
        offCanvas.width = 64; offCanvas.height = 64;
        const offCtx = offCanvas.getContext('2d');

        const displayCanvas = document.getElementById('canvas-2d');
        const displayCtx = displayCanvas.getContext('2d');

        let costumeTexture;

        // Varsayılan Kostümler
        let costumes = [
            { id: 1, name: "Görseldeki Özel Skin", color: "#3b82f6" },
            { id: 2, name: "Savaşçı Kostümü", color: "#ef4444" },
            { id: 3, name: "Zümrüt Muhafız", color: "#10b981" }
        ];

        // GÖRSELDEN BİREBİR ALINAN RESİM ATAMA İŞLEMİ (IMAGE LOAD)
        function loadSkinFromImageSrc(srcUrl) {
            const img = new Image();
            img.crossOrigin = "Anonymous";
            img.onload = () => {
                offCtx.clearRect(0, 0, 64, 64);
                offCtx.drawImage(img, 0, 0, 64, 64);
                updateDisplayCanvas();
                update3DTexture();
            };
            // Eğer harici resim yüklenmediyse doğrudan orijinal tuvali üret
            img.onerror = () => {
                drawDefaultSkinData();
            };
            img.src = srcUrl;
        }

        // Birebir Minecraft Dokusunun Çizilmesi
        function drawDefaultSkinData() {
            offCtx.clearRect(0, 0, 64, 64);

            // Kafa (Head) [0,0 - 32,16]
            offCtx.fillStyle = '#ffdbac'; offCtx.fillRect(8, 8, 8, 8); // Yüz
            offCtx.fillStyle = '#1e293b'; offCtx.fillRect(10, 11, 1, 1); offCtx.fillRect(13, 11, 1, 1); // Gözler
            offCtx.fillStyle = '#4a2810'; offCtx.fillRect(0, 0, 32, 8); // Saç Üst/Arka
            offCtx.fillStyle = '#4a2810'; offCtx.fillRect(0, 8, 8, 8);  // Saç Sağ
            offCtx.fillStyle = '#4a2810'; offCtx.fillRect(16, 8, 16, 8); // Saç Sol/Arka

            // Gövde (Torso) [16,16 - 40,32] - Türk Bayrağı Detayı
            offCtx.fillStyle = '#2563eb'; offCtx.fillRect(16, 16, 24, 16);
            offCtx.fillStyle = '#06b6d4'; offCtx.fillRect(16, 16, 8, 16); // Sol Mavi Taraf
            offCtx.fillStyle = '#111827'; offCtx.fillRect(24, 16, 8, 16); // Siyah Taraf
            offCtx.fillStyle = '#eab308'; offCtx.fillRect(20, 18, 4, 3);
            offCtx.fillStyle = '#ef4444'; offCtx.fillRect(20, 22, 4, 4);

            // Türk Bayrağı Detayı (Gövde Ön Yüz)
            offCtx.fillStyle = '#dc2626'; offCtx.fillRect(20, 32, 8, 10);
            offCtx.fillStyle = '#ffffff'; offCtx.fillText('C*', 21, 40);

            // Bacaklar (Right Leg) [0,16 - 16,32]
            offCtx.fillStyle = '#312e81'; offCtx.fillRect(0, 16, 16, 16);
            offCtx.fillStyle = '#22c55e'; offCtx.fillRect(0, 24, 8, 8);

            // Kollar (Right Arm) [40,16 - 56,32]
            offCtx.fillStyle = '#111827'; offCtx.fillRect(40, 16, 16, 8);
            offCtx.fillStyle = '#ffdbac'; offCtx.fillRect(40, 24, 16, 8);
            offCtx.fillStyle = '#eab308'; offCtx.fillRect(44, 26, 4, 4);

            updateDisplayCanvas();
            update3DTexture();
        }

        // --- MINECRAFT DOKU UV MAP KOORDİNATLARI ---
        function setBoxUVs(geometry, u, v, w, h, d, textureWidth = 64, textureHeight = 64) {
            const uvAttribute = geometry.attributes.uv;

            const x0 = u / textureWidth;
            const x1 = (u + d) / textureWidth;
            const x2 = (u + d + w) / textureWidth;
            const x3 = (u + 2 * d + w) / textureWidth;
            const x4 = (u + 2 * d + 2 * w) / textureWidth;

            const y0 = 1 - (v + h + d) / textureHeight;
            const y1 = 1 - (v + d) / textureHeight;
            const y2 = 1 - v / textureHeight;

            // BoxGeometry Yüzey Sırası: Right, Left, Top, Bottom, Front, Back
            const uvs = [
                x1, y1,  x0, y1,  x1, y2,  x0, y2, // Right
                x3, y1,  x2, y1,  x3, y2,  x2, y2, // Left
                x2, y1,  x1, y1,  x2, y0,  x1, y0, // Top
                x3, y0,  x2, y0,  x3, y1,  x2, y1, // Bottom
                x2, y1,  x1, y1,  x2, y2,  x1, y2, // Front
                x4, y1,  x3, y1,  x4, y2,  x3, y2  // Back
            ];

            for (let i = 0; i < uvs.length; i++) {
                uvAttribute.setX(i, uvs[i]);
            }
            uvAttribute.needsUpdate = true;
        }

        function updateDisplayCanvas() {
            displayCtx.imageSmoothingEnabled = false;
            displayCtx.drawImage(offCanvas, 0, 0, 512, 512);

            displayCtx.strokeStyle = 'rgba(0, 255, 255, 0.15)';
            displayCtx.lineWidth = 1;
            for (let i = 0; i <= 512; i += 8) {
                displayCtx.beginPath(); displayCtx.moveTo(i, 0); displayCtx.lineTo(i, 512); displayCtx.stroke();
                displayCtx.beginPath(); displayCtx.moveTo(0, i); displayCtx.lineTo(512, i); displayCtx.stroke();
            }
        }

        function update3DTexture() {
            if (costumeTexture) {
                costumeTexture.needsUpdate = true;
            }
        }

        // --- THREE.JS 3D KARAKTER STÜDYOSU ---
        function init3D() {
            const container = document.getElementById('container-3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0f19);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 1.2, 4.5);

            renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(3, 5, 4);
            scene.add(dirLight);

            // Doku & Materyal
            costumeTexture = new THREE.CanvasTexture(offCanvas);
            costumeTexture.magFilter = THREE.NearestFilter;
            costumeTexture.minFilter = THREE.NearestFilter;

            const textureMaterial = new THREE.MeshStandardMaterial({
                map: costumeTexture,
                roughness: 0.8,
                metalness: 0.1
            });

            characterGroup = new THREE.Group();

            function createPartWithUV(w, h, d, x, y, z, u, v) {
                const geo = new THREE.BoxGeometry(w, h, d);
                setBoxUVs(geo, u, v, w * 10, h * 10, d * 10);

                const mesh = new THREE.Mesh(geo, textureMaterial);
                mesh.position.set(x, y, z);
                
                // Turkuaz Çizgiler (EdgesGeometry)
                const edges = new THREE.EdgesGeometry(geo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 2 }));
                mesh.add(line);
                return mesh;
            }

            // Minecraft Uzuvları (UV Koordinatları ile Birebir Doğru Kaplama)
            characterGroup.add(createPartWithUV(0.8, 0.8, 0.8, 0, 0.8, 0, 0, 0));       // Kafa
            characterGroup.add(createPartWithUV(0.8, 1.2, 0.4, 0, -0.2, 0, 16, 16));    // Gövde
            characterGroup.add(createPartWithUV(0.4, 1.2, 0.4, -0.6, -0.2, 0, 40, 16)); // Sol Kol
            characterGroup.add(createPartWithUV(0.4, 1.2, 0.4, 0.6, -0.2, 0, 40, 16));  // Sağ Kol
            characterGroup.add(createPartWithUV(0.4, 1.2, 0.4, -0.2, -1.4, 0, 0, 16));  // Sol Bacak
            characterGroup.add(createPartWithUV(0.4, 1.2, 0.4, 0.2, -1.4, 0, 0, 16));   // Sağ Bacak

            scene.add(characterGroup);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            if (controls) controls.update();
            if (renderer && scene && camera) renderer.render(scene, camera);

            miniScenes.forEach(m => {
                if (m.group) m.group.rotation.y += 0.02;
                if (m.renderer && m.scene && m.camera) m.renderer.render(m.scene, m.camera);
            });
        }

        // --- SOL RAF MİNİ MODELLERİ ---
        function renderCostumeList() {
            const listEl = document.getElementById('costume-list');
            listEl.innerHTML = '';
            miniScenes = [];

            costumes.forEach(c => {
                const isActive = c.id === activeCostumeId;
                const card = document.createElement('div');
                card.className = `p-3 rounded-2xl border cursor-pointer transition flex items-center justify-between shadow-md ${
                    isActive ? 'bg-blue-600/20 border-blue-500 ring-2 ring-blue-500/50' : 'bg-slate-800/60 border-slate-700/70 hover:bg-slate-800'
                }`;

                const miniCanvasId = `mini-canvas-${c.id}`;

                card.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="w-14 h-14 rounded-xl bg-slate-950 border border-slate-700 overflow-hidden relative shrink-0">
                            <canvas id="${miniCanvasId}" class="w-full h-full"></canvas>
                        </div>
                        <div>
                            <div class="font-bold text-xs text-slate-200">${c.name}</div>
                            <div class="text-[10px] text-slate-400">ID: #${c.id}</div>
                        </div>
                    </div>
                    ${isActive ? '<span class="text-[10px] text-emerald-400 font-bold bg-emerald-950/80 px-2 py-1 rounded-lg border border-emerald-800">Aktif</span>' : ''}
                `;

                card.onclick = () => selectCostume(c.id);
                listEl.appendChild(card);

                setTimeout(() => initMini3D(miniCanvasId, c.color), 10);
            });
        }

        function initMini3D(canvasId, hexColor) {
            const canvas = document.getElementById(canvasId);
            if (!canvas) return;

            const mScene = new THREE.Scene();
            mScene.background = new THREE.Color(0x090d16);

            const mCam = new THREE.PerspectiveCamera(45, 1, 0.1, 100);
            mCam.position.set(0, 0.2, 3.8);

            const mRen = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            mRen.setSize(56, 56);

            const mLight = new THREE.DirectionalLight(0xffffff, 1);
            mLight.position.set(2, 3, 2);
            mScene.add(mLight);
            mScene.add(new THREE.AmbientLight(0xffffff, 0.6));

            const mGroup = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: hexColor, roughness: 0.5 });

            function createMiniPart(w, h, d, x, y, z) {
                const geo = new THREE.BoxGeometry(w, h, d);
                const mesh = new THREE.Mesh(geo, mat);
                mesh.position.set(x, y, z);
                const edges = new THREE.EdgesGeometry(geo);
                const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x00ffff }));
                mesh.add(line);
                return mesh;
            }

            mGroup.add(createMiniPart(0.6, 0.6, 0.6, 0, 0.6, 0));
            mGroup.add(createMiniPart(0.6, 0.9, 0.3, 0, -0.15, 0));
            mGroup.add(createMiniPart(0.3, 0.9, 0.3, -0.45, -0.15, 0));
            mGroup.add(createMiniPart(0.3, 0.9, 0.3, 0.45, -0.15, 0));
            mGroup.add(createMiniPart(0.3, 0.9, 0.3, -0.15, -1.05, 0));
            mGroup.add(createMiniPart(0.3, 0.9, 0.3, 0.15, -1.05, 0));

            mScene.add(mGroup);

            miniScenes.push({ scene: mScene, camera: mCam, renderer: mRen, group: mGroup });
        }

        function selectCostume(id) {
            activeCostumeId = id;
            const costume = costumes.find(c => c.id === id);
            if (costume) {
                drawDefaultSkinData();
            }
            renderCostumeList();
        }

        // --- ETKİLEŞİM VE DÜZENLEME YÖNETİMİ ---
        document.addEventListener('DOMContentLoaded', () => {
            init3D();
            drawDefaultSkinData();
            renderCostumeList();

            const shelfPanel = document.getElementById('shelf-panel');
            const btnCloseShelf = document.getElementById('btn-close-shelf');
            const btnOpenShelf = document.getElementById('btn-open-shelf');

            btnCloseShelf.onclick = () => {
                shelfPanel.classList.add('-translate-x-full');
                setTimeout(() => {
                    shelfPanel.classList.add('hidden');
                    btnOpenShelf.classList.remove('hidden');
                    onWindowResize();
                }, 300);
            };

            btnOpenShelf.onclick = () => {
                shelfPanel.classList.remove('hidden');
                setTimeout(() => {
                    shelfPanel.classList.remove('-translate-x-full');
                    btnOpenShelf.classList.add('hidden');
                    onWindowResize();
                }, 10);
            };

            const btn3D = document.getElementById('btn-mode-3d');
            const btn2D = document.getElementById('btn-mode-2d');
            const panel2D = document.getElementById('panel-2d');

            btn3D.onclick = () => {
                btn3D.className = "px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-lg border border-blue-400 transition active:scale-95";
                btn2D.className = "px-4 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-lg border border-slate-700 transition active:scale-95";
                panel2D.classList.add('hidden');
                onWindowResize();
            };

            btn2D.onclick = () => {
                btn2D.className = "px-4 py-2 bg-blue-600 text-white font-bold text-xs rounded-xl shadow-lg border border-blue-400 transition active:scale-95";
                btn3D.className = "px-4 py-2 bg-slate-800 text-slate-300 hover:bg-slate-700 font-bold text-xs rounded-xl shadow-lg border border-slate-700 transition active:scale-95";
                panel2D.classList.remove('hidden');
                panel2D.classList.add('flex');
                onWindowResize();
            };

            const defaultActions = document.getElementById('default-actions');
            const editTools = document.getElementById('edit-tools');
            const btnStartEdit = document.getElementById('btn-start-edit');
            const btnSaveEdit = document.getElementById('btn-save-edit');

            btnStartEdit.onclick = () => {
                isEditing = true;
                defaultActions.classList.add('hidden');
                editTools.classList.remove('hidden');
                btn2D.click();
            };

            btnSaveEdit.onclick = () => {
                isEditing = false;
                update3DTexture();
                editTools.classList.add('hidden');
                defaultActions.classList.remove('hidden');
                btn3D.click();
                alert('Kostüm değişiklikleri başarıyla kaydedildi!');
            };

            document.getElementById('btn-use').onclick = () => {
                update3DTexture();
                alert('Kostüm başarıyla uygulandı!');
            };

            document.getElementById('btn-delete').onclick = () => {
                if (costumes.length <= 1) {
                    alert('En az bir kostüm kalmalıdır!');
                    return;
                }
                costumes = costumes.filter(c => c.id !== activeCostumeId);
                selectCostume(costumes[0].id);
            };

            document.getElementById('btn-add-costume').onclick = () => {
                const newId = Date.now();
                const colors = ['#f59e0b', '#ec4899', '#06b6d4', '#10b981', '#3b82f6'];
                const randomColor = colors[Math.floor(Math.random() * colors.length)];
                costumes.push({ id: newId, name: `Kostüm ${costumes.length + 1}`, color: randomColor });
                selectCostume(newId);
            };

            let isDrawing = false;
            displayCanvas.onpointerdown = (e) => { isDrawing = true; handleDraw(e); };
            displayCanvas.onpointermove = (e) => { if (isDrawing) handleDraw(e); };
            window.onpointerup = () => isDrawing = false;

            function handleDraw(e) {
                if (!isEditing) return;

                const rect = displayCanvas.getBoundingClientRect();
                const x = Math.floor((e.clientX - rect.left) / (rect.width / 64));
                const y = Math.floor((e.clientY - rect.top) / (rect.height / 64));

                if (x >= 0 && x < 64 && y >= 0 && y < 64) {
                    if (currentTool === 'eyedropper') {
                        const pixelData = offCtx.getImageData(x, y, 1, 1).data;
                        const hex = "#" + ((1 << 24) + (pixelData[0] << 16) + (pixelData[1] << 8) + pixelData[2]).toString(16).slice(1);
                        document.getElementById('color-picker').value = hex;
                        currentTool = 'pencil';
                        updateToolUI();
                        return;
                    }

                    const size = parseInt(document.getElementById('brush-size').value);

                    for (let dx = 0; dx < size; dx++) {
                        for (let dy = 0; dy < size; dy++) {
                            const px = x + dx;
                            const py = y + dy;
                            if (px < 64 && py < 64) {
                                if (currentTool === 'eraser') {
                                    offCtx.clearRect(px, py, 1, 1);
                                } else {
                                    offCtx.fillStyle = document.getElementById('color-picker').value;
                                    offCtx.fillRect(px, py, 1, 1);
                                }
                            }
                        }
                    }

                    updateDisplayCanvas();
                    update3DTexture();
                }
            }

            function updateToolUI() {
                document.getElementById('tool-pencil').className = currentTool === 'pencil' ? "px-2.5 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg shadow" : "px-2.5 py-1.5 bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-bold rounded-lg transition";
                document.getElementById('tool-eraser').className = currentTool === 'eraser' ? "px-2.5 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg shadow" : "px-2.5 py-1.5 bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-bold rounded-lg transition";
                document.getElementById('tool-eyedropper').className = currentTool === 'eyedropper' ? "px-2.5 py-1.5 bg-blue-600 text-white text-xs font-bold rounded-lg shadow" : "px-2.5 py-1.5 bg-slate-800 text-slate-300 hover:bg-slate-700 text-xs font-bold rounded-lg transition";
            }

            document.getElementById('tool-pencil').onclick = () => { currentTool = 'pencil'; updateToolUI(); };
            document.getElementById('tool-eraser').onclick = () => { currentTool = 'eraser'; updateToolUI(); };
            document.getElementById('tool-eyedropper').onclick = () => { currentTool = 'eyedropper'; updateToolUI(); };

            document.getElementById('btn-save-snapshot').onclick = () => {
                renderer.render(scene, camera);
                const a = document.createElement('a');
                a.download = 'minecraft-3d-pose.png';
                a.href = renderer.domElement.toDataURL('image/png');
                a.click();
            };

            document.getElementById('btn-download-texture').onclick = () => {
                const a = document.createElement('a');
                a.download = 'skin-texture-64x64.png';
                a.href = offCanvas.toDataURL('image/png');
                a.click();
            };

            document.getElementById('input-upload-skin').onchange = (e) => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        loadSkinFromImageSrc(event.target.result);
                    };
                    reader.readAsDataURL(file);
                }
            };
        });

        function onWindowResize() {
            const container = document.getElementById('container-3d');
            if (!container || !renderer) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        window.addEventListener('resize', onWindowResize);
    </script>
</body>
</html>
