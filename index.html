<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Resimli Küp Testi</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #1a1a1a; 
            font-family: sans-serif;
            touch-action: none;
        }
        #info {
            position: absolute;
            top: 15px;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 14px;
            pointer-events: none;
            padding: 0 10px;
            box-sizing: border-box;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }
        #controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 15px;
            z-index: 10;
        }
        .btn {
            background: rgba(255, 255, 255, 0.25);
            border: 2px solid white;
            color: white;
            padding: 14px 22px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            user-select: none;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn:active {
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div id="info">Küpün üstündeki resmi görmek için butonlarla döndürün.</div>
    
    <div id="controls">
        <button class="btn" id="leftBtn">◄ Sol</button>
        <button class="btn" id="midBtn">● Sıfırla</button>
        <button class="btn" id="rightBtn">Sağ ►</button>
    </div>

    <!-- Three.js Kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        let cube;
        let targetRotationY = 0;

        // Doku (Texture) Yükleme ve Küpe Giydirme
        const textureLoader = new THREE.TextureLoader();
        textureLoader.load('deneme.png', (texture) => {
            const boxGeo = new THREE.BoxGeometry(1.8, 1.8, 1.8);
            
            // Küpün materyaline resmi kaplıyoruz
            const boxMat = new THREE.MeshStandardMaterial({ 
                map: texture, 
                transparent: true // Resim şeffafsa küpün aralarından ışık geçmesini/şeffaf görünmesini sağlar
            });
            
            cube = new THREE.Mesh(boxGeo, boxMat);
            cube.position.set(0, 0, 0);
            scene.add(cube);
        });

        camera.position.set(0, 1, 3.5);
        camera.lookAt(0, 0, 0);

        // Buton Kontrolleri
        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); targetRotationY -= Math.PI / 2; });
        document.getElementById('midBtn').addEventListener('touchstart', (e) => { e.preventDefault(); targetRotationY = 0; });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); targetRotationY += Math.PI / 2; });

        document.getElementById('leftBtn').addEventListener('click', () => { targetRotationY -= Math.PI / 2; });
        document.getElementById('midBtn').addEventListener('click', () => { targetRotationY = 0; });
        document.getElementById('rightBtn').addEventListener('click', () => { targetRotationY += Math.PI / 2; });

        // Animasyon Döngüsü
        function animate() {
            requestAnimationFrame(animate);

            if (cube) {
                // Küpü hedeflenen açıya yumuşakça döndür
                cube.rotation.y += (targetRotationY - cube.rotation.y) * 0.1;
                cube.rotation.x = 0.2; // Resmi rahat görebilmek için küpü hafif öne eğdik
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
