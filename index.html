<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlokDiyar - Öneriler Panosu</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --red: #ef4444;
      --input-bg: #1e293b;
    }

    body.theme-dark {
      --bg-primary: #0f172a;
      --bg-card: rgba(30, 41, 59, 0.7);
      --bg-card-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --input-bg: #1e293b;
    }

    body.theme-blue {
      --bg-primary: #030712;
      --bg-card: rgba(17, 24, 39, 0.8);
      --bg-card-border: rgba(59, 130, 246, 0.2);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #1d4ed8;
      --input-bg: #111827;
    }

    body.theme-voxel {
      --bg-primary: #14281d;
      --bg-card: rgba(26, 47, 35, 0.85);
      --bg-card-border: rgba(74, 222, 128, 0.2);
      --text-main: #f0fdf4;
      --text-muted: #86efac;
      --accent: #16a34a;
      --input-bg: #1c3827;
    }

    body.theme-night {
      --bg-primary: #050505;
      --bg-card: rgba(20, 20, 20, 0.9);
      --bg-card-border: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --accent: #8b5cf6;
      --input-bg: #18181b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background-color 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    body {
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--bg-card-border);
      padding: 14px 20px;
      border-radius: 16px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: var(--green);
      box-shadow: 0 0 10px var(--green);
    }

    .top-controls {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .theme-selector {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-selector span {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    .theme-btn {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      outline: none;
    }

    .theme-btn.active {
      border-color: #ffffff;
      transform: scale(1.15);
    }

    .theme-btn.t-dark { background: #0f172a; }
    .theme-btn.t-blue { background: #1e3a8a; }
    .theme-btn.t-voxel { background: #14281d; }
    .theme-btn.t-night { background: #050505; }

    .admin-toggle-btn {
      background: var(--input-bg);
      border: 1px solid var(--bg-card-border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 600;
    }

    .admin-toggle-btn:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    .admin-toggle-btn.active {
      background: rgba(239, 68, 68, 0.15);
      border-color: var(--red);
      color: var(--red);
    }

    .announcement-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--bg-card-border);
      padding: 24px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .announcement-text {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--text-main);
      font-weight: 500;
      flex: 1;
    }

    .announcement-votes {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .vote-btn {
      background: var(--input-bg);
      border: 1px solid var(--bg-card-border);
      color: var(--text-main);
      padding: 8px 14px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .vote-btn:hover:not(:disabled) {
      border-color: var(--accent);
      color: var(--accent);
    }

    .vote-btn.active-like {
      background: rgba(34, 197, 94, 0.2);
      border-color: var(--green);
      color: var(--green);
    }

    .vote-btn.active-dislike {
      background: rgba(239, 68, 68, 0.2);
      border-color: var(--red);
      color: var(--red);
    }

    .form-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--bg-card-border);
      padding: 20px;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .form-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .input-field {
      background: var(--input-bg);
      border: 1px solid var(--bg-card-border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.95rem;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--accent);
    }

    .input-nickname {
      flex: 1;
      min-width: 160px;
    }

    .input-content {
      flex: 3;
      min-width: 240px;
    }

    .submit-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .submit-btn:hover {
      background: var(--accent-hover);
    }

    .list-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 0 4px;
    }

    .list-title {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .sort-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sort-select {
      background: var(--input-bg);
      border: 1px solid var(--bg-card-border);
      color: var(--text-main);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }

    .suggestions-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .suggestion-card {
      background: var(--bg-card);
      backdrop-filter: blur(12px);
      border: 1px solid var(--bg-card-border);
      padding: 18px 20px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .suggestion-top-row {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
    }

    .suggestion-main {
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .suggestion-header {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
      color: var(--text-muted);
      flex-wrap: wrap;
    }

    .nickname-tag {
      font-weight: 700;
      color: var(--accent);
      background: rgba(59, 130, 246, 0.1);
      padding: 2px 8px;
      border-radius: 6px;
    }

    .date-tag {
      font-size: 0.78rem;
      opacity: 0.8;
    }

    .status-tag {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .status-tag.pending { background: rgba(148, 163, 184, 0.15); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.3); }
    .status-tag.planned { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .status-tag.added { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.3); }
    .status-tag.rejected { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }

    .admin-status-select {
      background: var(--input-bg);
      border: 1px solid var(--bg-card-border);
      color: var(--text-main);
      padding: 4px 8px;
      border-radius: 8px;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
    }

    .suggestion-content {
      font-size: 1rem;
      color: var(--text-main);
      word-break: break-word;
      line-height: 1.5;
    }

    .suggestion-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .delete-btn {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--red);
      color: var(--red);
      padding: 8px 12px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .delete-btn:hover {
      background: var(--red);
      color: white;
    }

    /* Yorumlar Alanı Stilleri */
    .comments-section {
      border-top: 1px solid var(--bg-card-border);
      padding-top: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .toggle-comments-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
    }

    .toggle-comments-btn:hover {
      color: var(--accent);
    }

    .comments-container {
      display: none;
      flex-direction: column;
      gap: 8px;
      background: rgba(15, 23, 42, 0.4);
      padding: 12px;
      border-radius: 12px;
    }

    .comments-container.open {
      display: flex;
    }

    .comment-item {
      font-size: 0.9rem;
      background: var(--input-bg);
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid var(--bg-card-border);
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .comment-author {
      font-weight: 700;
      color: var(--accent);
    }

    .comment-author.admin-author {
      color: var(--green);
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 4px;
    }

    .comment-input-name {
      width: 120px;
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    .comment-input-text {
      flex: 1;
      padding: 6px 10px;
      font-size: 0.85rem;
    }

    .comment-send-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }

    .comment-send-btn:hover {
      background: var(--accent-hover);
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: var(--text-muted);
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--bg-card-border);
    }

    @media (max-width: 600px) {
      .announcement-card {
        flex-direction: column;
        align-items: stretch;
      }
      .announcement-votes {
        flex-direction: row;
        justify-content: flex-start;
      }
      .form-row {
        flex-direction: column;
      }
      .input-nickname, .input-content {
        width: 100%;
      }
      .suggestion-top-row {
        flex-direction: column;
      }
      .suggestion-actions {
        width: 100%;
        justify-content: flex-end;
      }
      .comment-form {
        flex-direction: column;
      }
      .comment-input-name {
        width: 100%;
      }
    }
  </style>
</head>
<body class="theme-dark">

  <div class="container">
    
    <!-- Üst Bar, Temalar & Admin Paneli -->
    <div class="top-bar">
      <div class="status-badge">
        <div class="dot" id="statusDot"></div>
        <span id="statusText">Bağlantı Kuruluyor...</span>
      </div>
      <div class="top-controls">
        <div class="theme-selector">
          <span>Arka Plan:</span>
          <button class="theme-btn t-dark active" onclick="setTheme('dark')" title="Koyu"></button>
          <button class="theme-btn t-blue" onclick="setTheme('blue')" title="Mavi"></button>
          <button class="theme-btn t-voxel" onclick="setTheme('voxel')" title="Voxel / Yeşil"></button>
          <button class="theme-btn t-night" onclick="setTheme('night')" title="Gece"></button>
        </div>
        <button class="admin-toggle-btn" id="adminToggleBtn" onclick="toggleAdminMode()">
          <i class="fa-solid fa-lock" id="adminIcon"></i>
          <span id="adminText">Admin</span>
        </button>
      </div>
    </div>

    <!-- Karşılama / Duyuru Alanı -->
    <div class="announcement-card">
      <div class="announcement-text">
        "Merhaba Ben mecaga Minecraft benzeri olan BlokDiyar oyunu yapıyom fikrin veya düşüncen ve değiştirmesini istediğin varsa tabloya ekleyebilirsin istersen bende bakıp eklemeye çalışırım sırayla"
      </div>
      <div class="announcement-votes">
        <button class="vote-btn" id="mainLikeBtn" onclick="voteMain('like')">
          <i class="fa-regular fa-thumbs-up"></i>
          <span id="mainLikeCount">0</span>
        </button>
        <button class="vote-btn" id="mainDislikeBtn" onclick="voteMain('dislike')">
          <i class="fa-regular fa-thumbs-down"></i>
          <span id="mainDislikeCount">0</span>
        </button>
      </div>
    </div>

    <!-- Öneri Ekleme Formu -->
    <div class="form-card">
      <div class="form-title">
        <i class="fa-solid fa-lightbulb" style="color: #f59e0b;"></i>
        Yeni Öneri / Fikir Ekle
      </div>
      <div class="form-row">
        <input type="text" id="nicknameInput" class="input-field input-nickname" placeholder="Kısa takma adınız..." maxlength="20">
        <input type="text" id="contentInput" class="input-field input-content" placeholder="Takma ad | İstediğin şey veya önerin...">
      </div>
      <button class="submit-btn" onclick="addSuggestion()">
        <i class="fa-solid fa-paper-plane"></i>
        Öneriyi Gönder
      </button>
    </div>

    <!-- Liste Başlığı ve Sıralama -->
    <div class="list-header">
      <div class="list-title">
        Topluluk Önerileri (<span id="totalCount">0</span>)
      </div>
      <div class="sort-container">
        <i class="fa-solid fa-sort" style="color: var(--text-muted);"></i>
        <select id="sortSelect" class="sort-select" onchange="renderSuggestions()">
          <option value="likes">En Çok Beğenilene Göre</option>
          <option value="newest">En Yeniye Göre</option>
          <option value="oldest">En Eskiye Göre</option>
        </select>
      </div>
    </div>

    <!-- Öneri Listesi -->
    <div id="suggestionsList" class="suggestions-list">
      <div class="empty-state">
        <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
        <p style="margin-top: 10px;">Öneriler yükleniyor...</p>
      </div>
    </div>

  </div>

  <script>
    const ADMIN_PASSWORD = "1234";
    let isAdmin = localStorage.getItem('blokdiyar_admin') === 'true';

    const firebaseConfig = {
      databaseURL: "https://survival-pvp-game-default-rtdb.firebaseio.com/"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    const suggestionsRef = db.ref('suggestions');
    const mainVotesRef = db.ref('announcement_votes');

    let suggestionsData = {};
    let localVotes = JSON.parse(localStorage.getItem('blokdiyar_votes') || '{}');

    // Admin Modu
    function toggleAdminMode() {
      if (isAdmin) {
        if (confirm("Admin modundan çıkmak istiyor musunuz?")) {
          isAdmin = false;
          localStorage.removeItem('blokdiyar_admin');
          updateAdminUI();
          renderSuggestions();
        }
      } else {
        const password = prompt("Admin Şifresini Girin:");
        if (password === ADMIN_PASSWORD) {
          isAdmin = true;
          localStorage.setItem('blokdiyar_admin', 'true');
          alert("Admin girişi başarılı!");
          updateAdminUI();
          renderSuggestions();
        } else if (password !== null) {
          alert("Hatalı şifre!");
        }
      }
    }

    function updateAdminUI() {
      const btn = document.getElementById('adminToggleBtn');
      const icon = document.getElementById('adminIcon');
      const text = document.getElementById('adminText');

      if (isAdmin) {
        btn.classList.add('active');
        icon.className = 'fa-solid fa-unlock-keyhole';
        text.textContent = 'Çıkış';
      } else {
        btn.classList.remove('active');
        icon.className = 'fa-solid fa-lock';
        text.textContent = 'Admin';
      }
    }

    // Durum Değiştirme
    function changeStatus(id, newStatus) {
      if (!isAdmin) return;
      suggestionsRef.child(id).update({ status: newStatus });
    }

    // Öneri Silme
    function deleteSuggestion(id) {
      if (!isAdmin) return;
      if (confirm("Bu öneriyi kalıcı olarak silmek istediğinize emin misiniz?")) {
        suggestionsRef.child(id).remove();
      }
    }

    // Yorum Aç/Kapat
    function toggleComments(id) {
      const container = document.getElementById('comments-' + id);
      container.classList.toggle('open');
    }

    // Yorum Ekleme
    function addComment(suggestionId) {
      const nameInput = document.getElementById('comment-name-' + suggestionId);
      const textInput = document.getElementById('comment-text-' + suggestionId);

      const author = nameInput.value.trim();
      const text = textInput.value.trim();

      if (!author) {
        alert('Lütfen bir takma ad girin!');
        return;
      }
      if (!text) {
        alert('Lütfen bir yorum yazın!');
        return;
      }

      const now = new Date();
      const timeStr = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

      const commentRef = suggestionsRef.child(suggestionId).child('comments').push();
      commentRef.set({
        author: author,
        text: text,
        time: timeStr,
        isAdminComment: isAdmin
      }).then(() => {
        textInput.value = '';
      });
    }

    // Bağlantı Kontrolü
    db.ref('.info/connected').on('value', (snap) => {
      const dot = document.getElementById('statusDot');
      const text = document.getElementById('statusText');
      if (snap.val() === true) {
        dot.style.backgroundColor = 'var(--green)';
        text.textContent = 'Canlı Veritabanı Bağlı';
      } else {
        dot.style.backgroundColor = 'var(--red)';
        text.textContent = 'Bağlantı Bekleniyor...';
      }
    });

    // Tema Değiştirici
    function setTheme(theme) {
      document.body.className = 'theme-' + theme;
      document.querySelectorAll('.theme-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelector(`.theme-btn.t-${theme}`).classList.add('active');
    }

    // Duyuru Beğeni
    function voteMain(type) {
      if (localVotes['main_announcement']) {
        alert('Bu duyuru için zaten oy kullandınız!');
        return;
      }
      mainVotesRef.child(type).transaction((current) => (current || 0) + 1);
      localVotes['main_announcement'] = type;
      localStorage.setItem('blokdiyar_votes', JSON.stringify(localVotes));
      updateMainVoteUI();
    }

    mainVotesRef.on('value', (snapshot) => {
      const votes = snapshot.val() || { like: 0, dislike: 0 };
      document.getElementById('mainLikeCount').textContent = votes.like || 0;
      document.getElementById('mainDislikeCount').textContent = votes.dislike || 0;
      updateMainVoteUI();
    });

    function updateMainVoteUI() {
      const userVote = localVotes['main_announcement'];
      const likeBtn = document.getElementById('mainLikeBtn');
      const dislikeBtn = document.getElementById('mainDislikeBtn');

      likeBtn.classList.remove('active-like');
      dislikeBtn.classList.remove('active-dislike');

      if (userVote === 'like') likeBtn.classList.add('active-like');
      if (userVote === 'dislike') dislikeBtn.classList.add('active-dislike');
    }

    // Öneri Ekleme
    function addSuggestion() {
      const nicknameInput = document.getElementById('nicknameInput');
      const contentInput = document.getElementById('contentInput');

      const nickname = nicknameInput.value.trim();
      const content = contentInput.value.trim();

      if (!nickname) {
        alert('Lütfen kısa bir takma ad girin!');
        return;
      }
      if (!content) {
        alert('Lütfen öneri içeriğini yazın!');
        return;
      }

      const now = new Date();
      const dateStr = now.toLocaleDateString('tr-TR') + ' ' + now.toLocaleTimeString('tr-TR', { hour: '2-digit', minute: '2-digit' });

      const newRef = suggestionsRef.push();
      newRef.set({
        nickname: nickname,
        content: content,
        timestamp: firebase.database.ServerValue.TIMESTAMP,
        formattedDate: dateStr,
        likes: 0,
        dislikes: 0,
        status: 'pending'
      }).then(() => {
        contentInput.value = '';
      }).catch((error) => {
        alert('Gönderilirken hata oluştu: ' + error.message);
      });
    }

    // Oy Verme
    function voteSuggestion(id, type) {
      const voteKey = 'suggestion_' + id;
      if (localVotes[voteKey]) {
        alert('Bu öneri için zaten oy kullandınız!');
        return;
      }

      suggestionsRef.child(id).child(type === 'like' ? 'likes' : 'dislikes').transaction((current) => (current || 0) + 1);
      localVotes[voteKey] = type;
      localStorage.setItem('blokdiyar_votes', JSON.stringify(localVotes));
    }

    // Veritabanı Dinleyici
    suggestionsRef.on('value', (snapshot) => {
      suggestionsData = snapshot.val() || {};
      renderSuggestions();
    });

    function getStatusBadgeHtml(status, id) {
      const st = status || 'pending';
      if (isAdmin) {
        return `
          <select class="admin-status-select" onchange="changeStatus('${id}', this.value)">
            <option value="pending" ${st === 'pending' ? 'selected' : ''}>⏳ İnceleniyor</option>
            <option value="planned" ${st === 'planned' ? 'selected' : ''}>🚀 Planlanıyor</option>
            <option value="added" ${st === 'added' ? 'selected' : ''}>✅ Eklendi</option>
            <option value="rejected" ${st === 'rejected' ? 'selected' : ''}>❌ Reddedildi</option>
          </select>
        `;
      }
      switch(st) {
        case 'planned': return `<span class="status-tag planned"><i class="fa-solid fa-rocket"></i> Planlanıyor</span>`;
        case 'added': return `<span class="status-tag added"><i class="fa-solid fa-circle-check"></i> Eklendi</span>`;
        case 'rejected': return `<span class="status-tag rejected"><i class="fa-solid fa-circle-xmark"></i> Reddedildi</span>`;
        default: return `<span class="status-tag pending"><i class="fa-solid fa-hourglass-half"></i> İnceleniyor</span>`;
      }
    }

    // Liste Basma
    function renderSuggestions() {
      const listEl = document.getElementById('suggestionsList');
      const sortType = document.getElementById('sortSelect').value;

      const keys = Object.keys(suggestionsData);
      document.getElementById('totalCount').textContent = keys.length;

      if (keys.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <i class="fa-regular fa-comments fa-2x" style="margin-bottom: 8px;"></i>
            <p>Henüz hiç öneri eklenmemiş. İlk öneriyi sen yaz!</p>
          </div>
        `;
        return;
      }

      const items = keys.map(key => ({
        id: key,
        ...suggestionsData[key]
      }));

      items.sort((a, b) => {
        if (sortType === 'likes') {
          const scoreA = (a.likes || 0) - (a.dislikes || 0);
          const scoreB = (b.likes || 0) - (b.dislikes || 0);
          return scoreB - scoreA;
        } else if (sortType === 'newest') {
          return (b.timestamp || 0) - (a.timestamp || 0);
        } else if (sortType === 'oldest') {
          return (a.timestamp || 0) - (b.timestamp || 0);
        }
      });

      listEl.innerHTML = items.map(item => {
        const userVote = localVotes['suggestion_' + item.id];
        const likeActiveClass = userVote === 'like' ? 'active-like' : '';
        const dislikeActiveClass = userVote === 'dislike' ? 'active-dislike' : '';

        const deleteButtonHtml = isAdmin ? `
          <button class="delete-btn" onclick="deleteSuggestion('${item.id}')" title="Öneriyi Sil">
            <i class="fa-solid fa-trash-can"></i>
          </button>
        ` : '';

        // Yorumları Listeleme
        const commentsObj = item.comments || {};
        const commentKeys = Object.keys(commentsObj);
        const commentCount = commentKeys.length;

        const commentsHtml = commentKeys.map(cKey => {
          const com = commentsObj[cKey];
          const authorClass = com.isAdminComment ? 'comment-author admin-author' : 'comment-author';
          const badgeText = com.isAdminComment ? ' [Geliştirici]' : '';
          return `
            <div class="comment-item">
              <div class="comment-header">
                <span class="${authorClass}">${escapeHtml(com.author)}${badgeText}</span>
                <span>${com.time || ''}</span>
              </div>
              <div>${escapeHtml(com.text)}</div>
            </div>
          `;
        }).join('');

        return `
          <div class="suggestion-card">
            <div class="suggestion-top-row">
              <div class="suggestion-main">
                <div class="suggestion-header">
                  <span class="nickname-tag">${escapeHtml(item.nickname)}</span>
                  ${getStatusBadgeHtml(item.status, item.id)}
                  <span class="date-tag"><i class="fa-regular fa-clock"></i> ${item.formattedDate || ''}</span>
                </div>
                <div class="suggestion-content">
                  <strong>${escapeHtml(item.nickname)}</strong> | ${escapeHtml(item.content)}
                </div>
              </div>
              <div class="suggestion-actions">
                <button class="vote-btn ${likeActiveClass}" onclick="voteSuggestion('${item.id}', 'like')">
                  <i class="fa-regular fa-thumbs-up"></i>
                  <span>${item.likes || 0}</span>
                </button>
                <button class="vote-btn ${dislikeActiveClass}" onclick="voteSuggestion('${item.id}', 'dislike')">
                  <i class="fa-regular fa-thumbs-down"></i>
                  <span>${item.dislikes || 0}</span>
                </button>
                ${deleteButtonHtml}
              </div>
            </div>

            <!-- Yorumlar Bölümü -->
            <div class="comments-section">
              <button class="toggle-comments-btn" onclick="toggleComments('${item.id}')">
                <i class="fa-regular fa-comment-dots"></i> Yorumlar (${commentCount})
              </button>
              <div class="comments-container" id="comments-${item.id}">
                ${commentsHtml || '<p style="font-size:0.85rem; color:var(--text-muted);">Henüz yorum yapılmamış. İlk yorumu sen yaz!</p>'}
                <div class="comment-form">
                  <input type="text" id="comment-name-${item.id}" class="input-field comment-input-name" placeholder="Takma ad..." maxlength="15">
                  <input type="text" id="comment-text-${item.id}" class="input-field comment-input-text" placeholder="Yorum yaz...">
                  <button class="comment-send-btn" onclick="addComment('${item.id}')">Gönder</button>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function escapeHtml(text) {
      if (!text) return '';
      return text.replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
    }

    updateAdminUI();
  </script>
</body>
</html>
